<section class="im-react" aria-labelledby="im-react-h">
<style>
.im-react{box-sizing:border-box;width:calc(100% - 32px);max-width:880px;margin:48px auto 32px;padding:30px 24px 24px;background:#fff3d6;border:2px solid #b78a36;border-top:6px solid #a66b21;border-radius:20px;box-shadow:0 8px 24px #6c4e1814;text-align:center;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:#2b2118;line-height:1.7}
.im-react .im-react-kicker{display:inline-block;margin:0 0 12px;padding:4px 16px;border-radius:999px;background:#77501f;color:#fff;font-size:.85rem;font-weight:700;letter-spacing:.04em}
.im-react #im-react-h{font-family:inherit;font-size:clamp(1.25rem,3.5vw,1.65rem);font-weight:700;line-height:1.5;letter-spacing:normal;margin:0 0 10px;border:0;padding:0;background:none;color:#2b2118}
.im-react .im-react-lead{margin:0 0 20px;font-size:1rem;color:#54412c}
.im-react-btns{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:12px}
.im-react-btns button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:126px;font:inherit;font-size:1rem;font-weight:700;line-height:1.6;cursor:pointer;padding:16px 10px;border-radius:14px;border:2px solid #947039;background:#fff;color:#2b2118;box-shadow:0 4px 0 #d8bd8c;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s;touch-action:manipulation}
.im-react-icon{font-size:2rem;line-height:1.2}
@media(hover:hover){.im-react-btns button:hover{background:#fff9ec;border-color:#704611;box-shadow:0 6px 0 #d8bd8c;transform:translateY(-2px)}}
.im-react-btns button:active{transform:translateY(2px);box-shadow:0 1px 0 #d8bd8c}
.im-react-btns button[aria-pressed="true"]{background:#315d62;border-color:#315d62;color:#fff;box-shadow:0 4px 0 #21464a}
.im-react button:focus-visible,.im-react textarea:focus-visible{outline:3px solid #175f9a;outline-offset:4px}
.im-react .im-react-hint{margin:16px 0 0;font-size:.85rem;color:#635039}
.im-react-after{margin-top:22px;padding-top:18px;border-top:1px solid #c9ad79;text-align:left}
.im-react-after[hidden]{display:none}
.im-react-thanks{margin:0 0 10px;font-size:.95rem;color:#394d3d;text-align:center}
.im-react-after textarea{width:100%;box-sizing:border-box;min-height:4.5em;font:inherit;font-size:.95rem;padding:9px 11px;border:1px solid #d8c7a3;border-radius:8px;resize:vertical}
.im-react-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:.8rem;color:#6c5f4c}
.im-react-row button{font:inherit;font-size:.95rem;font-weight:700;cursor:pointer;border:0;border-radius:8px;min-height:44px;padding:10px 20px;background:#315d62;color:#fff}
.im-react-row button:disabled{opacity:.5;cursor:default}
@media(max-width:600px){.im-react{padding:24px 16px 20px;margin-top:36px}.im-react-btns{grid-template-columns:1fr;gap:10px}.im-react-btns button{flex-direction:row;justify-content:flex-start;min-height:64px;padding:12px 16px;gap:14px;text-align:left}.im-react-icon{flex:0 0 32px;font-size:1.75rem}.im-react .im-react-lead{font-size:.95rem}.im-react .im-react-hint{font-size:.8rem}}
@media(prefers-reduced-motion:reduce){.im-react-btns button{transition:none;transform:none}}
</style>
<p class="im-react-kicker">1タップで参加できます</p>
<h2 id="im-react-h">この記事はいかがでしたか？</h2>
<p class="im-react-lead">下のボタンをタップして、感想を教えてください。<br>あなたの反応が、次の磐田の物語につながります。</p>
<div class="im-react-btns" role="group" aria-label="記事への反応" aria-describedby="im-react-hint">
<button type="button" data-r="learned" aria-pressed="false"><span class="im-react-icon" aria-hidden="true">📖</span><span>知らなかった</span></button>
<button type="button" data-r="local" aria-pressed="false"><span class="im-react-icon" aria-hidden="true">🏠</span><span>見覚えがある・<wbr>行ってみたい</span></button>
<button type="button" data-r="more" aria-pressed="false"><span class="im-react-icon" aria-hidden="true">✍️</span><span>もっと知りたい</span></button>
</div>
<p class="im-react-hint" id="im-react-hint">登録不要・ボタンだけでOK・コメントは任意です</p>
<div class="im-react-after" hidden>
<p class="im-react-thanks" role="status">ありがとうございます！ よければ一言どうぞ（任意・公開されません）</p>
<textarea maxlength="200" aria-label="一言（公開されません）" placeholder="思い出、場所の情報、知りたいことなど"></textarea>
<div class="im-react-row"><span class="im-react-count">0 / 200</span><button type="button" class="im-react-send">送る</button></div>
</div>
<script src="/assets/js/article-reactions.js" defer></script>
</section>
