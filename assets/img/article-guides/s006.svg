<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">鮫島・小島――漁業・寺社・旧村沿革を地域資料から読むの挿絵</title><desc id="desc">evidence形式で記事固有の論点を示す図</desc><style>.ttl{font:700 30px "Yu Mincho","Noto Serif JP",serif}.sub{font:500 17px system-ui,sans-serif}.label{font:700 19px "Yu Gothic","Noto Sans JP",sans-serif}.small{font:500 16px system-ui,sans-serif}.num{font:700 17px system-ui,sans-serif;fill:white}</style><rect width="1120" height="560" rx="30" fill="#fffaf0"/><text x="62" y="62" class="sub" fill="#76532b">磐田物語｜史料の重なり</text><text x="62" y="108" class="ttl" fill="#26343c">鮫島・小島</text><text x="62" y="180" class="sub" fill="#596a72">漁業・寺社・旧村沿革を地域資料から読む</text><rect x="105" y="245" width="910" height="82" rx="22" fill="#eee2ce" stroke="#76532b" stroke-width="2"/><text x="133" y="279" class="small" fill="#76532b">史料層 1</text><text x="255" y="279" class="label"><tspan x="255" dy="0">鮫島は沿岸の農漁業村として記録された</tspan></text><rect x="145" y="350" width="830" height="82" rx="22" fill="white" stroke="#76532b" stroke-width="2"/><text x="173" y="384" class="small" fill="#76532b">史料層 2</text><text x="295" y="384" class="label"><tspan x="295" dy="0">小島の村名・寺社と鮫島との比較</tspan></text><rect x="185" y="455" width="750" height="82" rx="22" fill="#eee2ce" stroke="#76532b" stroke-width="2"/><text x="213" y="489" class="small" fill="#76532b">史料層 3</text><text x="335" y="489" class="label"><tspan x="335" dy="0">農漁業・海岸利用・寺社に残る三つの層</tspan></text></svg>