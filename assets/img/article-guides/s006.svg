<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">鮫島・小島――漁業・寺社・旧村沿革を地域資料から読むのtimeline図</title><desc id="desc">鮫島は沿岸の農漁業村として記録された、小島の村名・寺社と鮫島との比較、農漁業・海岸利用・寺社に残る三つの層を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H233" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">鮫島・小島――漁業・寺社・旧村沿革を地域資料から読む</text><path d="M92 252 H713" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#6b638c"/><circle cx="405" cy="252" r="28" fill="#6b638c"/><circle cx="660" cy="252" r="28" fill="#6b638c"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">鮫島は沿岸の農漁業村として</tspan><tspan x="150" dy="25">記録された</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">小島の村名・寺社と鮫島との</tspan><tspan x="405" dy="25">比較</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">農漁業・海岸利用・寺社に残</tspan><tspan x="660" dy="25">る三つの層</tspan></text></svg>