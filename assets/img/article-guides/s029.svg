<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">観音山古墳――天竜の墓地に残る円墳を読むのevidence図</title><desc id="desc">墓地の高まりが古墳と確認されるまで、古墳・寺院・墓地という三つの時間を分ける、地域資料を発掘記録へつなぐ調査手順を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H261" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">観音山古墳――天竜の墓地に残る円墳を読む</text><path d="M405 155 L679 370 H131 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="644" cy="342" r="44" fill="#dcebe5"/><circle cx="166" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">墓地の高まりが古墳と確認さ</tspan><tspan x="405" dy="25">れるまで</tspan></text><text x="644" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="644" dy="0">古墳・寺院・墓地という三つ</tspan><tspan x="644" dy="25">の時間を分ける</tspan></text><text x="166" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="166" dy="0">地域資料を発掘記録へつなぐ</tspan><tspan x="166" dy="25">調査手順</tspan></text></svg>