<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">岩井原の謎の碑――三郷の入会草刈場と明治20年の和議の挿絵</title><desc id="desc">timeline形式で記事固有の論点を示す図</desc><style>.ttl{font:700 30px "Yu Mincho","Noto Serif JP",serif}.sub{font:500 17px system-ui,sans-serif}.label{font:700 19px "Yu Gothic","Noto Sans JP",sans-serif}.small{font:500 16px system-ui,sans-serif}.num{font:700 17px system-ui,sans-serif;fill:white}</style><rect width="1120" height="560" rx="30" fill="#fffaf4"/><text x="62" y="62" class="sub" fill="#7a4528">磐田物語｜年代の流れ</text><text x="62" y="108" class="ttl" fill="#26343c">岩井原の謎の碑</text><text x="62" y="180" class="sub" fill="#596a72">三郷の入会草刈場と明治20年の和議</text><path d="M120 360 H1000" stroke="#7a4528" stroke-width="8" stroke-linecap="round"/><circle cx="180" cy="360" r="34" fill="#7a4528"/><text x="180" y="367" text-anchor="middle" class="num">1</text><text x="60" y="430" class="label"><tspan x="60" dy="0">「謎の碑」から確認できるの</tspan><tspan x="60" dy="31">は和議の記憶と移転の経過である</tspan></text><circle cx="560" cy="360" r="34" fill="#7a4528"/><text x="560" y="367" text-anchor="middle" class="num">2</text><text x="395" y="430" class="label"><tspan x="395" dy="0">入会草刈場は所有境界だけでなく</tspan><tspan x="395" dy="31">利用権の重なりから読む</tspan></text><circle cx="940" cy="360" r="34" fill="#7a4528"/><text x="940" y="367" text-anchor="middle" class="num">3</text><text x="730" y="430" class="label"><tspan x="730" dy="0">明治20年の和議を年表の</tspan><tspan x="730" dy="31">中心に置き碑文と行政文書で検証</tspan><tspan x="730" dy="31">する</tspan></text></svg>