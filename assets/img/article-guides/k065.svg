<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 445" width="1120" height="445" role="img" aria-labelledby="A0112-title A0112-desc" data-emaki-repair="A0112"><title id="A0112-title">匂坂五自治会 ――上原・上・中上・中下・新の成り立ち：本文の論点案内</title><desc id="A0112-desc">五自治会と三つの大字――同じ「匂坂」でも区分は違う。匂坂上・中・新から岩田村へ――行政統合と地名の持続。五つの名を地域史資料として残す――一覧から次の調査へ</desc><rect width="1120" height="445" rx="24" fill="#f8f2e8"/><defs><marker id="A0112-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#926440"/></marker></defs><g font-family="Meiryo,sans-serif" fill="#513420"><text x="72" y="43" font-size="17">本文の論点案内</text><text x="72" y="88" font-size="28" font-weight="700">匂坂五自治会 ――上原・上・中上・中下・新の成り立ち</text><rect x="72" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="105" cy="196" r="18" fill="#926440"/><text x="105" y="202" font-size="18" fill="white" text-anchor="middle">1</text><text x="96" y="248" font-size="20">五自治会と三つの大字――</text><text x="96" y="279" font-size="20">同じ「匂坂」でも区分は違</text><text x="96" y="310" font-size="20">う</text><path d="M378 261.0H402" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0112-arrow)"/><rect x="412" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="445" cy="196" r="18" fill="#926440"/><text x="445" y="202" font-size="18" fill="white" text-anchor="middle">2</text><text x="436" y="248" font-size="20">匂坂上・中・新から岩田村</text><text x="436" y="279" font-size="20">へ――行政統合と地名の持</text><text x="436" y="310" font-size="20">続</text><path d="M718 261.0H742" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0112-arrow)"/><rect x="752" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="785" cy="196" r="18" fill="#926440"/><text x="785" y="202" font-size="18" fill="white" text-anchor="middle">3</text><text x="776" y="248" font-size="20">五つの名を地域史資料とし</text><text x="776" y="279" font-size="20">て残す――一覧から次の調</text><text x="776" y="310" font-size="20">査へ</text><text x="560" y="415" text-anchor="middle" font-size="16">本文の論点を並べた案内図。位置・距離を示す地図ではありません。</text></g></svg>