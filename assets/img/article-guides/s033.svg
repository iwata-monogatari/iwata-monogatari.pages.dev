<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">天竜の諏訪神社――旧村社・合祀・渡船場の記録を読むのlayers図</title><desc id="desc">天竜の旧村社として記録された諏訪神社、渡船場と社伝を同じ物語にしない、旧村社・合祀・渡船場という三つの記録を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H224" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">天竜の諏訪神社――旧村社・合祀・渡船場の記録を読む</text><path d="M90 190 H720 L666 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L654 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">天竜の旧村社として記録され</tspan><tspan x="405" dy="25">た諏訪神社</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">渡船場と社伝を同じ物語にし</tspan><tspan x="405" dy="25">ない</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">旧村社・合祀・渡船場という</tspan><tspan x="405" dy="25">三つの記録</tspan></text></svg>