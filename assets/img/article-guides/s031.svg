<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">新島の中泉代官所門――移築文化財と子安地蔵の記憶のevidence図</title><desc id="desc">中泉の門が新島に残るまで、子安地蔵尊は別の由来として読む、移築文化財の履歴を検証するを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H254" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">新島の中泉代官所門――移築文化財と子安地蔵の記憶</text><path d="M405 155 L651 370 H159 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="616" cy="342" r="44" fill="#dcebe5"/><circle cx="194" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">中泉の門が新島に残るまで</tspan></text><text x="616" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="616" dy="0">子安地蔵尊は別の由来として</tspan><tspan x="616" dy="25">読む</tspan></text><text x="194" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="194" dy="0">移築文化財の履歴を検証する</tspan></text></svg>