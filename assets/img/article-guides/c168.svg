<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">米軍機の遠州地方空襲記の論点</title>
  <desc id="desc">工場、空、海、戦後の省察を一人の回想がつなぐ構成図</desc>
  <rect width="760" height="360" rx="16" fill="#f7fbfc"/>
  <path d="M105 180H655" stroke="#8fc1d5" stroke-width="8" stroke-linecap="round"/>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(105 180)"><circle r="68" fill="#fff" stroke="#2f7fa3" stroke-width="4"/><path d="M-30 5h60v35h-60zM-20-25h12v30h-12zM0-38h12V5H0zM20-15h12V5H20z" fill="#d9edf5" stroke="#356f88" stroke-width="2"/><text y="88" fill="#29495a" font-size="17" font-weight="700">軍需工場</text></g>
    <g transform="translate(288 180)"><circle r="68" fill="#fff" stroke="#2f7fa3" stroke-width="4"/><path d="M-46 4L46-16 5 16-4 45-17 20-42 27z" fill="#d9edf5" stroke="#356f88" stroke-width="2"/><text y="88" fill="#29495a" font-size="17" font-weight="700">空襲と退避</text></g>
    <g transform="translate(472 180)"><circle r="68" fill="#fff" stroke="#2f7fa3" stroke-width="4"/><path d="M-48 20q24-22 48 0t48 0M-25-5h48l-10 20h-28z" fill="none" stroke="#356f88" stroke-width="4"/><text y="88" fill="#29495a" font-size="17" font-weight="700">遠州灘の漁船</text></g>
    <g transform="translate(655 180)"><circle r="68" fill="#fff" stroke="#2f7fa3" stroke-width="4"/><path d="M-28-32h50q10 0 10 10v52q-20-8-32 7-12-15-32-7v-58q0-4 4-4z" fill="#eef5f1" stroke="#356f88" stroke-width="3"/><path d="M0-30v67" stroke="#356f88" stroke-width="3"/><text y="88" fill="#29495a" font-size="17" font-weight="700">戦後の省察</text></g>
    <text x="380" y="42" fill="#2d637c" font-size="22" font-weight="700">一人の回想がつなぐ、遠州の戦争</text>
    <text x="380" y="330" fill="#5b6b74" font-size="14">個人の回想と同時代記録が、出来事の細部を結ぶ</text>
  </g>
</svg>
