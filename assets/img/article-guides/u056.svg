<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">長野地区の小字・地名資料――鮫島・野箱・草崎・前野・新島・長須賀の挿絵</title><desc id="desc">index形式で記事固有の論点を示す図</desc><style>.ttl{font:700 30px "Yu Mincho","Noto Serif JP",serif}.sub{font:500 17px system-ui,sans-serif}.label{font:700 19px "Yu Gothic","Noto Sans JP",sans-serif}.small{font:500 16px system-ui,sans-serif}.num{font:700 17px system-ui,sans-serif;fill:white}</style><rect width="1120" height="560" rx="30" fill="#fbfdf8"/><text x="62" y="62" class="sub" fill="#48683a">磐田物語｜地名の配置</text><text x="62" y="108" class="ttl" fill="#26343c">長野地区の小字・地名資料</text><text x="62" y="180" class="sub" fill="#596a72">鮫島・野箱・草崎・前野・新島・長須賀</text><path d="M85 290 L190 255 L355 300 L320 475 L130 460 Z" fill="#e4eedc" stroke="#48683a" stroke-width="3"/><circle cx="137" cy="317" r="20" fill="#48683a"/><text x="137" y="323" text-anchor="middle" class="num">1</text><text x="120" y="380" class="label"><tspan x="120" dy="0">長野地区の一覧を、掲載単位か</tspan><tspan x="120" dy="31">ら読む</tspan></text><path d="M420 290 L525 255 L690 300 L655 475 L465 460 Z" fill="#e4eedc" stroke="#48683a" stroke-width="3"/><circle cx="472" cy="317" r="20" fill="#48683a"/><text x="472" y="323" text-anchor="middle" class="num">2</text><text x="455" y="380" class="label"><tspan x="455" dy="0">水・道・屋敷・信仰の</tspan><tspan x="455" dy="31">四群に分ける</tspan></text><path d="M755 290 L860 255 L1025 300 L990 475 L800 460 Z" fill="#e4eedc" stroke="#48683a" stroke-width="3"/><circle cx="807" cy="317" r="20" fill="#48683a"/><text x="807" y="323" text-anchor="middle" class="num">3</text><text x="790" y="380" class="label"><tspan x="790" dy="0">長野地区の小字に残る境界・</tspan><tspan x="790" dy="31">水利・生活語彙</tspan></text></svg>