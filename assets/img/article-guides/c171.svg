<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">空襲体験から戦後思想へ</title><desc id="desc">1945年の体験、敗戦後の約40年、1984年の執筆、現在の読解をつなぐ時間図</desc><rect width="760" height="340" rx="16" fill="#f7fbfc"/><g font-family="sans-serif" text-anchor="middle"><text x="380" y="42" fill="#2d637c" font-size="22" font-weight="700">体験した時と、意味を書いた時を分ける</text><path d="M95 166H665" stroke="#8fc1d5" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="#2f7fa3" stroke-width="4"><circle cx="95" cy="166" r="58"/><circle cx="285" cy="166" r="58"/><circle cx="475" cy="166" r="58"/><circle cx="665" cy="166" r="58"/></g><g fill="#29495a" font-size="16"><text x="95" y="158">1945年</text><text x="95" y="181">空襲体験</text><text x="285" y="158">敗戦後</text><text x="285" y="181">約40年</text><text x="475" y="158">1984年</text><text x="475" y="181">私家版刊行</text><text x="665" y="158">現在</text><text x="665" y="181">史料読解</text></g><text x="380" y="300" fill="#5b6b74" font-size="14">記憶の正確さと、記憶に与えた意味は別の問いである</text></g></svg>
