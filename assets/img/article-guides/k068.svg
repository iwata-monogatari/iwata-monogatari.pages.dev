<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">向笠の太田川治水――「悪魔の川」伝説と三右衛門堤の挿絵</title><desc id="desc">terrain形式で記事固有の論点を示す図</desc><style>.ttl{font:700 30px "Yu Mincho","Noto Serif JP",serif}.sub{font:500 17px system-ui,sans-serif}.label{font:700 19px "Yu Gothic","Noto Sans JP",sans-serif}.small{font:500 16px system-ui,sans-serif}.num{font:700 17px system-ui,sans-serif;fill:white}</style><rect width="1120" height="560" rx="30" fill="#f7fcfc"/><text x="62" y="62" class="sub" fill="#246b78">磐田物語｜土地と水の関係</text><text x="62" y="108" class="ttl" fill="#26343c">向笠の太田川治水</text><text x="62" y="180" class="sub" fill="#596a72">「悪魔の川」伝説と三右衛門堤</text><path d="M0 410 C180 330 310 470 505 390 S850 305 1120 390 V560 H0 Z" fill="#dceff1"/><path d="M0 410 C180 330 310 470 505 390 S850 305 1120 390" fill="none" stroke="#246b78" stroke-width="10"/><rect x="90" y="250" width="280" height="128" rx="20" fill="white" stroke="#246b78" stroke-width="2"/><circle cx="124" cy="284" r="19" fill="#246b78"/><text x="124" y="290" text-anchor="middle" class="num">1</text><text x="155" y="292" class="label"><tspan x="155" dy="0">太田川は農業用水の恵みと</tspan><tspan x="155" dy="31">砂礫河床の難しさを併せ持つ</tspan></text><rect x="420" y="315" width="280" height="128" rx="20" fill="white" stroke="#246b78" stroke-width="2"/><circle cx="454" cy="349" r="19" fill="#246b78"/><text x="454" y="355" text-anchor="middle" class="num">2</text><text x="485" y="357" class="label"><tspan x="485" dy="0">「悪魔の川」伝説は流路を</tspan><tspan x="485" dy="31">めぐる対立の記憶を伝える</tspan></text><rect x="750" y="235" width="280" height="128" rx="20" fill="white" stroke="#246b78" stroke-width="2"/><circle cx="784" cy="269" r="19" fill="#246b78"/><text x="784" y="275" text-anchor="middle" class="num">3</text><text x="815" y="277" class="label"><tspan x="815" dy="0">三右衛門堤は人物伝承と</tspan><tspan x="815" dy="31">堤防構造を分けて検証する</tspan></text></svg>