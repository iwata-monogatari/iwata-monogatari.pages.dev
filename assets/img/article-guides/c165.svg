<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" data-emaki-repair="A0099">
  <title id="title">磐田の公衆衛生を支えた四つの層</title>
  <desc id="desc">家庭、学校と検診、衛生組合、町村施設が相互に結び付く構造を示す。</desc>
  <rect width="960" height="520" rx="24" fill="#fbf8ef" />
  <path d="M310 325H340 M620 325H650 M480 220V270" fill="none" stroke="#845438" stroke-width="4" stroke-linecap="round" />
  <g font-family="Meiryo,sans-serif" text-anchor="middle">
    <rect x="340" y="270" width="280" height="115" rx="18" fill="#f2ebdd" stroke="#845438" stroke-width="2" /><g transform="translate(120 220)"><rect width="190" height="205" rx="18" fill="#fff" stroke="#3a7b91" stroke-width="4" /><path d="M56 74h78v48H56z M47 74l48-42 48 42" fill="none" stroke="#3a7b91" stroke-width="6" /><text x="95" y="153" font-size="23" fill="#263b44"><tspan x="95" dy="0">家庭の清掃</tspan><tspan x="95" dy="30">療養</tspan></text></g>
    <g transform="translate(375 70)"><rect width="210" height="150" rx="18" fill="#eef6f3" stroke="#477d70" stroke-width="4" /><circle cx="70" cy="67" r="28" fill="none" stroke="#477d70" stroke-width="6" transform="translate(0 -14)" /><path d="M90 88l34 34M55 120h100" stroke="#477d70" stroke-width="6" transform="translate(0 -14)" /><text x="105" y="142" font-size="23" fill="#263b44">学校・検診</text></g>
    <g transform="translate(650 220)"><rect width="190" height="205" rx="18" fill="#fff4df" stroke="#a46f2e" stroke-width="4" /><path d="M52 96h86M66 96V54h58v42M48 122h94" fill="none" stroke="#a46f2e" stroke-width="6" /><text x="95" y="153" font-size="23" fill="#263b44"><tspan x="95" dy="0">町村の施設</tspan><tspan x="95" dy="30">処理</tspan></text></g>
    <text x="480" y="335" font-size="28" font-weight="700" fill="#2e6174">衛生組合</text><text x="480" y="370" font-size="20" fill="#526a72">各戸と行政をつなぐ</text>
    <text x="480" y="472" font-size="20" fill="#526a72">予防は一施設ではなく、生活・検診・組織・環境整備の重なりで働く</text>
  </g>
</svg>