<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">中泉旧市街の町名変遷――中央町・七軒町・田町・石原町などの挿絵</title><desc id="desc">timeline形式で記事固有の論点を示す図</desc><style>.ttl{font:700 30px "Yu Mincho","Noto Serif JP",serif}.sub{font:500 17px system-ui,sans-serif}.label{font:700 19px "Yu Gothic","Noto Sans JP",sans-serif}.small{font:500 16px system-ui,sans-serif}.num{font:700 17px system-ui,sans-serif;fill:white}</style><rect width="1120" height="560" rx="30" fill="#fffaf4"/><text x="62" y="62" class="sub" fill="#7a4528">磐田物語｜年代の流れ</text><text x="62" y="108" class="ttl" fill="#26343c">中泉旧市街の町名変遷</text><text x="62" y="180" class="sub" fill="#596a72">中央町・七軒町・田町・石原町など</text><path d="M120 360 H1000" stroke="#7a4528" stroke-width="8" stroke-linecap="round"/><circle cx="180" cy="360" r="34" fill="#7a4528"/><text x="180" y="367" text-anchor="middle" class="num">1</text><text x="60" y="430" class="label"><tspan x="60" dy="0">「中泉」と町内名は、異なる縮尺の</tspan><tspan x="60" dy="31">名前である</tspan></text><circle cx="560" cy="360" r="34" fill="#7a4528"/><text x="560" y="367" text-anchor="middle" class="num">2</text><text x="395" y="430" class="label"><tspan x="395" dy="0">中央町・七軒町・田町・</tspan><tspan x="395" dy="31">石原町を比べて読む</tspan></text><circle cx="940" cy="360" r="34" fill="#7a4528"/><text x="940" y="367" text-anchor="middle" class="num">3</text><text x="730" y="430" class="label"><tspan x="730" dy="0">町名変遷表は、境界ではなく変化の</tspan><tspan x="730" dy="31">入口として使う</tspan></text></svg>