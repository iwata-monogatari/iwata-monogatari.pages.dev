<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">向笠竹之内――城館伝承・古墳・新豊院山を読み分けるのevidence図</title><desc id="desc">竹之内原と竹之内は住所・自治会・小字の層を確かめる、新豊院山古墳群は発掘成果から読み城館伝承と混ぜない、学校と道を置くと竹之内の生活圏が現在までつながるを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H233" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">向笠竹之内――城館伝承・古墳・新豊院山を読み分ける</text><path d="M405 155 L672 370 H138 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="637" cy="342" r="44" fill="#dcebe5"/><circle cx="173" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">竹之内原と竹之内は住所・自</tspan><tspan x="405" dy="25">治会・小字の層を確かめる</tspan></text><text x="637" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="637" dy="0">新豊院山古墳群は発掘成果か</tspan><tspan x="637" dy="25">ら読み城館伝承と混ぜない</tspan></text><text x="173" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="173" dy="0">学校と道を置くと竹之内の生</tspan><tspan x="173" dy="25">活圏が現在までつながる</tspan></text></svg>