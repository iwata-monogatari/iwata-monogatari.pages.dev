<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">坊中村と鍬影村 ── 鎌田に合流した二つの旧村の挿絵</title><desc id="desc">comparison形式で記事固有の論点を示す図</desc><style>.ttl{font:700 30px "Yu Mincho","Noto Serif JP",serif}.sub{font:500 17px system-ui,sans-serif}.label{font:700 19px "Yu Gothic","Noto Sans JP",sans-serif}.small{font:500 16px system-ui,sans-serif}.num{font:700 17px system-ui,sans-serif;fill:white}</style><rect width="1120" height="560" rx="30" fill="#fdf9fe"/><text x="62" y="62" class="sub" fill="#6b4a74">磐田物語｜地域の比較</text><text x="62" y="108" class="ttl" fill="#26343c">坊中村と鍬影村</text><text x="62" y="180" class="sub" fill="#596a72">鎌田に合流した二つの旧村</text><circle cx="405" cy="370" r="155" fill="#ede1f0" stroke="#6b4a74" stroke-width="3"/><circle cx="715" cy="370" r="155" fill="#f5ead8" stroke="#6b4a74" stroke-width="3"/><path d="M560 245 A155 155 0 0 1 560 495 A155 155 0 0 1 560 245" fill="#fff" opacity=".82"/><text x="275" y="350" class="label"><tspan x="275" dy="0">坊中村 ── 医王寺の</tspan><tspan x="275" dy="31">周囲に生まれた名</tspan></text><text x="675" y="350" class="label"><tspan x="675" dy="0">鍬影村 ── 農耕と</tspan><tspan x="675" dy="31">神明宮を結ぶ説明</tspan></text><text x="500" y="390" class="small"><tspan x="500" dy="0">消えた村名を現在へ</tspan><tspan x="500" dy="31">つなぐ方法</tspan></text></svg>