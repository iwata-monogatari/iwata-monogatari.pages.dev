<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 445" width="1120" height="445" role="img" aria-labelledby="A0116-title A0116-desc" data-emaki-repair="A0116"><title id="A0116-title">五ヶ村出作場から向笠新屋へ ――開墾地の集落化と水辺の暮らし：本文の論点案内</title><desc id="A0116-desc">「五ヶ村出作場」は一村の固有名ではなく土地利用を示す。新屋原と向笠新屋は同じ物語へまとめず段階を比べる。現在の町名から過去を読むには行政名と生活圏を分ける</desc><rect width="1120" height="445" rx="24" fill="#f8f2e8"/><defs><marker id="A0116-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#926440"/></marker></defs><g font-family="Meiryo,sans-serif" fill="#513420"><text x="72" y="43" font-size="17">本文の論点案内</text><text x="72" y="88" font-size="28" font-weight="700">五ヶ村出作場から向笠新屋へ ――開墾地の集落化と水辺の暮らし</text><rect x="72" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="105" cy="196" r="18" fill="#926440"/><text x="105" y="202" font-size="18" fill="white" text-anchor="middle">1</text><text x="96" y="248" font-size="20">「五ヶ村出作場」は一村の</text><text x="96" y="279" font-size="20">固有名ではなく土地利用を</text><text x="96" y="310" font-size="20">示す</text><path d="M378 261.0H402" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0116-arrow)"/><rect x="412" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="445" cy="196" r="18" fill="#926440"/><text x="445" y="202" font-size="18" fill="white" text-anchor="middle">2</text><text x="436" y="248" font-size="20">新屋原と向笠新屋は同じ物</text><text x="436" y="279" font-size="20">語へまとめず段階を比べる</text><path d="M718 261.0H742" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0116-arrow)"/><rect x="752" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="785" cy="196" r="18" fill="#926440"/><text x="785" y="202" font-size="18" fill="white" text-anchor="middle">3</text><text x="776" y="248" font-size="20">現在の町名から過去を読む</text><text x="776" y="279" font-size="20">には行政名と生活圏を分け</text><text x="776" y="310" font-size="20">る</text><text x="560" y="415" text-anchor="middle" font-size="16">本文の論点を並べた案内図。位置・距離を示す地図ではありません。</text></g></svg>