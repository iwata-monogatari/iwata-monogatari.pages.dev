<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">遠州灘の漁船機銃掃射</title><desc id="desc">港から沖合へ出た漁船が攻撃され、漂流と救助を経て帰港する流れ</desc><rect width="760" height="340" rx="16" fill="#f7fbfc"/><g font-family="sans-serif" text-anchor="middle"><text x="380" y="42" fill="#2d637c" font-size="22" font-weight="700">海の仕事が、航空戦の中へ入る</text><path d="M70 190q85-34 170 0t170 0t170 0t110 0" fill="none" stroke="#8fc1d5" stroke-width="8"/><g fill="#fff" stroke="#2f7fa3" stroke-width="4"><circle cx="105" cy="160" r="58"/><circle cx="288" cy="160" r="58"/><circle cx="472" cy="160" r="58"/><circle cx="655" cy="160" r="58"/></g><g fill="#29495a" font-size="16"><text x="105" y="154">港から</text><text x="105" y="177">出漁</text><text x="288" y="154">低空機の</text><text x="288" y="177">攻撃</text><text x="472" y="154">海上へ退避・</text><text x="472" y="177">漂流</text><text x="655" y="154">救助・</text><text x="655" y="177">帰港</text></g><text x="380" y="300" fill="#5b6b74" font-size="14">攻撃後にも、捜索・救助・生活再建の時間が続いた</text></g></svg>
