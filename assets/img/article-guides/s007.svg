<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">野箱・白拍子――地名伝承と石塔・墓の記憶を読み分けるのlayers図</title><desc id="desc">野箱の千手供養塔は伝承を記録する物証、白拍子という地名と傾城塚の複数説、石塔・塚・町名が伝える記憶の違いを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H387" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">野箱・白拍子――地名伝承と石塔・墓の記憶を読み分ける</text><path d="M90 190 H720 L647 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L673 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">野箱の千手供養塔は伝承を記</tspan><tspan x="405" dy="25">録する物証</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">白拍子という地名と傾城塚の</tspan><tspan x="405" dy="25">複数説</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">石塔・塚・町名が伝える記憶</tspan><tspan x="405" dy="25">の違い</tspan></text></svg>