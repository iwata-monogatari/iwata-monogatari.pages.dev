<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
<title id="title">南御厨地区の小字・地名資料── 東脇・新出・和口・東新屋・大立野の論点図</title><desc id="desc">記事の三つの主要節を順番に示す概念図</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef3e6"/><stop offset="1" stop-color="#fffdf7"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5f773a"/></marker></defs>
<style>.ttl{font:700 28px 'Yu Mincho','Noto Serif JP',serif;fill:#34451e}.sub{font:500 17px system-ui,sans-serif;fill:#5f773a}.card{font:600 20px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#34451e}.num{font:700 18px system-ui,sans-serif;fill:white}</style>
<rect width="1120" height="540" rx="28" fill="url(#bg)"/><path d="M0 178 C220 142 368 214 560 178 S910 142 1120 178" fill="none" stroke="#5f773a" stroke-width="3" opacity=".35"/>
<text x="80" y="82" class="sub">磐田物語｜記事の読み方</text><text x="80" y="128" class="ttl"><tspan x="80" dy="0">南御厨地区の小字・地名資料</tspan><tspan x="80" dy="34">東脇・新出・和口・東新屋・大立野</tspan></text>
<g><rect x="70" y="270" width="290" height="170" rx="18" fill="#ffffff" stroke="#5f773a" stroke-width="2"/><circle cx="108" cy="308" r="18" fill="#5f773a"/><text x="108" y="315" text-anchor="middle" class="num">1</text><text x="100" y="356" class="card"><tspan x="100" dy="0">「南御厨」というまとまりができるま</tspan><tspan x="100" dy="27">で</tspan></text></g><g><rect x="420" y="270" width="290" height="170" rx="18" fill="#ffffff" stroke="#5f773a" stroke-width="2"/><circle cx="458" cy="308" r="18" fill="#5f773a"/><text x="458" y="315" text-anchor="middle" class="num">2</text><text x="450" y="356" class="card"><tspan x="450" dy="0">東脇・和口・東新屋・新出・大立野の</tspan><tspan x="450" dy="27">名</tspan></text></g><g><rect x="770" y="270" width="290" height="170" rx="18" fill="#ffffff" stroke="#5f773a" stroke-width="2"/><circle cx="808" cy="308" r="18" fill="#5f773a"/><text x="808" y="315" text-anchor="middle" class="num">3</text><text x="800" y="356" class="card"><tspan x="800" dy="0">低地の地名を将来の調査へ残す</tspan></text></g><path d="M360 355 H408" stroke="#5f773a" stroke-width="4" marker-end="url(#arrow)"/><path d="M710 355 H758" stroke="#5f773a" stroke-width="4" marker-end="url(#arrow)"/><text x="560" y="492" text-anchor="middle" class="sub">記録された事実 → 地域の変化 → 史料の限界を分けて読む</text></svg>