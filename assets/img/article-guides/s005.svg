<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">上岡田・下岡田――旧村沿革と義民碑・寺社の記録のtimeline図</title><desc id="desc">下岡田の旧村記録と水争いの痕跡、上岡田の寺社・施設と近代の町内像、水利事件・寺社・町名を分けて読むを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H333" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">上岡田・下岡田――旧村沿革と義民碑・寺社の記録</text><path d="M92 252 H729" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#477c72"/><circle cx="405" cy="252" r="28" fill="#477c72"/><circle cx="660" cy="252" r="28" fill="#477c72"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">下岡田の旧村記録と水争いの</tspan><tspan x="150" dy="25">痕跡</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">上岡田の寺社・施設と近代の</tspan><tspan x="405" dy="25">町内像</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">水利事件・寺社・町名を分け</tspan><tspan x="660" dy="25">て読む</tspan></text></svg>