<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">日本楽器の戦時生産と工場空襲</title><desc id="desc">平時の技術、軍需生産、空襲、戦後の産業再編をつなぐ図</desc><rect width="760" height="340" rx="16" fill="#f7fbfc"/><g font-family="sans-serif" text-anchor="middle"><text x="380" y="42" fill="#2d637c" font-size="22" font-weight="700">工場の時間を、働く人の側からたどる</text><path d="M105 165H655" stroke="#8fc1d5" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="#2f7fa3" stroke-width="4"><circle cx="105" cy="165" r="62"/><circle cx="288" cy="165" r="62"/><circle cx="472" cy="165" r="62"/><circle cx="655" cy="165" r="62"/></g><g fill="#29495a" font-size="16"><text x="105" y="158">楽器製造の</text><text x="105" y="181">設備・技能</text><text x="288" y="158">軍需生産へ</text><text x="288" y="181">組み込み</text><text x="472" y="158">警報・退避・</text><text x="472" y="181">空襲</text><text x="655" y="158">敗戦後の</text><text x="655" y="181">設備転用</text></g><text x="380" y="300" fill="#5b6b74" font-size="14">企業史料と個人回想を重ね、確定事項と未確認事項を分ける</text></g></svg>
