<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">磐田市の地名と町名の由来 ── 磐田の地名をたどるの挿絵</title><desc id="desc">layers形式で記事固有の論点を示す図</desc><style>.ttl{font:700 30px "Yu Mincho","Noto Serif JP",serif}.sub{font:500 17px system-ui,sans-serif}.label{font:700 19px "Yu Gothic","Noto Sans JP",sans-serif}.small{font:500 16px system-ui,sans-serif}.num{font:700 17px system-ui,sans-serif;fill:white}</style><rect width="1120" height="560" rx="30" fill="#fafcff"/><text x="62" y="62" class="sub" fill="#465b75">磐田物語｜時代層の断面</text><text x="62" y="108" class="ttl" fill="#26343c">磐田市の地名と町名の由来</text><text x="62" y="180" class="sub" fill="#596a72">磐田の地名をたどる</text><path d="M120 245 H1000 L950 317 H170 Z" fill="#e0e8f1" stroke="#465b75" stroke-width="2"/><text x="155" y="287" class="small" fill="#465b75">時代層 1</text><text x="330" y="287" class="label"><tspan x="330" dy="0">地名は、土地の記憶である</tspan></text><path d="M120 345 H1000 L950 417 H170 Z" fill="white" stroke="#465b75" stroke-width="2"/><text x="155" y="387" class="small" fill="#465b75">時代層 2</text><text x="330" y="387" class="label"><tspan x="330" dy="0">「水」と市場の記憶──中泉・二之宮</tspan></text><path d="M120 445 H1000 L950 517 H170 Z" fill="#e0e8f1" stroke="#465b75" stroke-width="2"/><text x="155" y="487" class="small" fill="#465b75">時代層 3</text><text x="330" y="487" class="label"><tspan x="330" dy="0">確認できる記録</tspan></text></svg>