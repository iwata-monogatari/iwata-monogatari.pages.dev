<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520"><title>新島・長須賀――新居村から二つの大字への読み方</title><desc>記事の三つの論点を順に示す図</desc><rect width="1120" height="520" rx="30" fill="#fffdf7"/><text x="52" y="78" font-size="34" font-weight="700" fill="#22303a">新島・長須賀</text><text x="52" y="125" font-size="22" fill="#5b6b74">地域資料の記載・解釈・未確認事項を分けて読む</text><rect x="40" y="190" width="320" height="250" rx="24" fill="#e9f3fa" stroke="#2f7fa3"/><text x="68" y="245" font-size="25" font-weight="700" fill="#1f4f6f">1</text><foreignObject x="68" y="270" width="264" height="135"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 25px/1.45 sans-serif;color:#22303a">新島は新居村の分村として記録される</div></foreignObject><rect x="400" y="190" width="320" height="250" rx="24" fill="#d9ede5" stroke="#2f7fa3"/><text x="428" y="245" font-size="25" font-weight="700" fill="#1f4f6f">2</text><foreignObject x="428" y="270" width="264" height="135"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 25px/1.45 sans-serif;color:#22303a">長須賀は池田庄の文書へ接続する</div></foreignObject><rect x="760" y="190" width="320" height="250" rx="24" fill="#f5e9d4" stroke="#2f7fa3"/><text x="788" y="245" font-size="25" font-weight="700" fill="#1f4f6f">3</text><foreignObject x="788" y="270" width="264" height="135"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 25px/1.45 sans-serif;color:#22303a">村名・地形・文化財を別々に検証する</div></foreignObject></svg>