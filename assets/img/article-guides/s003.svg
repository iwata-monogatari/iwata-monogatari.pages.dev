<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">千手堂・万正寺――寺院名を残す二つの旧村を読むのlayers図</title><desc id="desc">千手堂という村名と六地蔵の記録、万正寺の村名と寺社記録を分ける、寺院名が残した記憶と廃絶理由の空白を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H332" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">千手堂・万正寺――寺院名を残す二つの旧村を読む</text><path d="M90 190 H720 L654 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L666 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">千手堂という村名と六地蔵の</tspan><tspan x="405" dy="25">記録</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">万正寺の村名と寺社記録を分</tspan><tspan x="405" dy="25">ける</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">寺院名が残した記憶と廃絶理</tspan><tspan x="405" dy="25">由の空白</tspan></text></svg>