<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 445" width="1120" height="445" role="img" aria-labelledby="A0165-title A0165-desc" data-emaki-repair="A0165"><title id="A0165-title">東新町一〜三丁目 ――県営住宅団地から自治会へ：本文の論点案内</title><desc id="A0165-desc">昭和四十九年の団地造成――土地と町内組織は同時ではない。一〜三丁目と自治会――同じ東新町の中をどう分けたか。会館・浄化施設・公園――住宅地を生活圏にした場所</desc><rect width="1120" height="445" rx="24" fill="#f8f2e8"/><defs><marker id="A0165-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#926440"/></marker></defs><g font-family="Meiryo,sans-serif" fill="#513420"><text x="72" y="43" font-size="17">本文の論点案内</text><text x="72" y="88" font-size="28" font-weight="700">東新町一〜三丁目 ――県営住宅団地から自治会へ</text><rect x="72" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="105" cy="196" r="18" fill="#926440"/><text x="105" y="202" font-size="18" fill="white" text-anchor="middle">1</text><text x="96" y="248" font-size="20">昭和四十九年の団地造成―</text><text x="96" y="279" font-size="20">―土地と町内組織は同時で</text><text x="96" y="310" font-size="20">はない</text><path d="M378 261.0H402" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0165-arrow)"/><rect x="412" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="445" cy="196" r="18" fill="#926440"/><text x="445" y="202" font-size="18" fill="white" text-anchor="middle">2</text><text x="436" y="248" font-size="20">一〜三丁目と自治会――同</text><text x="436" y="279" font-size="20">じ東新町の中をどう分けた</text><text x="436" y="310" font-size="20">か</text><path d="M718 261.0H742" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0165-arrow)"/><rect x="752" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="785" cy="196" r="18" fill="#926440"/><text x="785" y="202" font-size="18" fill="white" text-anchor="middle">3</text><text x="776" y="248" font-size="20">会館・浄化施設・公園――</text><text x="776" y="279" font-size="20">住宅地を生活圏にした場所</text><text x="560" y="415" text-anchor="middle" font-size="16">本文の論点を並べた案内図。位置・距離を示す地図ではありません。</text></g></svg>