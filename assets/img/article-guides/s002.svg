<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">豊島・北島――二つの旧村名と寺社・暮らしの記録のlayers図</title><desc id="desc">豊島は二つの村名をどう継いだか、北島の旧称・寺社と豊島との違い、二つの村名変化から見える豊島・北島を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H360" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">豊島・北島――二つの旧村名と寺社・暮らしの記録</text><path d="M90 190 H720 L650 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L670 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">豊島は二つの村名をどう継い</tspan><tspan x="405" dy="25">だか</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">北島の旧称・寺社と豊島との</tspan><tspan x="405" dy="25">違い</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">二つの村名変化から見える豊</tspan><tspan x="405" dy="25">島・北島</tspan></text></svg>