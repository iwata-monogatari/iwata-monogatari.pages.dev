<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" data-emaki-repair="A0101">
  <title id="title">昭和期の子どもの遊びを成立させた四つの条件</title>
  <desc id="desc">場所、材料、仲間、季節が重なる中央に遊びが生まれる構造を示す。</desc>
  <rect width="960" height="520" rx="24" fill="#f8fbf5" />
  <g font-family="Meiryo,sans-serif" text-anchor="middle">
    <circle cx="480" cy="270" r="105" fill="#fff4c9" stroke="#c29036" stroke-width="5" /><text x="480" y="242" font-size="30" font-weight="700" fill="#5d542e"><tspan x="480" dy="0">子どもの</tspan><tspan x="480" dy="38">遊び</tspan></text><text x="480" y="322" font-size="17" fill="#68623e">規則・工夫・記憶</text>
    <g stroke="#8bb19d" stroke-width="7"><path d="M395 205L265 125" /><path d="M565 205L695 125" /><path d="M395 335L265 415" /><path d="M565 335L695 415" /></g>
    <g><rect x="95" y="65" width="260" height="110" rx="22" fill="#dcece2" /><text x="225" y="112" font-size="27" font-weight="700" fill="#345d4a">場所</text><text x="225" y="145" font-size="19">路地・原っぱ・水辺</text></g>
    <g><rect x="605" y="65" width="260" height="110" rx="22" fill="#e4edf5" /><text x="735" y="112" font-size="27" font-weight="700" fill="#3f6178">材料</text><text x="735" y="145" font-size="19">竹・紙・木の実・市販品</text></g>
    <g><rect x="95" y="365" width="260" height="110" rx="22" fill="#f4e4dc" /><text x="225" y="412" font-size="27" font-weight="700" fill="#815a4d">仲間</text><text x="225" y="445" font-size="19">異年齢・教え手・参加</text></g>
    <g><rect x="605" y="365" width="260" height="110" rx="22" fill="#eee4f2" /><text x="735" y="412" font-size="27" font-weight="700" fill="#6f5879">季節</text><text x="735" y="445" font-size="19">風・収穫・虫・行事</text></g>
  </g>
</svg>