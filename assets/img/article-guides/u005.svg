<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">新貝――古墳・寺院・工場群が重なる旧村の歩みの挿絵</title><desc id="desc">timeline形式で記事固有の論点を示す図</desc><style>.ttl{font:700 30px "Yu Mincho","Noto Serif JP",serif}.sub{font:500 17px system-ui,sans-serif}.label{font:700 19px "Yu Gothic","Noto Sans JP",sans-serif}.small{font:500 16px system-ui,sans-serif}.num{font:700 17px system-ui,sans-serif;fill:white}</style><rect width="1120" height="560" rx="30" fill="#fffaf4"/><text x="62" y="62" class="sub" fill="#7a4528">磐田物語｜年代の流れ</text><text x="62" y="108" class="ttl" fill="#26343c">新貝</text><text x="62" y="180" class="sub" fill="#596a72">古墳・寺院・工場群が重なる旧村の歩み</text><path d="M120 360 H1000" stroke="#7a4528" stroke-width="8" stroke-linecap="round"/><circle cx="180" cy="360" r="34" fill="#7a4528"/><text x="180" y="367" text-anchor="middle" class="num">1</text><text x="60" y="430" class="label"><tspan x="60" dy="0">旧新貝村――台地の縁と</tspan><tspan x="60" dy="31">太田川右岸のあいだ</tspan></text><circle cx="560" cy="360" r="34" fill="#7a4528"/><text x="560" y="367" text-anchor="middle" class="num">2</text><text x="395" y="430" class="label"><tspan x="395" dy="0">松林山古墳・連城寺古墳群――</tspan><tspan x="395" dy="31">数値と発見経緯を分ける</tspan></text><circle cx="940" cy="360" r="34" fill="#7a4528"/><text x="940" y="367" text-anchor="middle" class="num">3</text><text x="730" y="430" class="label"><tspan x="730" dy="0">八幡宮・連城寺から東部台地工場</tspan><tspan x="730" dy="31">群へ――残るものと変わるもの</tspan></text></svg>