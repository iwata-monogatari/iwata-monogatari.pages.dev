<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">岩田神社――人見神社伝承と近代の合祀のritual図</title><desc id="desc">匂坂中の鎮守を、現在から過去へさかのぼる、近代の合祀――「一社になった」を単純化しない、祭典を受け継ぐ現在――伝承を検証可能な記録にするを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H265" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・RITUAL</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">岩田神社――人見神社伝承と近代の合祀</text><circle cx="405" cy="278" r="113" fill="#fff" stroke="#6b638c" stroke-width="4"/><path d="M405 278 L170 180 M405 278 L640 180 M405 278 L405 410" stroke="#244c57" stroke-width="3"/><circle cx="170" cy="180" r="58" fill="#f7e8dc"/><circle cx="640" cy="180" r="58" fill="#e2eee9"/><circle cx="405" cy="392" r="52" fill="#e6e6f0"/><text x="170" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="170" dy="0">匂坂中の鎮守を、現在から過</tspan><tspan x="170" dy="25">去へさかのぼる</tspan></text><text x="640" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="640" dy="0">近代の合祀――「一社になっ</tspan><tspan x="640" dy="25">た」を単純化しない</tspan></text><text x="405" y="395" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">祭典を受け継ぐ現在――伝承</tspan><tspan x="405" dy="25">を検証可能な記録にする</tspan></text></svg>