<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>掛塚まつり2026 日程と見学の確認</title><desc>10月17日は宵祭り、18日は本祭り。旧津倉家は両日9時から16時。掛塚磐田駅線は通常ダイヤで日曜運休。</desc><rect width="1200" height="630" fill="#f6f1e7"/><path d="M0 0H1200V16H0Z" fill="#245366"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#233943"><text x="60" y="84" font-size="24" letter-spacing="4">磐田物語　／　竜洋</text><text x="60" y="157" font-size="50" font-weight="bold">掛塚まつり 2026</text><text x="60" y="204" font-size="24">日付と、見学前に確かめること</text><rect x="60" y="245" width="528" height="170" rx="12" fill="#245366"/><rect x="612" y="245" width="528" height="170" rx="12" fill="#864b42"/><g fill="#fff"><text x="90" y="311" font-size="45" font-weight="bold">10月17日（土）</text><text x="90" y="373" font-size="31">宵祭り</text><text x="642" y="311" font-size="45" font-weight="bold">10月18日（日）</text><text x="642" y="373" font-size="31">本祭り</text></g><text x="60" y="476" font-size="29">旧津倉家公開　両日 9:00〜16:00</text><text x="60" y="527" font-size="29">掛塚磐田駅線　通常ダイヤで日曜運休</text><text x="60" y="587" font-size="21">屋台の集合時刻・公式地図・往復の交通は本文から確認</text></g></svg>