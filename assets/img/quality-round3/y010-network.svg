<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc">
<title id="title">豊岡の祭り・寺社・里山信仰：三つの手がかり</title><desc id="desc">寺社は集落を読む目印、祭りがつなぐ人と場所、山と水への祈りをどう扱うかを結んで記事の構成を示す図</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ae7040"/></marker></defs>
<rect width="810" height="455" rx="24" fill="#edf4e9"/><text x="40" y="54" font-size="15" font-weight="700" fill="#ae7040" letter-spacing="2">磐田物語・図解</text>
<text x="40" y="92" font-size="27" font-weight="700" fill="#3f603b">豊岡の祭り・寺社・里山信仰</text><text x="40" y="122" font-size="16" fill="#3f603b">三つの手がかり</text><path d="M405 240 L170 220" stroke="#ae7040" stroke-width="4"/><circle cx="170" cy="220" r="68" fill="#fff" stroke="#3f603b" stroke-width="2"/><text x="170" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#3f603b"><tspan x="170" dy="0">寺社は集落</tspan><tspan x="170" dy="25">を読む目印</tspan></text><path d="M405 240 L640 220" stroke="#ae7040" stroke-width="4"/><circle cx="640" cy="220" r="68" fill="#fff" stroke="#3f603b" stroke-width="2"/><text x="640" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#3f603b"><tspan x="640" dy="0">祭りがつな</tspan><tspan x="640" dy="25">ぐ人と場所</tspan></text><path d="M405 240 L405 370" stroke="#ae7040" stroke-width="4"/><circle cx="405" cy="370" r="68" fill="#fff" stroke="#3f603b" stroke-width="2"/><text x="405" y="363" text-anchor="middle" font-size="16" font-weight="700" fill="#3f603b"><tspan x="405" dy="0">山と水への祈り</tspan><tspan x="405" dy="25">をどう扱うか</tspan></text><circle cx="405" cy="240" r="72" fill="#3f603b"/><text x="405" y="232" text-anchor="middle" font-size="18" fill="#fff">照合して</text><text x="405" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">地域像を読む</text></svg>