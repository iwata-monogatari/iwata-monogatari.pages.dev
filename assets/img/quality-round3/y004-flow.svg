<rect width="810" height="455" rx="24" fill="#edf4e9"/><text x="40" y="54" font-size="15" font-weight="700" fill="#ae7040" letter-spacing="2">磐田物語・図解</text>
<text x="40" y="92" font-size="27" font-weight="700" fill="#3f603b">野部村と上野部・下野部</text><text x="40" y="122" font-size="16" fill="#3f603b">記事を読む順序</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#3f603b" stroke-width="2"/><text x="152" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#3f603b"><tspan x="152" dy="0">上野部と下野部</tspan><tspan x="152" dy="26">を分けて見る</tspan></text><path d="M268 228 H300" stroke="#ae7040" stroke-width="5" marker-end="url(#arrow)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#3f603b" stroke-width="2"/><text x="422" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#3f603b"><tspan x="422" dy="0">鉄道以前の道、</tspan><tspan x="422" dy="26">鉄道以後の動線</tspan></text><path d="M538 228 H570" stroke="#ae7040" stroke-width="5" marker-end="url(#arrow)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#3f603b" stroke-width="2"/><text x="692" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#3f603b"><tspan x="692" dy="0">旧野部村を現</tspan><tspan x="692" dy="26">在へつなぐ</tspan></text></svg>