<text x="40" y="92" font-size="27" font-weight="700" fill="#365e52">西貝塚・明ヶ島・大原周辺の遺跡群 ──磐田原台地南東縁の考古…</text><text x="40" y="122" font-size="16" fill="#365e52">記事を読む順序</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#365e52" stroke-width="2"/><text x="152" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#365e52"><tspan x="152" dy="0">磐田原台地南東</tspan><tspan x="152" dy="26">縁という舞台</tspan></text><path d="M268 228 H300" stroke="#b87543" stroke-width="5" marker-end="url(#arrow)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#365e52" stroke-width="2"/><text x="422" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#365e52"><tspan x="422" dy="0">城之崎遺跡へ ── </tspan><tspan x="422" dy="26">貝塚から弥生の集落…</tspan></text><path d="M538 228 H570" stroke="#b87543" stroke-width="5" marker-end="url(#arrow)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#365e52" stroke-width="2"/><text x="692" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#365e52"><tspan x="692" dy="0">西貝塚遺跡 ── </tspan><tspan x="692" dy="26">遠江貝塚群のひとつ</tspan></text></svg>