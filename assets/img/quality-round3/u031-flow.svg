<title id="title">西貝塚・明ヶ島・大原周辺の遺跡群 ──磐田原台地南東縁の考古学的景観：記事を読む順序</title><desc id="desc">磐田原台地南東縁という舞台、城之崎遺跡へ ── 貝塚から弥生の集落、そして古墳へ、西貝塚遺跡 ── 遠江貝塚群のひとつを結んで記事の構成を示す図</desc>
