<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">天竜川河口付近での遭難船の歴史から産業の記憶を読むのtimeline図</title><desc id="desc">事実・伝承・推定を分ける、確認を進める順序、大石ひろゆきを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H323" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">天竜川河口付近での遭難船の歴史から産業の記憶を読む</text><path d="M92 252 H719" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#477c72"/><circle cx="405" cy="252" r="28" fill="#477c72"/><circle cx="660" cy="252" r="28" fill="#477c72"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">事実・伝承・推定を分ける</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">確認を進める順序</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">大石ひろゆき</tspan></text></svg>