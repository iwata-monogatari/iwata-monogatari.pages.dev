<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc">
<title id="title">今之浦と大池の消滅・埋立て ──生き残った調整池と、失われた旧河道：記事を読む順序</title><desc id="desc">「消滅」したのは大池ではない、大池が生き延びた理由、大池はどのような池だったかを結んで記事の構成を示す図</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a36f55"/></marker></defs>
<rect width="810" height="455" rx="24" fill="#f1edf5"/><text x="40" y="54" font-size="15" font-weight="700" fill="#a36f55" letter-spacing="2">磐田物語・図解</text>
<text x="40" y="92" font-size="27" font-weight="700" fill="#5b4d6c">今之浦と大池の消滅・埋立て ──生き残った調整池と、失われた…</text><text x="40" y="122" font-size="16" fill="#5b4d6c">記事を読む順序</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#5b4d6c" stroke-width="2"/><text x="152" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#5b4d6c"><tspan x="152" dy="0">「消滅」したの</tspan><tspan x="152" dy="26">は大池ではない</tspan></text><path d="M268 228 H300" stroke="#a36f55" stroke-width="5" marker-end="url(#arrow)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#5b4d6c" stroke-width="2"/><text x="422" y="238" text-anchor="middle"  font-size="18" font-weight="700" fill="#5b4d6c"><tspan x="422" dy="0">大池が生き延びた理由</tspan></text><path d="M538 228 H570" stroke="#a36f55" stroke-width="5" marker-end="url(#arrow)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#5b4d6c" stroke-width="2"/><text x="692" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#5b4d6c"><tspan x="692" dy="0">大池はどのよう</tspan><tspan x="692" dy="26">な池だったか</tspan></text></svg>