<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc">
<title id="title">鎌田神明宮大祭：記事を読む順序</title><desc id="desc">御厨六地区の屋台が集まる大祭、式年遷宮は長い周期で社殿と祭、鎌田御厨や十七郷十九社との関を結んで記事の構成を示す図</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b56c3a"/></marker></defs>
<rect width="810" height="455" rx="24" fill="#f5eee4"/><text x="40" y="54" font-size="15" font-weight="700" fill="#b56c3a" letter-spacing="2">磐田物語・図解</text>
<text x="40" y="92" font-size="27" font-weight="700" fill="#57432f">鎌田神明宮大祭</text><text x="40" y="122" font-size="16" fill="#57432f">記事を読む順序</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#57432f" stroke-width="2"/><text x="152" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#57432f"><tspan x="152" dy="0">御厨六地区の屋</tspan><tspan x="152" dy="26">台が集まる大祭</tspan></text><path d="M268 228 H300" stroke="#b56c3a" stroke-width="5" marker-end="url(#arrow)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#57432f" stroke-width="2"/><text x="422" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#57432f"><tspan x="422" dy="0">式年遷宮は長い</tspan><tspan x="422" dy="26">周期で社殿と祭</tspan></text><path d="M538 228 H570" stroke="#b56c3a" stroke-width="5" marker-end="url(#arrow)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#57432f" stroke-width="2"/><text x="692" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#57432f"><tspan x="692" dy="0">鎌田御厨や十七</tspan><tspan x="692" dy="26">郷十九社との関</tspan></text></svg>