<title id="title">田原地区のお宮とお寺── 集落のまとまりを映す神社・寺院：記事を読む順序</title><desc id="desc">田原地区の神社と寺院は、分布図を読むときは、文化財指定の有無は歴史的価値を結んで記事の構成を示す図</desc>
