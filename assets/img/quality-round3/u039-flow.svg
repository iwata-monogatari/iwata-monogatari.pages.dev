<text x="40" y="92" font-size="27" font-weight="700" fill="#365e52">田原地区のお宮とお寺── 集落のまとまりを映す神社・寺院</text><text x="40" y="122" font-size="16" fill="#365e52">記事を読む順序</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#365e52" stroke-width="2"/><text x="152" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#365e52"><tspan x="152" dy="0">田原地区の神</tspan><tspan x="152" dy="26">社と寺院は</tspan></text><path d="M268 228 H300" stroke="#b87543" stroke-width="5" marker-end="url(#arrow)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#365e52" stroke-width="2"/><text x="422" y="238" text-anchor="middle"  font-size="18" font-weight="700" fill="#365e52"><tspan x="422" dy="0">分布図を読むときは</tspan></text><path d="M538 228 H570" stroke="#b87543" stroke-width="5" marker-end="url(#arrow)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#365e52" stroke-width="2"/><text x="692" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#365e52"><tspan x="692" dy="0">文化財指定の有</tspan><tspan x="692" dy="26">無は歴史的価値</tspan></text></svg>