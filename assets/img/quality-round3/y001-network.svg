<text x="40" y="92" font-size="27" font-weight="700" fill="#3f603b">敷地川と谷の集落</text><text x="40" y="122" font-size="16" fill="#3f603b">三つの手がかり</text><path d="M405 240 L170 220" stroke="#ae7040" stroke-width="4"/><circle cx="170" cy="220" r="68" fill="#fff" stroke="#3f603b" stroke-width="2"/><text x="170" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#3f603b"><tspan x="170" dy="0">川筋が決めた土</tspan><tspan x="170" dy="25">地の使い分け</tspan></text><path d="M405 240 L640 220" stroke="#ae7040" stroke-width="4"/><circle cx="640" cy="220" r="68" fill="#fff" stroke="#3f603b" stroke-width="2"/><text x="640" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#3f603b"><tspan x="640" dy="0">橋と道が結ぶ</tspan><tspan x="640" dy="25">谷の暮らし</tspan></text><path d="M405 240 L405 370" stroke="#ae7040" stroke-width="4"/><circle cx="405" cy="370" r="68" fill="#fff" stroke="#3f603b" stroke-width="2"/><text x="405" y="363" text-anchor="middle" font-size="16" font-weight="700" fill="#3f603b"><tspan x="405" dy="0">流域として</tspan><tspan x="405" dy="25">豊岡を見る</tspan></text><circle cx="405" cy="240" r="72" fill="#3f603b"/><text x="405" y="232" text-anchor="middle" font-size="18" fill="#fff">照合して</text><text x="405" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">地域像を読む</text></svg>