<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc">
<title id="title">今之浦と大池の消滅・埋立て ──生き残った調整池と、失われた旧河道：三つの手がかり</title><desc id="desc">大池はどのような池だったか、明治の開拓計画と、それを止めた男、松岡萬ゆかりの美術品と、磐田市への寄贈を結んで記事の構成を示す図</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a36f55"/></marker></defs>
<rect width="810" height="455" rx="24" fill="#f1edf5"/><text x="40" y="54" font-size="15" font-weight="700" fill="#a36f55" letter-spacing="2">磐田物語・図解</text>
<text x="40" y="92" font-size="27" font-weight="700" fill="#5b4d6c">今之浦と大池の消滅・埋立て ──生き残った調整池と、失われた…</text><text x="40" y="122" font-size="16" fill="#5b4d6c">三つの手がかり</text><path d="M405 240 L170 220" stroke="#a36f55" stroke-width="4"/><circle cx="170" cy="220" r="68" fill="#fff" stroke="#5b4d6c" stroke-width="2"/><text x="170" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#5b4d6c"><tspan x="170" dy="0">大池はどのよう</tspan><tspan x="170" dy="25">な池だったか</tspan></text><path d="M405 240 L640 220" stroke="#a36f55" stroke-width="4"/><circle cx="640" cy="220" r="68" fill="#fff" stroke="#5b4d6c" stroke-width="2"/><text x="640" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#5b4d6c"><tspan x="640" dy="0">明治の開拓計画</tspan><tspan x="640" dy="25">と、それを止…</tspan></text><path d="M405 240 L405 370" stroke="#a36f55" stroke-width="4"/><circle cx="405" cy="370" r="68" fill="#fff" stroke="#5b4d6c" stroke-width="2"/><text x="405" y="363" text-anchor="middle" font-size="16" font-weight="700" fill="#5b4d6c"><tspan x="405" dy="0">松岡萬ゆかりの</tspan><tspan x="405" dy="25">美術品と、磐…</tspan></text><circle cx="405" cy="240" r="72" fill="#5b4d6c"/><text x="405" y="232" text-anchor="middle" font-size="18" fill="#fff">照合して</text><text x="405" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">地域像を読む</text></svg>