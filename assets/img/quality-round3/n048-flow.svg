<title id="title">中泉御殿と関ヶ原の戦い ──家康滞在記録をたどる：記事を読む順序</title><desc id="desc">板坂卜斎が記した、その日の家康、東海道の宿泊地としての中泉御殿、史料の性格 ── 卜斎記と関原始末記を結んで記事の構成を示す図</desc>
