<text x="40" y="92" font-size="27" font-weight="700" fill="#4e3a66">中泉御殿と関ヶ原の戦い ──家康滞在記録をたどる</text><text x="40" y="122" font-size="16" fill="#4e3a66">記事を読む順序</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#4e3a66" stroke-width="2"/><text x="152" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#4e3a66"><tspan x="152" dy="0">板坂卜斎が記した</tspan><tspan x="152" dy="26">、その日の家康</tspan></text><path d="M268 228 H300" stroke="#8c6daf" stroke-width="5" marker-end="url(#arrow)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#4e3a66" stroke-width="2"/><text x="422" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#4e3a66"><tspan x="422" dy="0">東海道の宿泊地と</tspan><tspan x="422" dy="26">しての中泉御殿</tspan></text><path d="M538 228 H570" stroke="#8c6daf" stroke-width="5" marker-end="url(#arrow)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#4e3a66" stroke-width="2"/><text x="692" y="226" text-anchor="middle"  font-size="18" font-weight="700" fill="#4e3a66"><tspan x="692" dy="0">史料の性格 ── </tspan><tspan x="692" dy="26">卜斎記と関原始末記</tspan></text></svg>