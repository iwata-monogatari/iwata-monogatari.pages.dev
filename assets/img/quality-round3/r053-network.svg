<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">竜洋地区の学校の歴史を地域の記憶として読むのtimeline図</title><desc id="desc">地区史へのつなぎ方、大石ひろゆき、相談窓口を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H237" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">竜洋地区の学校の歴史を地域の記憶として読む</text><path d="M92 252 H717" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#b45f3d"/><circle cx="405" cy="252" r="28" fill="#b45f3d"/><circle cx="660" cy="252" r="28" fill="#b45f3d"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">地区史へのつなぎ方</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">大石ひろゆき</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">相談窓口</tspan></text></svg>