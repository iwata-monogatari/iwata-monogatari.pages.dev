<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">竜洋地区の大火災の歴史を地域の記憶として読むのtimeline図</title><desc id="desc">本稿の要点、地区史へのつなぎ方、確認を進める順序を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H376" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">竜洋地区の大火災の歴史を地域の記憶として読む</text><path d="M92 252 H730" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#6b638c"/><circle cx="405" cy="252" r="28" fill="#6b638c"/><circle cx="660" cy="252" r="28" fill="#6b638c"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">本稿の要点</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">地区史へのつなぎ方</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">確認を進める順序</tspan></text></svg>