<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-labelledby="title"><title id="title">計算練習の循環</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#417b9d"/></marker></defs><rect width="400" height="430" rx="16" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="200" y="35" text-anchor="middle" font-size="20" fill="#243c4b" font-weight="700">珠算・暗算の練習を考える</text><circle cx="100" cy="130" r="60" fill="#edf5fa" stroke="#93b8d0"/><text x="100" y="135" text-anchor="middle" font-size="16" fill="#243c4b" font-weight="400">数を聞く</text><circle cx="300" cy="130" r="60" fill="#edf5fa" stroke="#93b8d0"/><text x="300" y="135" text-anchor="middle" font-size="16" fill="#243c4b" font-weight="400">計算する</text><circle cx="300" cy="290" r="60" fill="#edf5fa" stroke="#93b8d0"/><text x="300" y="295" text-anchor="middle" font-size="16" fill="#243c4b" font-weight="400">結果を見る</text><circle cx="100" cy="290" r="60" fill="#edf5fa" stroke="#93b8d0"/><text x="100" y="295" text-anchor="middle" font-size="16" fill="#243c4b" font-weight="400">また試す</text><path d="M165 130 L230 130" fill="none" stroke="#417b9d" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 195 L300 220" fill="none" stroke="#417b9d" stroke-width="2" marker-end="url(#arrow)"/><path d="M235 290 L170 290" fill="none" stroke="#417b9d" stroke-width="2" marker-end="url(#arrow)"/><path d="M100 225 L100 200" fill="none" stroke="#417b9d" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="388" text-anchor="middle" font-size="14" fill="#243c4b" font-weight="400">録音は「聞く」機会を繰り返し届ける</text><text x="200" y="412" text-anchor="middle" font-size="12" fill="#5b6e7b" font-weight="400">本文の説明を整理した概念図</text></g></svg>
