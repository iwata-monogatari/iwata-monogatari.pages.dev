<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="title"><title id="title">研修所の学習と交流と運営</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#417b9d"/></marker></defs><rect width="400" height="420" rx="16" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="200" y="34" text-anchor="middle" font-size="20" fill="#243c4b" font-weight="700">町の教室で行われたこと</text><rect x="35" y="64" width="330" height="70" rx="10" fill="#dcecf5" stroke="#a9c8da"/><text x="200" y="94" text-anchor="middle" font-size="20" fill="#243c4b" font-weight="700">英語・数学・理科</text><text x="200" y="119" text-anchor="middle" font-size="14" fill="#243c4b" font-weight="400">大学生による学習の指導</text><circle cx="65" cy="182" r="25" fill="#edf5fa" stroke="#a9c8da"/><text x="65" y="188" text-anchor="middle" font-size="16" fill="#243c4b" font-weight="400">表現</text><path d="M95 182 L120 182" fill="none" stroke="#417b9d" stroke-width="2"/><text x="135" y="188" text-anchor="start" font-size="17" fill="#243c4b" font-weight="400">作文・文通</text><circle cx="65" cy="252" r="25" fill="#edf5fa" stroke="#a9c8da"/><text x="65" y="258" text-anchor="middle" font-size="16" fill="#243c4b" font-weight="400">交流</text><path d="M95 252 L120 252" fill="none" stroke="#417b9d" stroke-width="2"/><text x="135" y="258" text-anchor="start" font-size="17" fill="#243c4b" font-weight="400">遠足・季節の集まり</text><circle cx="65" cy="322" r="25" fill="#edf5fa" stroke="#a9c8da"/><text x="65" y="328" text-anchor="middle" font-size="16" fill="#243c4b" font-weight="400">運営</text><path d="M95 322 L120 322" fill="none" stroke="#417b9d" stroke-width="2"/><text x="135" y="328" text-anchor="start" font-size="17" fill="#243c4b" font-weight="400">茶を入れる・掃除する</text><text x="200" y="392" text-anchor="middle" font-size="12" fill="#5b6e7b" font-weight="400">活動の種類を示し、実施回数は示さない</text></g></svg>
