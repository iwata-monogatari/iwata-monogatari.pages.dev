<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">磐田唯一の酒蔵・千寿酒造と近代産業 ──台地の伏流水が生んだ酒と煉瓦と材木のevidence図</title><desc id="desc">「福田村の酒造家」は誤伝だった、煉瓦と材木、もう二つの近代産業、磐田原台地の伏流水が育てた、千寿酒造を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H284" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">磐田唯一の酒蔵・千寿酒造と近代産業 ──台地の伏流水が生んだ…</text><path d="M405 155 L656 370 H154 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="621" cy="342" r="44" fill="#dcebe5"/><circle cx="189" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">「福田村の酒造家」は誤伝だ</tspan><tspan x="405" dy="25">った</tspan></text><text x="621" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="621" dy="0">煉瓦と材木、もう二つの近代</tspan><tspan x="621" dy="25">産業</tspan></text><text x="189" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="189" dy="0">磐田原台地の伏流水が育てた</tspan><tspan x="189" dy="25">、千寿酒造</tspan></text></svg>