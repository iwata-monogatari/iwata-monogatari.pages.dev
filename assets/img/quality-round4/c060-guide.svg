<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">車丁が押した鉄路――中泉軌道の人車・馬力運行と旅客利用の記事読解図</title><desc id="desc">人が押して走った、中泉の鉄路、貨物だけでなく、人も運んだ、人車軌道という選択の背景を順に示す図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b36a43"/></marker></defs><rect width="810" height="455" rx="24" fill="#edf5f1"/><text x="40" y="54" font-size="15" font-weight="700" fill="#b36a43" letter-spacing="2">磐田物語・読解ガイド</text><text x="40" y="92" font-size="25" font-weight="700" fill="#315d5a">車丁が押した鉄路――中泉軌道の人車・馬力運行と旅客利用</text><text x="40" y="122" font-size="16" fill="#315d5a">記事固有の論点を結ぶ</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#315d5a" stroke-width="2"/><text x="152" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#315d5a"><tspan x="152" dy="0">人が押して走った、中</tspan><tspan x="152" dy="26">泉の鉄路</tspan></text><path d="M268 228 H300" stroke="#b36a43" stroke-width="5" marker-end="url(#a)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#315d5a" stroke-width="2"/><text x="422" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#315d5a"><tspan x="422" dy="0">貨物だけでなく、人も</tspan><tspan x="422" dy="26">運んだ</tspan></text><path d="M538 228 H570" stroke="#b36a43" stroke-width="5" marker-end="url(#a)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#315d5a" stroke-width="2"/><text x="692" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#315d5a"><tspan x="692" dy="0">人車軌道という選択の</tspan><tspan x="692" dy="26">背景</tspan></text></svg>