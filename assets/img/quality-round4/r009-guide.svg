<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">掛塚の豪商・吉岡家と廻船問屋の繁栄 ── 江戸・信州を結ぶ木材流通のダイナミズムのbiography図</title><desc id="desc">信州の森から江戸の街へ：木材流通のダイナミズム、湊の富を地域文化と公共インフラへ還元した商人魂、掛塚を代表する豪商・吉岡家の商法と経済力を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H246" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・BIOGRAPHY</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">掛塚の豪商・吉岡家と廻船問屋の繁栄 ── 江戸・信州を結ぶ木…</text><path d="M90 365 Q230 186,360 300 T720 185" fill="none" stroke="#477c72" stroke-width="9"/><rect x="88" y="305" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><rect x="320" y="230" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><rect x="552" y="145" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><text x="173" y="343" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="173" dy="0">信州の森から江戸の街へ：木</tspan><tspan x="173" dy="25">材流通のダイナミズム</tspan></text><text x="405" y="268" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">湊の富を地域文化と公共イン</tspan><tspan x="405" dy="25">フラへ還元した商人魂</tspan></text><text x="637" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="637" dy="0">掛塚を代表する豪商・吉岡家</tspan><tspan x="637" dy="25">の商法と経済力</tspan></text></svg>