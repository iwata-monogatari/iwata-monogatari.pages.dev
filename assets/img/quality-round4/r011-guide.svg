<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">竜洋町の誕生と近代行政のあゆみ ── 掛塚・十束・袖浦が描いた「竜の洋」の合併史のtimeline図</title><desc id="desc">昭和の大合併と「竜洋町」命名の理念、河口の町から工業・住宅・観光を調和させた近代都市へ、行政合併に先行した「学校組合」という広域連携の芽を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H290" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">竜洋町の誕生と近代行政のあゆみ ── 掛塚・十束・袖浦が描い…</text><path d="M92 252 H728" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#b45f3d"/><circle cx="405" cy="252" r="28" fill="#b45f3d"/><circle cx="660" cy="252" r="28" fill="#b45f3d"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">昭和の大合併と「竜洋町」命</tspan><tspan x="150" dy="25">名の理念</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">河口の町から工業・住宅・観</tspan><tspan x="405" dy="25">光を調和させた近代都市へ</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">行政合併に先行した「学校組</tspan><tspan x="660" dy="25">合」という広域連携の芽</tspan></text></svg>