<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">福田の寺社仏閣と信仰の歴史 ── 海上安全と家内安全を祈る海のまちの社寺のtimeline図</title><desc id="desc">太田川河口を見守る「津島神社」の由緒と水神信仰、織物産業の発展と、信仰が支えた職人の暮らし、海の男たちが遺した「祈りの証」としての石灯籠を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H273" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">福田の寺社仏閣と信仰の歴史 ── 海上安全と家内安全を祈る海…</text><path d="M92 252 H711" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#6b638c"/><circle cx="405" cy="252" r="28" fill="#6b638c"/><circle cx="660" cy="252" r="28" fill="#6b638c"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">太田川河口を見守る「津島神</tspan><tspan x="150" dy="25">社」の由緒と水神信仰</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">織物産業の発展と、信仰が支</tspan><tspan x="405" dy="25">えた職人の暮らし</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">海の男たちが遺した「祈りの</tspan><tspan x="660" dy="25">証」としての石灯籠</tspan></text></svg>