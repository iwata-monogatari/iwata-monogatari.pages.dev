<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">福島村から福田町への改称と近代行政 ── 「福の田」が紡いだ市町村沿革史のtimeline図</title><desc id="desc">海と川の間に生まれた「福島村」の誕生と混沌、自立した先進的自治体としての歩みと未来への継承、福島から「福田」へ ── 改称に込められた誇りと歴史の復権を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H277" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">福島村から福田町への改称と近代行政 ── 「福の田」が紡いだ…</text><path d="M92 252 H715" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#6b638c"/><circle cx="405" cy="252" r="28" fill="#6b638c"/><circle cx="660" cy="252" r="28" fill="#6b638c"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">海と川の間に生まれた「福島</tspan><tspan x="150" dy="25">村」の誕生と混沌</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">自立した先進的自治体として</tspan><tspan x="405" dy="25">の歩みと未来への継承</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">福島から「福田」へ ── </tspan><tspan x="660" dy="25">改称に込められた誇りと歴…</tspan></text></svg>