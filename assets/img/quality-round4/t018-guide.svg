<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">金原明善と天竜川治水の足跡 ── 「暴れ天竜」に挑んだ治水開拓者と森林保護の思想のroute図</title><desc id="desc">大洪水との遭遇と治水家としての立志、事業を支えた経営と「治河協力社」の仕組み、上流の植林と森林保全への挑戦を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H338" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">金原明善と天竜川治水の足跡 ── 「暴れ天竜」に挑んだ治水開…</text><path d="M92 310 C230 258,330 350,405 245 S610 155,718 260" fill="none" stroke="#aa7930" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">大洪水との遭遇と治水家とし</tspan><tspan x="120" dy="25">ての立志</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">事業を支えた経営と「治河協</tspan><tspan x="405" dy="25">力社」の仕組み</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">上流の植林と森林保全への挑</tspan><tspan x="690" dy="25">戦</tspan></text></svg>