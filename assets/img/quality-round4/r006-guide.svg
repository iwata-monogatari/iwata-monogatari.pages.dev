<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">白羽の風と凧揚げ文化の起源 ── 強風の台地が育んだ空への情熱のevidence図</title><desc id="desc">遠州のからっ風が吹き抜ける白羽の大地、風と遊ぶ技術の伝承と現代の凧揚げ行事、子供の健やかな成長と五穀豊穣を祈る大凧の起源を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H364" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">白羽の風と凧揚げ文化の起源 ── 強風の台地が育んだ空への情熱</text><path d="M405 155 L681 370 H129 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="646" cy="342" r="44" fill="#dcebe5"/><circle cx="164" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">遠州のからっ風が吹き抜ける</tspan><tspan x="405" dy="25">白羽の大地</tspan></text><text x="646" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="646" dy="0">風と遊ぶ技術の伝承と現代の</tspan><tspan x="646" dy="25">凧揚げ行事</tspan></text><text x="164" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="164" dy="0">子供の健やかな成長と五穀豊</tspan><tspan x="164" dy="25">穣を祈る大凧の起源</tspan></text></svg>