<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">鎌田御厨── 伊勢神宮領だった村の名残の記事読解図</title><desc id="desc">「御厨」という地名の正体、御厨地区の村々 ── 鎌田・新貝・稗原・東貝塚、鎌田神明宮 ── 伊勢の神を祀る社を順に示す図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b06b3f"/></marker></defs><rect width="810" height="455" rx="24" fill="#eef3f6"/><text x="40" y="54" font-size="15" font-weight="700" fill="#b06b3f" letter-spacing="2">磐田物語・読解ガイド</text><text x="40" y="92" font-size="25" font-weight="700" fill="#23465a">鎌田御厨── 伊勢神宮領だった村の名残</text><text x="40" y="122" font-size="16" fill="#23465a">記事固有の論点を結ぶ</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#23465a" stroke-width="2"/><text x="152" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="152" dy="0">「御厨」という地名の</tspan><tspan x="152" dy="26">正体</tspan></text><path d="M268 228 H300" stroke="#b06b3f" stroke-width="5" marker-end="url(#a)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#23465a" stroke-width="2"/><text x="422" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="422" dy="0">御厨地区の村々 ──</tspan><tspan x="422" dy="26"> 鎌田・新貝・稗原…</tspan></text><path d="M538 228 H570" stroke="#b06b3f" stroke-width="5" marker-end="url(#a)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#23465a" stroke-width="2"/><text x="692" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="692" dy="0">鎌田神明宮 ── 伊</tspan><tspan x="692" dy="26">勢の神を祀る社</tspan></text></svg>