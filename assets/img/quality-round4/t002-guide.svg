<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">行興寺と熊野（ゆや）の長藤── 紫の花に宿る、平家物語の記憶のritual図</title><desc id="desc">紫のカーテン ── 国の天然記念物、能『熊野』の舞台として、熊野御前と、平宗盛 ── 伝えられる物語を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H321" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・RITUAL</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">行興寺と熊野（ゆや）の長藤── 紫の花に宿る、平家物語の記憶</text><circle cx="405" cy="278" r="125" fill="#fff" stroke="#aa7930" stroke-width="4"/><path d="M405 278 L170 180 M405 278 L640 180 M405 278 L405 410" stroke="#244c57" stroke-width="3"/><circle cx="170" cy="180" r="58" fill="#f7e8dc"/><circle cx="640" cy="180" r="58" fill="#e2eee9"/><circle cx="405" cy="392" r="52" fill="#e6e6f0"/><text x="170" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="170" dy="0">紫のカーテン ── 国の天</tspan><tspan x="170" dy="25">然記念物</tspan></text><text x="640" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="640" dy="0">能『熊野』の舞台として</tspan></text><text x="405" y="395" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">熊野御前と、平宗盛 ── </tspan><tspan x="405" dy="25">伝えられる物語</tspan></text></svg>