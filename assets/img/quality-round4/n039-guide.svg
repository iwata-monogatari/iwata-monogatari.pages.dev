<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">中泉代官と薬師堂の再興 ── 中野七蔵・高室昌重と憲能和尚のevidence図</title><desc id="desc">元亀3年、薬師堂は焼けたのか ── 2つの伝え方、高室昌重、日光・月光と十二神将を寄進する、天領の地に城はなく、代官所があったを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H328" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">中泉代官と薬師堂の再興 ── 中野七蔵・高室昌重と憲能和尚</text><path d="M405 155 L682 370 H128 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="647" cy="342" r="44" fill="#dcebe5"/><circle cx="163" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">元亀3年、薬師堂は焼けたの</tspan><tspan x="405" dy="25">か ── 2つの伝え方</tspan></text><text x="647" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="647" dy="0">高室昌重、日光・月光と十二</tspan><tspan x="647" dy="25">神将を寄進する</tspan></text><text x="163" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="163" dy="0">天領の地に城はなく、代官所</tspan><tspan x="163" dy="25">があった</tspan></text></svg>