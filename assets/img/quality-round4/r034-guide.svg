<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">掛塚・袖浦・十束の村域変遷と石高── 江戸期の村組織史のtimeline図</title><desc id="desc">目次、十束地区の村域変遷と石高、竜洋を形づくった3地区の輪郭を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H321" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">掛塚・袖浦・十束の村域変遷と石高── 江戸期の村組織史</text><path d="M92 252 H717" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#6b638c"/><circle cx="405" cy="252" r="28" fill="#6b638c"/><circle cx="660" cy="252" r="28" fill="#6b638c"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">目次</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">十束地区の村域変遷と石高</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">竜洋を形づくった3地区の輪</tspan><tspan x="660" dy="25">郭</tspan></text></svg>