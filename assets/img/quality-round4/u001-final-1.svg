<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">「貝塚」という地名── 西貝塚・東貝塚と消えた海岸線のlayers図</title><desc id="desc">海辺でないのに「貝塚」── まず謎を確認する、磐田原台地 ── 海と陸を分けた高まり、地形史の年表 ── 海から村へを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H276" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">「貝塚」という地名── 西貝塚・東貝塚と消えた海岸線</text><path d="M90 190 H720 L662 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L658 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">海辺でないのに「貝塚」──</tspan><tspan x="405" dy="25"> まず謎を確認する</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">磐田原台地 ── 海と陸を</tspan><tspan x="405" dy="25">分けた高まり</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">地形史の年表 ── 海から</tspan><tspan x="405" dy="25">村へ</tspan></text></svg>