<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">発掘調査報告書から読む磐田の古代 ──一次資料の探し方と読み方のsources図</title><desc id="desc">発掘調査報告書とは何か、磐田市文化財課・埋蔵文化財センターの役割、磐田物語というサイトと一次資料の関係を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H363" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・SOURCES</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">発掘調査報告書から読む磐田の古代 ──一次資料の探し方と読み方</text><rect x="70" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#244c57" stroke-width="3"/><rect x="302" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#b45f3d" stroke-width="3"/><rect x="534" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#244c57" stroke-width="3"/><path d="M96 218 H248 M328 221 H480 M560 224 H712" stroke="#a9bcc0" stroke-width="3"/><text x="172" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="172" dy="0">発掘調査報告書とは何か</tspan></text><text x="404" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="404" dy="0">磐田市文化財課・埋蔵文化財</tspan><tspan x="404" dy="25">センターの役割</tspan></text><text x="636" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="636" dy="0">磐田物語というサイトと一次</tspan><tspan x="636" dy="25">資料の関係</tspan></text></svg>