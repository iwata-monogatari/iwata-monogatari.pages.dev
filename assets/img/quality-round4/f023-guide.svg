<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">東屋台と西屋台 -六社神社の秋祭りを支えた福田の二つの屋台のritual図</title><desc id="desc">このページの分担、西屋台の買入と福助の記憶、この記事についてを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H266" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・RITUAL</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">東屋台と西屋台 -六社神社の秋祭りを支えた福田の二つの屋台</text><circle cx="405" cy="278" r="114" fill="#fff" stroke="#b45f3d" stroke-width="4"/><path d="M405 278 L170 180 M405 278 L640 180 M405 278 L405 410" stroke="#244c57" stroke-width="3"/><circle cx="170" cy="180" r="58" fill="#f7e8dc"/><circle cx="640" cy="180" r="58" fill="#e2eee9"/><circle cx="405" cy="392" r="52" fill="#e6e6f0"/><text x="170" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="170" dy="0">このページの分担</tspan></text><text x="640" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="640" dy="0">西屋台の買入と福助の記憶</tspan></text><text x="405" y="395" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">この記事について</tspan></text></svg>