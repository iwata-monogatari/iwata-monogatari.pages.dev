<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">「貝塚」という地名── 西貝塚・東貝塚と消えた海岸線の記事読解図</title><desc id="desc">海辺でないのに「貝塚」── まず謎を確認する、磐田原台地 ── 海と陸を分けた高まり、地形史の年表 ── 海から村へを順に示す図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b06b3f"/></marker></defs><rect width="810" height="455" rx="24" fill="#eef3f6"/><text x="40" y="54" font-size="15" font-weight="700" fill="#b06b3f" letter-spacing="2">磐田物語・読解ガイド</text><text x="40" y="92" font-size="25" font-weight="700" fill="#23465a">「貝塚」という地名── 西貝塚・東貝塚と消えた海岸線</text><text x="40" y="122" font-size="16" fill="#23465a">記事固有の論点を結ぶ</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#23465a" stroke-width="2"/><text x="152" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="152" dy="0">海辺でないのに「貝塚</tspan><tspan x="152" dy="26">」── まず謎を確…</tspan></text><path d="M268 228 H300" stroke="#b06b3f" stroke-width="5" marker-end="url(#a)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#23465a" stroke-width="2"/><text x="422" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="422" dy="0">磐田原台地 ── 海</tspan><tspan x="422" dy="26">と陸を分けた高まり</tspan></text><path d="M538 228 H570" stroke="#b06b3f" stroke-width="5" marker-end="url(#a)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#23465a" stroke-width="2"/><text x="692" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="692" dy="0">地形史の年表 ── </tspan><tspan x="692" dy="26">海から村へ</tspan></text></svg>