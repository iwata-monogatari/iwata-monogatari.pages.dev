<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">太郎馬新田と清庵新田の開拓史 ── 太田川下流低地を拓いた江戸期の土木情熱のroute図</title><desc id="desc">地名に刻まれた江戸時代のフロンティア精神、於保村分割と福田町への編入 ── 新田地名が語る近代の行政区画、潮風と氾濫に立ち向かう決死の土木工事を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H376" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">太郎馬新田と清庵新田の開拓史 ── 太田川下流低地を拓いた江…</text><path d="M92 310 C230 231,330 350,405 245 S610 155,718 260" fill="none" stroke="#6b638c" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">地名に刻まれた江戸時代のフ</tspan><tspan x="120" dy="25">ロンティア精神</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">於保村分割と福田町への編入</tspan><tspan x="405" dy="25"> ── 新田地名が語る近…</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">潮風と氾濫に立ち向かう決死</tspan><tspan x="690" dy="25">の土木工事</tspan></text></svg>