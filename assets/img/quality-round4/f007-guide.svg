<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">福田まつりと華麗な中泉式屋台 ── 海を渡り届いた彫刻美術と笛の音のevidence図</title><desc id="desc">激しさと美しさを両立させた「二輪中泉式屋台」の魅力、福田まつりの輪郭 ── 六社神社の祭典として、屋台を飾る超一流の彫刻美術と職人魂を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H340" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">福田まつりと華麗な中泉式屋台 ── 海を渡り届いた彫刻美術と…</text><path d="M405 155 L670 370 H140 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="635" cy="342" r="44" fill="#dcebe5"/><circle cx="175" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">激しさと美しさを両立させた</tspan><tspan x="405" dy="25">「二輪中泉式屋台」の魅力</tspan></text><text x="635" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="635" dy="0">福田まつりの輪郭 ── 六</tspan><tspan x="635" dy="25">社神社の祭典として</tspan></text><text x="175" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="175" dy="0">屋台を飾る超一流の彫刻美術</tspan><tspan x="175" dy="25">と職人魂</tspan></text></svg>