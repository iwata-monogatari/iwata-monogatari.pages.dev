<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">古代磐田の税・物流・水運 ──租庸調を運んだ道と川のroute図</title><desc id="desc">租・庸・調という、三種類の税、駅家と水運 ── 税を運ぶためのインフラ、税を納めるという営みの、その先にあったものを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H245" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">古代磐田の税・物流・水運 ──租庸調を運んだ道と川</text><path d="M92 310 C230 230,330 350,405 245 S610 155,718 260" fill="none" stroke="#aa7930" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">租・庸・調という、三種類の</tspan><tspan x="120" dy="25">税</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">駅家と水運 ── 税を運ぶ</tspan><tspan x="405" dy="25">ためのインフラ</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">税を納めるという営みの、そ</tspan><tspan x="690" dy="25">の先にあったもの</tspan></text></svg>