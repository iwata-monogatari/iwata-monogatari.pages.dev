<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">古墳が神社になった土地 ──磐田の信仰空間の継承と地名の記憶のlayers図</title><desc id="desc">なぜ古墳の上に、神社が建つのか、見付天神をめぐる、信仰の重なり、御厨 ── 王の墓域が、伊勢の杜になったを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H366" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">古墳が神社になった土地 ──磐田の信仰空間の継承と地名の記憶</text><path d="M90 190 H720 L668 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L652 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">なぜ古墳の上に、神社が建つ</tspan><tspan x="405" dy="25">のか</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">見付天神をめぐる、信仰の重</tspan><tspan x="405" dy="25">なり</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">御厨 ── 王の墓域が、伊</tspan><tspan x="405" dy="25">勢の杜になった</tspan></text></svg>