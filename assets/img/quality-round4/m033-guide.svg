<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">遠州文人サロン ─ 掛塚・見付の豪商が支えた芸術のevidence図</title><desc id="desc">交易がもたらした富と教養、近代への継承と歴史的意義、吉岡家と崋山・半香の関わりを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H297" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">遠州文人サロン ─ 掛塚・見付の豪商が支えた芸術</text><path d="M405 155 L678 370 H132 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="643" cy="342" r="44" fill="#dcebe5"/><circle cx="167" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">交易がもたらした富と教養</tspan></text><text x="643" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="643" dy="0">近代への継承と歴史的意義</tspan></text><text x="167" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="167" dy="0">吉岡家と崋山・半香の関わり</tspan></text></svg>