<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">池田荘と掛塚湊の起源── 竜洋の中世荘園史のtimeline図</title><desc id="desc">目次、蓮覚寺の古碑が伝えるもの、京都・松尾神社領「池田荘」とはを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H385" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">池田荘と掛塚湊の起源── 竜洋の中世荘園史</text><path d="M92 252 H739" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#b45f3d"/><circle cx="405" cy="252" r="28" fill="#b45f3d"/><circle cx="660" cy="252" r="28" fill="#b45f3d"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">目次</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">蓮覚寺の古碑が伝えるもの</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">京都・松尾神社領「池田荘」</tspan><tspan x="660" dy="25">とは</tspan></text></svg>