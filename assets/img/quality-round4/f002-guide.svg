<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">福田港のシラス船引き網漁と沿岸漁業 ── 日本屈指の漁獲量を誇る白いダイヤの歴史のtimeline図</title><desc id="desc">漂砂の難題を克服した「近代福田漁港」の誕生、資源を絶やさないための禁漁期という知恵、二隻のコンビネーションが光る「二そう引きシラス漁」を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H354" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">福田港のシラス船引き網漁と沿岸漁業 ── 日本屈指の漁獲量を…</text><path d="M92 252 H708" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#6b638c"/><circle cx="405" cy="252" r="28" fill="#6b638c"/><circle cx="660" cy="252" r="28" fill="#6b638c"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">漂砂の難題を克服した「近代</tspan><tspan x="150" dy="25">福田漁港」の誕生</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">資源を絶やさないための禁漁</tspan><tspan x="405" dy="25">期という知恵</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">二隻のコンビネーションが光</tspan><tspan x="660" dy="25">る「二そう引きシラス漁」</tspan></text></svg>