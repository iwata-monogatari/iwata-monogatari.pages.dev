<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">袖浦村の塩づくり（製塩業） ── 遠州灘の塩害克服と生活の知恵のlayers図</title><desc id="desc">遠州灘の恵みを結晶にする砂浜の製塩業、「塩の道」と信州へ運ばれた遠州の塩、入浜式塩田という高度な技術を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H236" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">袖浦村の塩づくり（製塩業） ── 遠州灘の塩害克服と生活の知恵</text><path d="M90 190 H720 L654 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L666 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">遠州灘の恵みを結晶にする砂</tspan><tspan x="405" dy="25">浜の製塩業</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">「塩の道」と信州へ運ばれた</tspan><tspan x="405" dy="25">遠州の塩</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">入浜式塩田という高度な技術</tspan></text></svg>