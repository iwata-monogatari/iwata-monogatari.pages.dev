<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">掛塚まつりと遠州屈指の豪華屋台 ── 廻船文化が育んだ彫刻美術の粋のevidence図</title><desc id="desc">海の安全と豊漁を祈る貴船神社の秋祭り、県指定無形民俗文化財「掛塚祭屋台囃子」、廻船問屋の富が産んだ漆塗りと金箔の豪華屋台を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H362" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">掛塚まつりと遠州屈指の豪華屋台 ── 廻船文化が育んだ彫刻美…</text><path d="M405 155 L683 370 H127 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="648" cy="342" r="44" fill="#dcebe5"/><circle cx="162" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">海の安全と豊漁を祈る貴船神</tspan><tspan x="405" dy="25">社の秋祭り</tspan></text><text x="648" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="648" dy="0">県指定無形民俗文化財「掛塚</tspan><tspan x="648" dy="25">祭屋台囃子」</tspan></text><text x="162" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="162" dy="0">廻船問屋の富が産んだ漆塗り</tspan><tspan x="162" dy="25">と金箔の豪華屋台</tspan></text></svg>