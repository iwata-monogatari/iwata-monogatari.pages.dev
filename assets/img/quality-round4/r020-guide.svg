<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">室町時代以降の竜洋｜戦乱・支配・村のまとまりのlayers図</title><desc id="desc">中世荘園「池田荘」と掛塚港の起源、江戸期の天領支配と中泉代官所、戦国期の覇権争いと徳川家康の鷹狩りを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H234" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">室町時代以降の竜洋｜戦乱・支配・村のまとまり</text><path d="M90 190 H720 L656 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L664 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">中世荘園「池田荘」と掛塚港</tspan><tspan x="405" dy="25">の起源</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">江戸期の天領支配と中泉代官</tspan><tspan x="405" dy="25">所</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">戦国期の覇権争いと徳川家康</tspan><tspan x="405" dy="25">の鷹狩り</tspan></text></svg>