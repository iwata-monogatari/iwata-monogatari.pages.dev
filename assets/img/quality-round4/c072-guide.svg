<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">古代の郷名を現代地図に戻す ──中泉郷が伝える、律令の村の単位のlayers図</title><desc id="desc">郡と郷という、二重の行政単位、郷はどう区切られていたのか、中泉郷という手がかりを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H272" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">古代の郷名を現代地図に戻す ──中泉郷が伝える、律令の村の単位</text><path d="M90 190 H720 L666 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L654 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">郡と郷という、二重の行政単</tspan><tspan x="405" dy="25">位</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">郷はどう区切られていたのか</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">中泉郷という手がかり</tspan></text></svg>