<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">中泉に息づく二つの信仰拠点 ──中泉寺と大乗院三仭坊のritual図</title><desc id="desc">家康が帰依した「御殿のお寺」──中泉寺、政治の中泉、信仰の中泉、葵の御紋を許された、寺紋のいわれを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H243" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・RITUAL</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">中泉に息づく二つの信仰拠点 ──中泉寺と大乗院三仭坊</text><circle cx="405" cy="278" r="113" fill="#fff" stroke="#477c72" stroke-width="4"/><path d="M405 278 L170 180 M405 278 L640 180 M405 278 L405 410" stroke="#244c57" stroke-width="3"/><circle cx="170" cy="180" r="58" fill="#f7e8dc"/><circle cx="640" cy="180" r="58" fill="#e2eee9"/><circle cx="405" cy="392" r="52" fill="#e6e6f0"/><text x="170" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="170" dy="0">家康が帰依した「御殿のお寺</tspan><tspan x="170" dy="25">」──中泉寺</tspan></text><text x="640" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="640" dy="0">政治の中泉、信仰の中泉</tspan></text><text x="405" y="395" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">葵の御紋を許された、寺紋の</tspan><tspan x="405" dy="25">いわれ</tspan></text></svg>