<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">兜塚古墳 ──大の浦を見下ろした王の円墳と、その後の千五百年のbiography図</title><desc id="desc">静岡県内で最大の円墳、近代、古墳は軍と学校になった、確認できること・できないことを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H289" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・BIOGRAPHY</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">兜塚古墳 ──大の浦を見下ろした王の円墳と、その後の千五百年</text><path d="M90 365 Q230 169,360 300 T720 185" fill="none" stroke="#6b638c" stroke-width="9"/><rect x="88" y="305" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><rect x="320" y="230" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><rect x="552" y="145" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><text x="173" y="343" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="173" dy="0">静岡県内で最大の円墳</tspan></text><text x="405" y="268" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">近代、古墳は軍と学校になっ</tspan><tspan x="405" dy="25">た</tspan></text><text x="637" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="637" dy="0">確認できること・できないこ</tspan><tspan x="637" dy="25">と</tspan></text></svg>