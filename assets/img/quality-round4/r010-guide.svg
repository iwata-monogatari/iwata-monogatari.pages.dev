<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">竜洋大砂丘と防風林（黒松林）の維持管理 ── 飛砂との世紀の闘いと防潮の歩みのevidence図</title><desc id="desc">風と砂が織りなす「竜洋大砂丘」の地形と環境、ダムと砂利採取がもたらした「砂丘の後退」という新たな脅威、砂に埋もれる村を救うための黒松植林プロジェクトを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H237" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">竜洋大砂丘と防風林（黒松林）の維持管理 ── 飛砂との世紀の…</text><path d="M405 155 L668 370 H142 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="633" cy="342" r="44" fill="#dcebe5"/><circle cx="177" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">風と砂が織りなす「竜洋大砂</tspan><tspan x="405" dy="25">丘」の地形と環境</tspan></text><text x="633" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="633" dy="0">ダムと砂利採取がもたらした</tspan><tspan x="633" dy="25">「砂丘の後退」という新た…</tspan></text><text x="177" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="177" dy="0">砂に埋もれる村を救うための</tspan><tspan x="177" dy="25">黒松植林プロジェクト</tspan></text></svg>