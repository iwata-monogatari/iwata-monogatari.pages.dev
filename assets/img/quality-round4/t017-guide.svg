<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">船頭自治と徳川家康の朱印状 ── 天竜川左岸・池田船頭衆の特権と自立史のtimeline図</title><desc id="desc">徳川家康を救った渡船の功績と朱印状の恩恵、川会所を核とした渡船の運営組織、激流に挑む「水上のプロフェッショナル」の知恵を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H302" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">船頭自治と徳川家康の朱印状 ── 天竜川左岸・池田船頭衆の特…</text><path d="M92 252 H740" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#b45f3d"/><circle cx="405" cy="252" r="28" fill="#b45f3d"/><circle cx="660" cy="252" r="28" fill="#b45f3d"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">徳川家康を救った渡船の功績</tspan><tspan x="150" dy="25">と朱印状の恩恵</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">川会所を核とした渡船の運営</tspan><tspan x="405" dy="25">組織</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">激流に挑む「水上のプロフェ</tspan><tspan x="660" dy="25">ッショナル」の知恵</tspan></text></svg>