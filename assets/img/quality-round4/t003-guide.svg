<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">一言坂の戦いと、本多忠勝の殿（しんがり）── 磐田で武田軍を相手にした日のevidence図</title><desc id="desc">武田信玄、遠江へ、「家康に過ぎたるものが二つあり」、本多忠勝、決死の殿（しんがり）を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H338" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">一言坂の戦いと、本多忠勝の殿（しんがり）── 磐田で武田軍を…</text><path d="M405 155 L672 370 H138 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="637" cy="342" r="44" fill="#dcebe5"/><circle cx="173" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">武田信玄、遠江へ</tspan></text><text x="637" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="637" dy="0">「家康に過ぎたるものが二つ</tspan><tspan x="637" dy="25">あり」</tspan></text><text x="173" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="173" dy="0">本多忠勝、決死の殿（しんが</tspan><tspan x="173" dy="25">り）</tspan></text></svg>