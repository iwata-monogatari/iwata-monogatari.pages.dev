<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">十郎島と川袋 ── 激流に削られた輪中集落と天竜川旧流路の記憶のroute図</title><desc id="desc">暴れ天竜の流路の狭間に取り残された集落、洪水と闘い、川の堆積土を肥沃な畑地へ変えた歴史、命を守るための土木知恵：水塚と集落輪中を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H303" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">十郎島と川袋 ── 激流に削られた輪中集落と天竜川旧流路の記憶</text><path d="M92 310 C230 223,330 350,405 245 S610 155,718 260" fill="none" stroke="#6b638c" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">暴れ天竜の流路の狭間に取り</tspan><tspan x="120" dy="25">残された集落</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">洪水と闘い、川の堆積土を肥</tspan><tspan x="405" dy="25">沃な畑地へ変えた歴史</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">命を守るための土木知恵：水</tspan><tspan x="690" dy="25">塚と集落輪中</tspan></text></svg>