<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">堂山古墳 ── 全長110m、静岡県最大級の前方後円墳のevidence図</title><desc id="desc">公式情報の整理、静岡県最大級、しかし失われた墳丘、県内屈指の量と種類を誇る埴輪を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H304" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">堂山古墳 ── 全長110m、静岡県最大級の前方後円墳</text><path d="M405 155 L671 370 H139 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="636" cy="342" r="44" fill="#dcebe5"/><circle cx="174" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">公式情報の整理</tspan></text><text x="636" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="636" dy="0">静岡県最大級、しかし失われ</tspan><tspan x="636" dy="25">た墳丘</tspan></text><text x="174" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="174" dy="0">県内屈指の量と種類を誇る埴</tspan><tspan x="174" dy="25">輪</tspan></text></svg>