<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">消えゆく記憶を、少しでも後世に残したい。のevidence図</title><desc id="desc">記憶は、驚くほど簡単に消えていく、今の時代だからこそ、できること、大石浩之を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H328" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">消えゆく記憶を、少しでも後世に残したい。</text><path d="M405 155 L682 370 H128 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="647" cy="342" r="44" fill="#dcebe5"/><circle cx="163" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">記憶は、驚くほど簡単に消え</tspan><tspan x="405" dy="25">ていく</tspan></text><text x="647" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="647" dy="0">今の時代だからこそ、できる</tspan><tspan x="647" dy="25">こと</tspan></text><text x="163" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="163" dy="0">大石浩之</tspan></text></svg>