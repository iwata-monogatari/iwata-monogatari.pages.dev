<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">行興寺の近世史 ── 徳川家康の伝承と朱印地の古文書のroute図</title><desc id="desc">徳川家康と行興寺 ── 慶長8年の朱印地伝承、近世文書が伝える池田の暮らし、江戸期の朱印地をめぐる古文書を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H349" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">行興寺の近世史 ── 徳川家康の伝承と朱印地の古文書</text><path d="M92 310 C230 269,330 350,405 245 S610 155,718 260" fill="none" stroke="#477c72" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">徳川家康と行興寺 ── 慶</tspan><tspan x="120" dy="25">長8年の朱印地伝承</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">近世文書が伝える池田の暮ら</tspan><tspan x="405" dy="25">し</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">江戸期の朱印地をめぐる古文</tspan><tspan x="690" dy="25">書</tspan></text></svg>