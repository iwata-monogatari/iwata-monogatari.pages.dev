<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">天竜川がつくった村、流した村── 池田・掛塚と渡しの記憶のroute図</title><desc id="desc">天竜川とは ── 暴れ川がつくった地形、池田の渡し ── 橋のない大河を越える、低地を開く ── 新田開発と村の誕生を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H311" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">天竜川がつくった村、流した村── 池田・掛塚と渡しの記憶</text><path d="M92 310 C230 231,330 350,405 245 S610 155,718 260" fill="none" stroke="#aa7930" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">天竜川とは ── 暴れ川が</tspan><tspan x="120" dy="25">つくった地形</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">池田の渡し ── 橋のない</tspan><tspan x="405" dy="25">大河を越える</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">低地を開く ── 新田開発</tspan><tspan x="690" dy="25">と村の誕生</tspan></text></svg>