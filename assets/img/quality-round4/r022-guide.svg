<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">天竜川の変遷と竜洋｜川の流れが土地をつくり、暮らしを変えたのtimeline図</title><desc id="desc">上古の天竜川と「西遷」の歴史、氾濫原の開拓と砂との世紀の戦い、近代治水の到達点――金原明善の事業を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H358" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">天竜川の変遷と竜洋｜川の流れが土地をつくり、暮らしを変えた</text><path d="M92 252 H712" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#6b638c"/><circle cx="405" cy="252" r="28" fill="#6b638c"/><circle cx="660" cy="252" r="28" fill="#6b638c"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">上古の天竜川と「西遷」の歴</tspan><tspan x="150" dy="25">史</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">氾濫原の開拓と砂との世紀の</tspan><tspan x="405" dy="25">戦い</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">近代治水の到達点――金原明</tspan><tspan x="660" dy="25">善の事業</tspan></text></svg>