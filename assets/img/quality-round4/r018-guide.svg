<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">太古の竜洋と大の浦｜海と砂地がつくった土地の記憶のevidence図</title><desc id="desc">貝塚が語る半塩半淡の汽水湖、現代の景観への連続性、低湿地の形成と集落・耕地の広がりを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H367" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">太古の竜洋と大の浦｜海と砂地がつくった土地の記憶</text><path d="M405 155 L678 370 H132 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="643" cy="342" r="44" fill="#dcebe5"/><circle cx="167" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">貝塚が語る半塩半淡の汽水湖</tspan></text><text x="643" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="643" dy="0">現代の景観への連続性</tspan></text><text x="167" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="167" dy="0">低湿地の形成と集落・耕地の</tspan><tspan x="167" dy="25">広がり</tspan></text></svg>