<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">伝承はなぜ生まれるのか――城之崎城と中泉御殿が一つの物語になるまでのevidence図</title><desc id="desc">二つの「不可解な事実」が残した記憶、二つの史実が一つの伝承になる流れ、時系列のずれと、敵対者の違いが薄れていくを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H240" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">伝承はなぜ生まれるのか――城之崎城と中泉御殿が一つの物語にな…</text><path d="M405 155 L665 370 H145 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="630" cy="342" r="44" fill="#dcebe5"/><circle cx="180" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">二つの「不可解な事実」が残</tspan><tspan x="405" dy="25">した記憶</tspan></text><text x="630" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="630" dy="0">二つの史実が一つの伝承にな</tspan><tspan x="630" dy="25">る流れ</tspan></text><text x="180" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="180" dy="0">時系列のずれと、敵対者の違</tspan><tspan x="180" dy="25">いが薄れていく</tspan></text></svg>