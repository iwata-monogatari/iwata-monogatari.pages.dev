<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">校歌・学校区から見る見付の地域意識── 「見付とはどこか」を学校の歴史から考えるのtimeline図</title><desc id="desc">目次、学校区という現代の「見付」の輪郭、むすび ── 名前が変わっても残るものを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H361" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">校歌・学校区から見る見付の地域意識── 「見付とはどこか」を…</text><path d="M92 252 H715" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#477c72"/><circle cx="405" cy="252" r="28" fill="#477c72"/><circle cx="660" cy="252" r="28" fill="#477c72"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">目次</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">学校区という現代の「見付」</tspan><tspan x="405" dy="25">の輪郭</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">むすび ── 名前が変わっ</tspan><tspan x="660" dy="25">ても残るもの</tspan></text></svg>