<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">継立帳簿は何を記録したか ── 人馬・賃銭・証文を残す実務のsources図</title><desc id="desc">問屋御用留という記録、何が記録されなかったか、本稿の要点を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H319" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・SOURCES</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">継立帳簿は何を記録したか ── 人馬・賃銭・証文を残す実務</text><rect x="70" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#244c57" stroke-width="3"/><rect x="302" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#aa7930" stroke-width="3"/><rect x="534" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#244c57" stroke-width="3"/><path d="M96 234 H248 M328 233 H480 M560 232 H712" stroke="#a9bcc0" stroke-width="3"/><text x="172" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="172" dy="0">問屋御用留という記録</tspan></text><text x="404" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="404" dy="0">何が記録されなかったか</tspan></text><text x="636" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="636" dy="0">本稿の要点</tspan></text></svg>