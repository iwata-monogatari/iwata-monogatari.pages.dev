<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">街道を導いた石 ──一里塚・道標・供養塔がつくる旧東海道の景観のroute図</title><desc id="desc">一里塚 ── 距離を刻んだ、道の目印、供養塔・宝塔 ── 石に刻まれた祈りの古さ、火伏せの丘に立つ一里塚 ── 愛宕神社を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H347" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">街道を導いた石 ──一里塚・道標・供養塔がつくる旧東海道の景観</text><path d="M92 310 C230 267,330 350,405 245 S610 155,718 260" fill="none" stroke="#b45f3d" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">一里塚 ── 距離を刻んだ</tspan><tspan x="120" dy="25">、道の目印</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">供養塔・宝塔 ── 石に刻</tspan><tspan x="405" dy="25">まれた祈りの古さ</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">火伏せの丘に立つ一里塚 ─</tspan><tspan x="690" dy="25">─ 愛宕神社</tspan></text></svg>