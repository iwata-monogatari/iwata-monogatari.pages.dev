<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">鎌倉時代の国分寺 ── 釈迦から薬師へ、本尊が変わるときのritual図</title><desc id="desc">頼朝が命じた「国分二寺」の修造、承元3年の記録 ── 「国分寺」ではなく「薬師堂」、この記事で扱う範囲を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H241" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・RITUAL</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">鎌倉時代の国分寺 ── 釈迦から薬師へ、本尊が変わるとき</text><circle cx="405" cy="278" r="133" fill="#fff" stroke="#477c72" stroke-width="4"/><path d="M405 278 L170 180 M405 278 L640 180 M405 278 L405 410" stroke="#244c57" stroke-width="3"/><circle cx="170" cy="180" r="58" fill="#f7e8dc"/><circle cx="640" cy="180" r="58" fill="#e2eee9"/><circle cx="405" cy="392" r="52" fill="#e6e6f0"/><text x="170" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="170" dy="0">頼朝が命じた「国分二寺」の</tspan><tspan x="170" dy="25">修造</tspan></text><text x="640" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="640" dy="0">承元3年の記録 ── 「国</tspan><tspan x="640" dy="25">分寺」ではなく「薬師堂」</tspan></text><text x="405" y="395" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">この記事で扱う範囲</tspan></text></svg>