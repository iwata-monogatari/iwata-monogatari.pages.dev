<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">上万能「挑燈野」── 古戦場と伝わる野の名のevidence図</title><desc id="desc">この記事での扱い、戦いの記憶は、地名に薄く残る、一言坂の戦いと旧豊田町を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H347" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">上万能「挑燈野」── 古戦場と伝わる野の名</text><path d="M405 155 L663 370 H147 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="628" cy="342" r="44" fill="#dcebe5"/><circle cx="182" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">この記事での扱い</tspan></text><text x="628" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="628" dy="0">戦いの記憶は、地名に薄く残</tspan><tspan x="628" dy="25">る</tspan></text><text x="182" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="182" dy="0">一言坂の戦いと旧豊田町</tspan></text></svg>