<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">磐田の盛土史 ──海を防ぐ砂丘の盛土と、宅地を守る耐震化事業のevidence図</title><desc id="desc">砂丘に土を盛って、津波を防ぐ「静岡モデル」、静岡県主導から、磐田市主導へ、「静岡モデル」というやり方の意味を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H293" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">磐田の盛土史 ──海を防ぐ砂丘の盛土と、宅地を守る耐震化事業</text><path d="M405 155 L682 370 H128 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="647" cy="342" r="44" fill="#dcebe5"/><circle cx="163" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">砂丘に土を盛って、津波を防</tspan><tspan x="405" dy="25">ぐ「静岡モデル」</tspan></text><text x="647" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="647" dy="0">静岡県主導から、磐田市主導</tspan><tspan x="647" dy="25">へ</tspan></text><text x="163" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="163" dy="0">「静岡モデル」というやり方</tspan><tspan x="163" dy="25">の意味</tspan></text></svg>