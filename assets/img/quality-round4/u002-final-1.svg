<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">鎌田御厨── 伊勢神宮領だった村の名残のlayers図</title><desc id="desc">「御厨」という地名の正体、御厨地区の村々 ── 鎌田・新貝・稗原・東貝塚、鎌田神明宮 ── 伊勢の神を祀る社を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H260" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">鎌田御厨── 伊勢神宮領だった村の名残</text><path d="M90 190 H720 L654 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L666 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">「御厨」という地名の正体</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">御厨地区の村々 ── 鎌田</tspan><tspan x="405" dy="25">・新貝・稗原・東貝塚</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">鎌田神明宮 ── 伊勢の神</tspan><tspan x="405" dy="25">を祀る社</tspan></text></svg>