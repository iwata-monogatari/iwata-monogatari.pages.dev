<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">見付から福田・掛塚方面へ向かう旧道 ──南部の低地を渡る道のroute図</title><desc id="desc">見付・福田・掛塚という三つの拠点、掛塚湊が結んでいた、もっと広い物流網、南部の低地を渡る道の条件を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H370" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">見付から福田・掛塚方面へ向かう旧道 ──南部の低地を渡る道</text><path d="M92 310 C230 225,330 350,405 245 S610 155,718 260" fill="none" stroke="#6b638c" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">見付・福田・掛塚という三つ</tspan><tspan x="120" dy="25">の拠点</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">掛塚湊が結んでいた、もっと</tspan><tspan x="405" dy="25">広い物流網</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">南部の低地を渡る道の条件</tspan></text></svg>