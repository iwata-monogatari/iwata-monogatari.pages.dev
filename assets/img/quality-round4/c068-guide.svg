<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">古写真・住宅地図・聞き取りで磐田の記憶を復元する ── 磐田物語の調査手法のsources図</title><desc id="desc">なぜ、一つの史料だけでは足りないのか、「事実・解釈・推測」を分けて記すということ、三枚の地図を重ねる ── 古地図という手法を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H378" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・SOURCES</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">古写真・住宅地図・聞き取りで磐田の記憶を復元する ── 磐田…</text><rect x="70" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#244c57" stroke-width="3"/><rect x="302" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#b45f3d" stroke-width="3"/><rect x="534" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#244c57" stroke-width="3"/><path d="M96 233 H248 M328 231 H480 M560 229 H712" stroke="#a9bcc0" stroke-width="3"/><text x="172" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="172" dy="0">なぜ、一つの史料だけでは足</tspan><tspan x="172" dy="25">りないのか</tspan></text><text x="404" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="404" dy="0">「事実・解釈・推測」を分け</tspan><tspan x="404" dy="25">て記すということ</tspan></text><text x="636" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="636" dy="0">三枚の地図を重ねる ── </tspan><tspan x="636" dy="25">古地図という手法</tspan></text></svg>