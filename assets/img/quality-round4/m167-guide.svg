<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">見付宿の歳入 ── 天保10年、誰が宿場の費用を負担したかのevidence図</title><desc id="desc">歳入は5種類 ── 「入った金」を性格で分ける、助成金20% ── 幕府が宿駅を止めないために出した金、このページで分かることを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H276" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">見付宿の歳入 ── 天保10年、誰が宿場の費用を負担したか</text><path d="M405 155 L664 370 H146 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="629" cy="342" r="44" fill="#dcebe5"/><circle cx="181" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">歳入は5種類 ── 「入っ</tspan><tspan x="405" dy="25">た金」を性格で分ける</tspan></text><text x="629" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="629" dy="0">助成金20% ── 幕府が</tspan><tspan x="629" dy="25">宿駅を止めないために出し…</tspan></text><text x="181" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="181" dy="0">このページで分かること</tspan></text></svg>