<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">御厨駅と現代の御厨── 令和に蘇った古代「神領」の地名と未来への継承のroute図</title><desc id="desc">平安の「神領」から始まった「御厨」のブランド、歴史を未来の世代へ手渡すために、御厨の起源：を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H285" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">御厨駅と現代の御厨── 令和に蘇った古代「神領」の地名と未来…</text><path d="M92 310 C230 205,330 350,405 245 S610 155,718 260" fill="none" stroke="#477c72" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">平安の「神領」から始まった</tspan><tspan x="120" dy="25">「御厨」のブランド</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">歴史を未来の世代へ手渡すた</tspan><tspan x="405" dy="25">めに</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">御厨の起源：</tspan></text></svg>