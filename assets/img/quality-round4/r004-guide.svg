<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">十束村の成立と平松・中島の新田開拓史 ── 河口低地を美田に変えた近世の土木のlayers図</title><desc id="desc">荒れ狂う河口湿地を拓いた江戸時代の新田開発、十束村のその後 ── 竜洋町への合流と一部分村の歴史、十の村々が手を取り合って誕生した「十束村」を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H388" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">十束村の成立と平松・中島の新田開拓史 ── 河口低地を美田に…</text><path d="M90 190 H720 L670 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L650 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">荒れ狂う河口湿地を拓いた江</tspan><tspan x="405" dy="25">戸時代の新田開発</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">十束村のその後 ── 竜洋</tspan><tspan x="405" dy="25">町への合流と一部分村の歴史</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">十の村々が手を取り合って誕</tspan><tspan x="405" dy="25">生した「十束村」</tspan></text></svg>