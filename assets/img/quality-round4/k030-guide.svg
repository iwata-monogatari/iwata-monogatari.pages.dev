<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">岩田・大藤・向笠をつなぐ丘陵と水の記憶のevidence図</title><desc id="desc">向陽地区を旧村の重なりとして読む、水と台地がつくった三つの地域性、旧郡と旧村の記憶を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H264" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">岩田・大藤・向笠をつなぐ丘陵と水の記憶</text><path d="M405 155 L676 370 H134 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="641" cy="342" r="44" fill="#dcebe5"/><circle cx="169" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">向陽地区を旧村の重なりとし</tspan><tspan x="405" dy="25">て読む</tspan></text><text x="641" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="641" dy="0">水と台地がつくった三つの地</tspan><tspan x="641" dy="25">域性</tspan></text><text x="169" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="169" dy="0">旧郡と旧村の記憶</tspan></text></svg>