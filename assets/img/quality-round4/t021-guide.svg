<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">井通村の成立と近代の教育・水利 ── 天竜川左岸の豊かな低地を拓いた近代農村の歩みのroute図</title><desc id="desc">水と生きる村々が手を取り合った日、近代教育の光 ── 井通小学校とコミュニティの融和、地名「井通」に込められた水への敬意を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H247" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">井通村の成立と近代の教育・水利 ── 天竜川左岸の豊かな低地…</text><path d="M92 310 C230 232,330 350,405 245 S610 155,718 260" fill="none" stroke="#6b638c" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">水と生きる村々が手を取り合</tspan><tspan x="120" dy="25">った日</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">近代教育の光 ── 井通小</tspan><tspan x="405" dy="25">学校とコミュニティの融和</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">地名「井通」に込められた水</tspan><tspan x="690" dy="25">への敬意</tspan></text></svg>