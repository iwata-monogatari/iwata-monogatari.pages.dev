<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">原爆と平和への願い｜磐田の中学生が聞いた被爆者の声のevidence図</title><desc id="desc">原爆パネル展と中学生の聞き取り、被爆による健康影響という長期的な課題、被爆者Aさんの証言（聞き書き）を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H325" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">原爆と平和への願い｜磐田の中学生が聞いた被爆者の声</text><path d="M405 155 L685 370 H125 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="650" cy="342" r="44" fill="#dcebe5"/><circle cx="160" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">原爆パネル展と中学生の聞き</tspan><tspan x="405" dy="25">取り</tspan></text><text x="650" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="650" dy="0">被爆による健康影響という長</tspan><tspan x="650" dy="25">期的な課題</tspan></text><text x="160" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="160" dy="0">被爆者Aさんの証言（聞き書</tspan><tspan x="160" dy="25">き）</tspan></text></svg>