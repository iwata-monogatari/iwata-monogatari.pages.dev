<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">天竜川河口のシラスウナギ漁とウナギ養殖の源流 ── 汽水域がもたらす大自然の恵みのroute図</title><desc id="desc">淡水と海水が交わる豊かな汽水域の生態系、暗闇の川面を照らす伝統のシラスウナギ掬い漁、遠州のウナギ養殖を支えた稚魚供給の役割を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H289" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">天竜川河口のシラスウナギ漁とウナギ養殖の源流 ── 汽水域が…</text><path d="M92 310 C230 209,330 350,405 245 S610 155,718 260" fill="none" stroke="#6b638c" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">淡水と海水が交わる豊かな汽</tspan><tspan x="120" dy="25">水域の生態系</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">暗闇の川面を照らす伝統のシ</tspan><tspan x="405" dy="25">ラスウナギ掬い漁</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">遠州のウナギ養殖を支えた稚</tspan><tspan x="690" dy="25">魚供給の役割</tspan></text></svg>