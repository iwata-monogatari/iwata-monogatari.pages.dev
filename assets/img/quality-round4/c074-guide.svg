<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">昭和の商店街・市場・個人商店 ──見付から中泉、そして今之浦へのevidence図</title><desc id="desc">商業の中心地は、なぜ移り変わったのか、竜洋で幻に終わった、映画館の計画、駅前商業の象徴、名店ビルとジュビロードを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H295" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">昭和の商店街・市場・個人商店 ──見付から中泉、そして今之浦へ</text><path d="M405 155 L680 370 H130 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="645" cy="342" r="44" fill="#dcebe5"/><circle cx="165" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">商業の中心地は、なぜ移り変</tspan><tspan x="405" dy="25">わったのか</tspan></text><text x="645" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="645" dy="0">竜洋で幻に終わった、映画館</tspan><tspan x="645" dy="25">の計画</tspan></text><text x="165" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="165" dy="0">駅前商業の象徴、名店ビルと</tspan><tspan x="165" dy="25">ジュビロード</tspan></text></svg>