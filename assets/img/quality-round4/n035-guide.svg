<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">講堂が倒れた日 ── 治安2年の大風と太政官への嘆願のevidence図</title><desc id="desc">大風の夜、講堂は倒れた、裁許から修復実施へ、摂関政治の全盛期に、地方の国分寺で起きていたことを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H305" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">講堂が倒れた日 ── 治安2年の大風と太政官への嘆願</text><path d="M405 155 L670 370 H140 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="635" cy="342" r="44" fill="#dcebe5"/><circle cx="175" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">大風の夜、講堂は倒れた</tspan></text><text x="635" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="635" dy="0">裁許から修復実施へ</tspan></text><text x="175" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="175" dy="0">摂関政治の全盛期に、地方の</tspan><tspan x="175" dy="25">国分寺で起きていたこと</tspan></text></svg>