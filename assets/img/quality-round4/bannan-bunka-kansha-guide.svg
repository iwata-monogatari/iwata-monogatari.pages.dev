<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">磐南文化協会に学ぶのevidence図</title><desc id="desc">地域の歴史は、ある日突然書けるものではない、磐南文化協会という、地域の学びの場、小さな出来事を、地域の歴史として残すを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H308" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">磐南文化協会に学ぶ</text><path d="M405 155 L667 370 H143 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="632" cy="342" r="44" fill="#dcebe5"/><circle cx="178" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">地域の歴史は、ある日突然書</tspan><tspan x="405" dy="25">けるものではない</tspan></text><text x="632" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="632" dy="0">磐南文化協会という、地域の</tspan><tspan x="632" dy="25">学びの場</tspan></text><text x="178" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="178" dy="0">小さな出来事を、地域の歴史</tspan><tspan x="178" dy="25">として残す</tspan></text></svg>