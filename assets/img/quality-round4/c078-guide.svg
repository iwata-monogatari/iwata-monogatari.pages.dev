<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">見付・中泉の生活道路改良 ──歴史的市街地のバリアフリー化のtimeline図</title><desc id="desc">マウントアップから、セミフラットへ、「見付397号線」という、もう一つの改良工事、確認できること・できないことを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H286" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">見付・中泉の生活道路改良 ──歴史的市街地のバリアフリー化</text><path d="M92 252 H724" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#6b638c"/><circle cx="405" cy="252" r="28" fill="#6b638c"/><circle cx="660" cy="252" r="28" fill="#6b638c"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">マウントアップから、セミフ</tspan><tspan x="150" dy="25">ラットへ</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">「見付397号線」という、</tspan><tspan x="405" dy="25">もう一つの改良工事</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">確認できること・できないこ</tspan><tspan x="660" dy="25">と</tspan></text></svg>