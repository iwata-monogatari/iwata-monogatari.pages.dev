<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">社山と古代・中世の山岳信仰・砦の記憶 ── 豊田地区北端の霊峰と戦国乱世の砦跡のlayers図</title><desc id="desc">「社のある山」── その名に宿る祈りの記憶、山を貫いて水を呼ぶ ── 「社山疏水」という悲願、武田と徳川が奪い合った「社山城」を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H295" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">社山と古代・中世の山岳信仰・砦の記憶 ── 豊田地区北端の霊…</text><path d="M90 190 H720 L667 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L653 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">「社のある山」── その名</tspan><tspan x="405" dy="25">に宿る祈りの記憶</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">山を貫いて水を呼ぶ ── </tspan><tspan x="405" dy="25">「社山疏水」という悲願</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">武田と徳川が奪い合った「社</tspan><tspan x="405" dy="25">山城」</tspan></text></svg>