<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">戦地からの証言｜中国戦線と軍隊生活の記憶のevidence図</title><desc id="desc">大藤十区・河島和夫氏の軍務、徴兵制度と召集の仕組み、石原町・大村榮男氏の学徒動員と省察を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H257" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">戦地からの証言｜中国戦線と軍隊生活の記憶</text><path d="M405 155 L683 370 H127 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="648" cy="342" r="44" fill="#dcebe5"/><circle cx="162" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">大藤十区・河島和夫氏の軍務</tspan></text><text x="648" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="648" dy="0">徴兵制度と召集の仕組み</tspan></text><text x="162" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="162" dy="0">石原町・大村榮男氏の学徒動</tspan><tspan x="162" dy="25">員と省察</tspan></text></svg>