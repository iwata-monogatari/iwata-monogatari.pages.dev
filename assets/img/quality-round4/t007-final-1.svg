<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">「新田」と名のつく土地── 江戸の開発が刻んだ磐田の地名のlayers図</title><desc id="desc">「新田」という地名は何を語るか、なぜ江戸時代に新田が増えたのか、磐田周辺の「新田」地名を読むを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H257" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">「新田」と名のつく土地── 江戸の開発が刻んだ磐田の地名</text><path d="M90 190 H720 L657 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L663 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">「新田」という地名は何を語</tspan><tspan x="405" dy="25">るか</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">なぜ江戸時代に新田が増えた</tspan><tspan x="405" dy="25">のか</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">磐田周辺の「新田」地名を読</tspan><tspan x="405" dy="25">む</tspan></text></svg>