<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">池田宿の賑わいと本陣の記憶 ── 天竜川東岸の宿場と東海道の玄関口のroute図</title><desc id="desc">遊女と熊野 ── 中世の宿としての池田、家康が守った「池田の渡し」と渡船の特権、天竜川を控えた「川越えの宿」の地学的運命を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H309" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">池田宿の賑わいと本陣の記憶 ── 天竜川東岸の宿場と東海道の…</text><path d="M92 310 C230 229,330 350,405 245 S610 155,718 260" fill="none" stroke="#b45f3d" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">遊女と熊野 ── 中世の宿</tspan><tspan x="120" dy="25">としての池田</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">家康が守った「池田の渡し」</tspan><tspan x="405" dy="25">と渡船の特権</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">天竜川を控えた「川越えの宿</tspan><tspan x="690" dy="25">」の地学的運命</tspan></text></svg>