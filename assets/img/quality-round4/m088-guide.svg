<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">見付の古写真・絵葉書から消えた建物を復元するのsources図</title><desc id="desc">戸別明細図に記された「今はない施設」、浮世絵に描かれた、さらに古い見付宿、絵葉書という「窓」から見る明治・大正の見付を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H303" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・SOURCES</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">見付の古写真・絵葉書から消えた建物を復元する</text><rect x="70" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#244c57" stroke-width="3"/><rect x="302" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#b45f3d" stroke-width="3"/><rect x="534" y="168" width="205" height="190" rx="18" fill="#fff" stroke="#244c57" stroke-width="3"/><path d="M96 218 H248 M328 221 H480 M560 224 H712" stroke="#a9bcc0" stroke-width="3"/><text x="172" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="172" dy="0">戸別明細図に記された「今は</tspan><tspan x="172" dy="25">ない施設」</tspan></text><text x="404" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="404" dy="0">浮世絵に描かれた、さらに古</tspan><tspan x="404" dy="25">い見付宿</tspan></text><text x="636" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="636" dy="0">絵葉書という「窓」から見る</tspan><tspan x="636" dy="25">明治・大正の見付</tspan></text></svg>