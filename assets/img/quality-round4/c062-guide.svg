<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">廃線後の中泉軌道――遠足・祭り・石碑に残った細い鉄路のroute図</title><desc id="desc">廃線は、記憶の終わりではなかった、車両がなくても、道の形が語るもの、軌道敷の払い下げと戦後の使われ方を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H325" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">廃線後の中泉軌道――遠足・祭り・石碑に残った細い鉄路</text><path d="M92 310 C230 245,330 350,405 245 S610 155,718 260" fill="none" stroke="#6b638c" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">廃線は、記憶の終わりではな</tspan><tspan x="120" dy="25">かった</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">車両がなくても、道の形が語</tspan><tspan x="405" dy="25">るもの</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">軌道敷の払い下げと戦後の使</tspan><tspan x="690" dy="25">われ方</tspan></text></svg>