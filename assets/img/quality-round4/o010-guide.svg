<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="o010title o010desc"><title id="o010title">旧二俣線と東海道本線の位置関係を示す模式図</title><desc id="o010desc">海岸沿いを通る東海道本線に対し、旧国鉄二俣線が掛川から内陸へ大きく回り込み、豊岡・天竜二俣を経て新所原へ至る位置関係を示した模式図。地形や距離は正確ではなく、関係を示すための図である。</desc>
<rect width="810" height="455" rx="24" fill="#eef3f7"/>
<text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#2f7fa3" letter-spacing="2">土地の記憶・街道と交通</text>
<path d="M42 66 H430" stroke="#2f7fa3" stroke-width="5"/>
<text x="42" y="100" font-family="sans-serif" font-size="24" font-weight="700" fill="#244c57">二俣線は、なぜ内陸を回ったのか</text>

<rect x="42" y="352" width="726" height="70" rx="8" fill="#cfe0ea"/>
<text x="60" y="396" font-family="sans-serif" font-size="16" font-weight="700" fill="#43707f">遠州灘（海岸線）</text>

<path d="M70 330 H740" stroke="#8aa0ab" stroke-width="6" stroke-dasharray="14 8"/>
<text x="70" y="316" font-family="sans-serif" font-size="16" font-weight="700" fill="#5b6b74">東海道本線 ── 海に近く、寸断の危険があるとされた</text>

<path d="M120 300 C 210 150, 400 130, 500 160 C 600 190, 660 250, 700 300" fill="none" stroke="#2f7fa3" stroke-width="7" stroke-linecap="round"/>
<text x="228" y="140" font-family="sans-serif" font-size="17" font-weight="700" fill="#1f4f6f">国鉄二俣線（現・天竜浜名湖鉄道）</text>

<circle cx="120" cy="300" r="11" fill="#fff" stroke="#1f4f6f" stroke-width="4"/>
<text x="120" y="286" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#244c57">掛川</text>
<circle cx="700" cy="300" r="11" fill="#fff" stroke="#1f4f6f" stroke-width="4"/>
<text x="700" y="286" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#244c57">新所原</text>
<circle cx="248" cy="176" r="13" fill="#f2b544" stroke="#1f4f6f" stroke-width="4"/>
<text x="248" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57">豊岡</text>
<circle cx="500" cy="160" r="11" fill="#fff" stroke="#1f4f6f" stroke-width="4"/>
<text x="500" y="207" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#244c57">天竜二俣</text>

<text x="352" y="252" font-family="sans-serif" font-size="15" fill="#5b6b74">海から距離を取ることを優先した線形</text>
<text x="42" y="440" font-family="sans-serif" font-size="13" fill="#66717c">※WEB説明用に新規作成した模式図。距離・地形・駅の位置は正確ではない。</text>
</svg>
