<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">貴船神社と海の安全を祈る水神信仰 ── 寄進された錨と灯籠が語る航海史のtimeline図</title><desc id="desc">天竜川河口の聖地に鎮座する水の神、千石船の錨が語る命がけの航海と神徳、石灯籠に刻まれた日本全国の湊町の名前を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H348" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">貴船神社と海の安全を祈る水神信仰 ── 寄進された錨と灯籠が…</text><path d="M92 252 H702" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#aa7930"/><circle cx="405" cy="252" r="28" fill="#aa7930"/><circle cx="660" cy="252" r="28" fill="#aa7930"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">天竜川河口の聖地に鎮座する</tspan><tspan x="150" dy="25">水の神</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">千石船の錨が語る命がけの航</tspan><tspan x="405" dy="25">海と神徳</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">石灯籠に刻まれた日本全国の</tspan><tspan x="660" dy="25">湊町の名前</tspan></text></svg>