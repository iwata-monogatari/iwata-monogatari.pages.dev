<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">見付の坂道・辻・曲がり角 ── 台地の縁が刻んだ宿場の道すじのroute図</title><desc id="desc">台地の縁に町が乗っている、木戸に挟まれた宿場の長さ、坂・辻を歩くときの視点を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H285" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">見付の坂道・辻・曲がり角 ── 台地の縁が刻んだ宿場の道すじ</text><path d="M92 310 C230 205,330 350,405 245 S610 155,718 260" fill="none" stroke="#aa7930" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">台地の縁に町が乗っている</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">木戸に挟まれた宿場の長さ</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">坂・辻を歩くときの視点</tspan></text></svg>