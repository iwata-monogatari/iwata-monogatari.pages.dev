<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">豊浜の砂丘と黒松防風林 ── 海風と飛砂に挑んだ不屈の農地保全史のtimeline図</title><desc id="desc">遠州灘の怒りと風が運んだ「豊浜砂丘」の脅威、昭和以降に強まった、もう一つの脅威 ── 海岸浸食、砂の中に緑を植える ── 黒松防風林の壮大なプロジェクトを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H339" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">豊浜の砂丘と黒松防風林 ── 海風と飛砂に挑んだ不屈の農地保…</text><path d="M92 252 H735" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#477c72"/><circle cx="405" cy="252" r="28" fill="#477c72"/><circle cx="660" cy="252" r="28" fill="#477c72"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">遠州灘の怒りと風が運んだ「</tspan><tspan x="150" dy="25">豊浜砂丘」の脅威</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">昭和以降に強まった、もう一</tspan><tspan x="405" dy="25">つの脅威 ── 海岸浸食</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">砂の中に緑を植える ── </tspan><tspan x="660" dy="25">黒松防風林の壮大なプロジ…</tspan></text></svg>