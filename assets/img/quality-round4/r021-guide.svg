<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">町や村を背負った人達｜竜洋の地域運営を支えた人びとのlayers図</title><desc id="desc">近世の名代官・林伊太郎の活躍、昭和の合併期から現代を創った首長たち、治水に生涯を捧げた代官・犬塚祐一郎を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H374" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">町や村を背負った人達｜竜洋の地域運営を支えた人びと</text><path d="M90 190 H720 L660 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L660 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">近世の名代官・林伊太郎の活</tspan><tspan x="405" dy="25">躍</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">昭和の合併期から現代を創っ</tspan><tspan x="405" dy="25">た首長たち</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">治水に生涯を捧げた代官・犬</tspan><tspan x="405" dy="25">塚祐一郎</tspan></text></svg>