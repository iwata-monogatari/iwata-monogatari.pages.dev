<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">東南海地震と竜洋の学校── 空襲下の震災と学びの再開のevidence図</title><desc id="desc">目次、GHQによる占領期の教育改革、昭和19年12月の東南海地震を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H283" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">東南海地震と竜洋の学校── 空襲下の震災と学びの再開</text><path d="M405 155 L657 370 H153 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="622" cy="342" r="44" fill="#dcebe5"/><circle cx="188" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">目次</tspan></text><text x="622" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="622" dy="0">GHQによる占領期の教育改</tspan><tspan x="622" dy="25">革</tspan></text><text x="188" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="188" dy="0">昭和19年12月の東南海地</tspan><tspan x="188" dy="25">震</tspan></text></svg>