<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">資料で読む中泉御殿の史実 - 家康の鷹狩り・秋鹿家・大池のbiography図</title><desc id="desc">一、資料で見える中泉御殿の機能、二、秋鹿家・大池・府八幡宮を重ねる、三、絵図・公図・発掘が示す御殿跡を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H277" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・BIOGRAPHY</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">資料で読む中泉御殿の史実 - 家康の鷹狩り・秋鹿家・大池</text><path d="M90 365 Q230 217,360 300 T720 185" fill="none" stroke="#6b638c" stroke-width="9"/><rect x="88" y="305" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><rect x="320" y="230" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><rect x="552" y="145" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><text x="173" y="343" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="173" dy="0">一、資料で見える中泉御殿の</tspan><tspan x="173" dy="25">機能</tspan></text><text x="405" y="268" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">二、秋鹿家・大池・府八幡宮</tspan><tspan x="405" dy="25">を重ねる</tspan></text><text x="637" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="637" dy="0">三、絵図・公図・発掘が示す</tspan><tspan x="637" dy="25">御殿跡</tspan></text></svg>