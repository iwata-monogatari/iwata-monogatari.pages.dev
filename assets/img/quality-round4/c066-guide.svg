<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">磐田の農業特産品と土地利用 ──台地の茶、温室のメロン、低地の畑のevidence図</title><desc id="desc">台地の茶 ── 磐田原が育てる「いわた茶」、用水事業が広げた、園芸農業の可能性、温室のメロン ── 天竜川水系の水と技術の結晶を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H287" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">磐田の農業特産品と土地利用 ──台地の茶、温室のメロン、低地…</text><path d="M405 155 L653 370 H157 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="618" cy="342" r="44" fill="#dcebe5"/><circle cx="192" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">台地の茶 ── 磐田原が育</tspan><tspan x="405" dy="25">てる「いわた茶」</tspan></text><text x="618" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="618" dy="0">用水事業が広げた、園芸農業</tspan><tspan x="618" dy="25">の可能性</tspan></text><text x="192" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="192" dy="0">温室のメロン ── 天竜川</tspan><tspan x="192" dy="25">水系の水と技術の結晶</tspan></text></svg>