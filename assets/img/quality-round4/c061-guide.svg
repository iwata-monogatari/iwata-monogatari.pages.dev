<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">中泉駅北の歴史地層――御林・赤煉瓦・中泉御殿のそばを通った軌道のtimeline図</title><desc id="desc">磐田駅北に重なる、近世と近代、軌道は、古い町の縁を通った、御林と赤煉瓦の記憶を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H364" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">中泉駅北の歴史地層――御林・赤煉瓦・中泉御殿のそばを通った軌道</text><path d="M92 252 H718" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#6b638c"/><circle cx="405" cy="252" r="28" fill="#6b638c"/><circle cx="660" cy="252" r="28" fill="#6b638c"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">磐田駅北に重なる、近世と近</tspan><tspan x="150" dy="25">代</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">軌道は、古い町の縁を通った</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">御林と赤煉瓦の記憶</tspan></text></svg>