<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">磐田原台地と古墳分布 ──台地の縁に眠る、時代の異なる王たちのbiography図</title><desc id="desc">磐田原台地という舞台、台地西南端の中期古墳群 ── 兜塚古墳と見付・中泉の古墳群、台地の縁に古墳が並ぶ理由を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H327" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・BIOGRAPHY</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">磐田原台地と古墳分布 ──台地の縁に眠る、時代の異なる王たち</text><path d="M90 365 Q230 207,360 300 T720 185" fill="none" stroke="#aa7930" stroke-width="9"/><rect x="88" y="305" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><rect x="320" y="230" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><rect x="552" y="145" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><text x="173" y="343" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="173" dy="0">磐田原台地という舞台</tspan></text><text x="405" y="268" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">台地西南端の中期古墳群 ─</tspan><tspan x="405" dy="25">─ 兜塚古墳と見付・中泉…</tspan></text><text x="637" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="637" dy="0">台地の縁に古墳が並ぶ理由</tspan></text></svg>