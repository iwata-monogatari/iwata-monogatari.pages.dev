<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">別珍・コールテンと福田の織物産業 ── 「世界のコーデュロイ」を産んだ職人の技と歩みのevidence図</title><desc id="desc">機織りの羽音が響く「遠州綿紬」のルーツ、太田川の水が育んだ染色技術と未来への挑戦、極細の糸を切り開く「カッティング」の超絶技巧を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H369" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">別珍・コールテンと福田の織物産業 ── 「世界のコーデュロイ…</text><path d="M405 155 L676 370 H134 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="641" cy="342" r="44" fill="#dcebe5"/><circle cx="169" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">機織りの羽音が響く「遠州綿</tspan><tspan x="405" dy="25">紬」のルーツ</tspan></text><text x="641" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="641" dy="0">太田川の水が育んだ染色技術</tspan><tspan x="641" dy="25">と未来への挑戦</tspan></text><text x="169" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="169" dy="0">極細の糸を切り開く「カッテ</tspan><tspan x="169" dy="25">ィング」の超絶技巧</tspan></text></svg>