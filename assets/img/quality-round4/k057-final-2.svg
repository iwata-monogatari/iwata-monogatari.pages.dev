<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">向笠小学校の153年── 新豊院から向陽小学校への論点整理図</title><desc id="desc">戦争、地震、そして戦後の小学校へ、ビオトープと環境教育、向笠の学校史は、寺院から始まったの関係を示す図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b36a43"/></marker></defs><rect width="810" height="455" rx="24" fill="#eef5f3"/><text x="40" y="54" font-size="15" font-weight="700" fill="#b36a43" letter-spacing="2">磐田物語・論点整理</text><text x="40" y="92" font-size="25" font-weight="700" fill="#493b62">向笠小学校の153年── 新豊院から向陽小学校へ</text><text x="40" y="122" font-size="16" fill="#5b4c74">本文の根拠と読み順を確認する</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#5b4c74" stroke-width="2"/><text x="152" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#493b62"><tspan x="152" dy="0">戦争、地震、そして戦</tspan><tspan x="152" dy="26">後の小学校へ</tspan></text><path d="M268 228 H300" stroke="#b36a43" stroke-width="5" marker-end="url(#a)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#5b4c74" stroke-width="2"/><text x="422" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#493b62"><tspan x="422" dy="0">ビオトープと環境教育</tspan></text><path d="M538 228 H570" stroke="#b36a43" stroke-width="5" marker-end="url(#a)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#5b4c74" stroke-width="2"/><text x="692" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#493b62"><tspan x="692" dy="0">向笠の学校史は、寺院</tspan><tspan x="692" dy="26">から始まった</tspan></text></svg>