<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">秋葉常夜灯 ──石の灯台が守った、火伏せの遠州のevidence図</title><desc id="desc">火は、共同体を一瞬で焼き尽くす、誰が灯りを守ったのか ── 講と自治会の200年、祈りの灯籠が、街灯を兼ねたを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H301" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">秋葉常夜灯 ──石の灯台が守った、火伏せの遠州</text><path d="M405 155 L674 370 H136 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="639" cy="342" r="44" fill="#dcebe5"/><circle cx="171" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">火は、共同体を一瞬で焼き尽</tspan><tspan x="405" dy="25">くす</tspan></text><text x="639" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="639" dy="0">誰が灯りを守ったのか ──</tspan><tspan x="639" dy="25"> 講と自治会の200年</tspan></text><text x="171" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="171" dy="0">祈りの灯籠が、街灯を兼ねた</tspan></text></svg>