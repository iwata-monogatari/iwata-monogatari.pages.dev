<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">遠州織物・工場・女性労働 ──中泉・見付・豊田が担った分業と、女工たちの記憶のevidence図</title><desc id="desc">大和国から伝わった、雲斉織という技術、女工たちの労働、その過酷さ、豊田佐吉と鈴木道雄 ── 織機を生んだ発明家たちを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H223" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">遠州織物・工場・女性労働 ──中泉・見付・豊田が担った分業と…</text><path d="M405 155 L682 370 H128 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="647" cy="342" r="44" fill="#dcebe5"/><circle cx="163" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">大和国から伝わった、雲斉織</tspan><tspan x="405" dy="25">という技術</tspan></text><text x="647" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="647" dy="0">女工たちの労働、その過酷さ</tspan></text><text x="163" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="163" dy="0">豊田佐吉と鈴木道雄 ── </tspan><tspan x="163" dy="25">織機を生んだ発明家たち</tspan></text></svg>