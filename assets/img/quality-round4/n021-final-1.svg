<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">中泉御殿のあった町── 天領を治めた中泉のevidence図</title><desc id="desc">中泉とは ── 場所と地名、中泉御殿 ── 家康が置いた屋敷、前島密と、近代への橋渡しを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H287" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">中泉御殿のあった町── 天領を治めた中泉</text><path d="M405 155 L653 370 H157 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="618" cy="342" r="44" fill="#dcebe5"/><circle cx="192" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">中泉とは ── 場所と地名</tspan></text><text x="618" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="618" dy="0">中泉御殿 ── 家康が置い</tspan><tspan x="618" dy="25">た屋敷</tspan></text><text x="192" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="192" dy="0">前島密と、近代への橋渡し</tspan></text></svg>