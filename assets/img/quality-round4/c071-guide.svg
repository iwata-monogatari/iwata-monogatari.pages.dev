<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">古代磐田郡・山名郡・豊田郡 ──遠江国を分けた郡の境界線のevidence図</title><desc id="desc">遠江国は、三つの國造の領域から生まれた、遠江国、十の郡という枠組み、磐田郡 ── 遠淡海國造の治所を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H253" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">古代磐田郡・山名郡・豊田郡 ──遠江国を分けた郡の境界線</text><path d="M405 155 L652 370 H158 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="617" cy="342" r="44" fill="#dcebe5"/><circle cx="193" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">遠江国は、三つの國造の領域</tspan><tspan x="405" dy="25">から生まれた</tspan></text><text x="617" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="617" dy="0">遠江国、十の郡という枠組み</tspan></text><text x="193" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="193" dy="0">磐田郡 ── 遠淡海國造の</tspan><tspan x="193" dy="25">治所</tspan></text></svg>