<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">池田やかた祭りと天白神社の祭礼 ── 天竜川の渡しの里に伝わる厄流しのroute図</title><desc id="desc">天竜川のほとりに鎮まる「天白神社」の信仰史、川に願いを流す「池田やかた祭り」の祈り、地区ぐるみで紡ぐ伝承のバトンを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H274" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">池田やかた祭りと天白神社の祭礼 ── 天竜川の渡しの里に伝わ…</text><path d="M92 310 C230 259,330 350,405 245 S610 155,718 260" fill="none" stroke="#477c72" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">天竜川のほとりに鎮まる「天</tspan><tspan x="120" dy="25">白神社」の信仰史</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">川に願いを流す「池田やかた</tspan><tspan x="405" dy="25">祭り」の祈り</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">地区ぐるみで紡ぐ伝承のバト</tspan><tspan x="690" dy="25">ン</tspan></text></svg>