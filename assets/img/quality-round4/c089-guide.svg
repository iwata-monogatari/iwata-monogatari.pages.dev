<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">街道のほとりの小さな祠 ──くろん坊様と梅塚、旅がうんだ信仰のroute図</title><desc id="desc">殺された異国人が、神になった ── くろん坊様、大きな歴史の陰の、小さな祈り、確認できること・できないことを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H341" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">街道のほとりの小さな祠 ──くろん坊様と梅塚、旅がうんだ信仰</text><path d="M92 310 C230 261,330 350,405 245 S610 155,718 260" fill="none" stroke="#b45f3d" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">殺された異国人が、神になっ</tspan><tspan x="120" dy="25">た ── くろん坊様</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">大きな歴史の陰の、小さな祈</tspan><tspan x="405" dy="25">り</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">確認できること・できないこ</tspan><tspan x="690" dy="25">と</tspan></text></svg>