<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">中泉代官と見付宿の年貢 ── 安政3年の年貢割付を読むのevidence図</title><desc id="desc">中泉御殿から代官所へ、本稿の要点、永高 ── 今川氏の朱印が生き続けた税制を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H318" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">中泉代官と見付宿の年貢 ── 安政3年の年貢割付を読む</text><path d="M405 155 L657 370 H153 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="622" cy="342" r="44" fill="#dcebe5"/><circle cx="188" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">中泉御殿から代官所へ</tspan></text><text x="622" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="622" dy="0">本稿の要点</tspan></text><text x="188" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="188" dy="0">永高 ── 今川氏の朱印が</tspan><tspan x="188" dy="25">生き続けた税制</tspan></text></svg>