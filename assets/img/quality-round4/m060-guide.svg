<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">「秀吉に配慮した城」の正体――中泉御殿との混同を解くのevidence図</title><desc id="desc">城之崎城の放棄から十数年後の中泉、秀吉配慮説は、対象を取り違えている、「御殿」と名乗った、政治的な理由を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H316" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">「秀吉に配慮した城」の正体――中泉御殿との混同を解く</text><path d="M405 155 L659 370 H151 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="624" cy="342" r="44" fill="#dcebe5"/><circle cx="186" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">城之崎城の放棄から十数年後</tspan><tspan x="405" dy="25">の中泉</tspan></text><text x="624" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="624" dy="0">秀吉配慮説は、対象を取り違</tspan><tspan x="624" dy="25">えている</tspan></text><text x="186" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="186" dy="0">「御殿」と名乗った、政治的</tspan><tspan x="186" dy="25">な理由</tspan></text></svg>