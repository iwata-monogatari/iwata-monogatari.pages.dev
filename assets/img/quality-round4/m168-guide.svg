<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">見付宿の歳出 ── 713両の運輸費と宿場を動かす固定費のevidence図</title><desc id="desc">七つの支出区分 ── まず全体を見渡す、交付金182両余 ── 分からない内訳を断定しない、このページで分かることを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H257" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">見付宿の歳出 ── 713両の運輸費と宿場を動かす固定費</text><path d="M405 155 L683 370 H127 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="648" cy="342" r="44" fill="#dcebe5"/><circle cx="162" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">七つの支出区分 ── まず</tspan><tspan x="405" dy="25">全体を見渡す</tspan></text><text x="648" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="648" dy="0">交付金182両余 ── 分</tspan><tspan x="648" dy="25">からない内訳を断定しない</tspan></text><text x="162" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="162" dy="0">このページで分かること</tspan></text></svg>