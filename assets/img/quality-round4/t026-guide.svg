<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">豊田町への合併と近代行政のあゆみ ── 井通・池田・富岡の三村が紡いだ合併の歴史のtimeline図</title><desc id="desc">明治期における村々の個性と生活圏、町制施行から平成の大合併、そして次世代への継承、昭和30年、村々の大同団結による「豊田村」の誕生を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H378" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">豊田町への合併と近代行政のあゆみ ── 井通・池田・富岡の三…</text><path d="M92 252 H732" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#477c72"/><circle cx="405" cy="252" r="28" fill="#477c72"/><circle cx="660" cy="252" r="28" fill="#477c72"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">明治期における村々の個性と</tspan><tspan x="150" dy="25">生活圏</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">町制施行から平成の大合併、</tspan><tspan x="405" dy="25">そして次世代への継承</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">昭和30年、村々の大同団結</tspan><tspan x="660" dy="25">による「豊田村」の誕生</tspan></text></svg>