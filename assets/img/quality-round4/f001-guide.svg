<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">福田湊の発展と遠州の漁業史 ── 黒潮の恵みと太田川河口の天然湊のroute図</title><desc id="desc">遠州灘の荒波と太田川の出会いが生んだ天然湊、シラス漁がつなぐ、湊から漁港への連続性、黒潮がもたらす一級の漁場と漁師たちの意気地を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H367" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">福田湊の発展と遠州の漁業史 ── 黒潮の恵みと太田川河口の天…</text><path d="M92 310 C230 222,330 350,405 245 S610 155,718 260" fill="none" stroke="#477c72" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">遠州灘の荒波と太田川の出会</tspan><tspan x="120" dy="25">いが生んだ天然湊</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">シラス漁がつなぐ、湊から漁</tspan><tspan x="405" dy="25">港への連続性</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">黒潮がもたらす一級の漁場と</tspan><tspan x="690" dy="25">漁師たちの意気地</tspan></text></svg>