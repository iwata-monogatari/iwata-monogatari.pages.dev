<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">秋葉信仰・常夜灯・旧東海道の石造物 ──竜洋14基が伝える火伏せの祈りのroute図</title><desc id="desc">火伏せの神、秋葉山への祈り、織物職人たちが守った、もう一つの火伏せ信仰、竜洋地域に残る、14基の常夜灯を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H347" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">秋葉信仰・常夜灯・旧東海道の石造物 ──竜洋14基が伝える火…</text><path d="M92 310 C230 267,330 350,405 245 S610 155,718 260" fill="none" stroke="#477c72" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">火伏せの神、秋葉山への祈り</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">織物職人たちが守った、もう</tspan><tspan x="405" dy="25">一つの火伏せ信仰</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">竜洋地域に残る、14基の常</tspan><tspan x="690" dy="25">夜灯</tspan></text></svg>