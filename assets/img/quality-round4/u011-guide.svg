<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">富士見台── 磐田原台地南端の景勝地と近代開拓の歴史のtimeline図</title><desc id="desc">「富士見」の地名にふさわしいパノラマの記憶、不毛を実りに変えた、近代土木の進化、富士見の原風景：を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H300" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">富士見台── 磐田原台地南端の景勝地と近代開拓の歴史</text><path d="M92 252 H738" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#477c72"/><circle cx="405" cy="252" r="28" fill="#477c72"/><circle cx="660" cy="252" r="28" fill="#477c72"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">「富士見」の地名にふさわし</tspan><tspan x="150" dy="25">いパノラマの記憶</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">不毛を実りに変えた、近代土</tspan><tspan x="405" dy="25">木の進化</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">富士見の原風景：</tspan></text></svg>