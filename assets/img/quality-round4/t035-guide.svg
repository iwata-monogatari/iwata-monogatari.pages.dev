<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">熊野絵巻の成立をめぐる論争 ── 室町か、江戸かのevidence図</title><desc id="desc">熊野絵巻とは何か（t027との関係）、サントリー美術館での展示と補修の記録、制作年代をめぐる二つの説（室町期説と江戸期説）を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H365" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">熊野絵巻の成立をめぐる論争 ── 室町か、江戸か</text><path d="M405 155 L680 370 H130 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="645" cy="342" r="44" fill="#dcebe5"/><circle cx="165" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">熊野絵巻とは何か（t027</tspan><tspan x="405" dy="25">との関係）</tspan></text><text x="645" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="645" dy="0">サントリー美術館での展示と</tspan><tspan x="645" dy="25">補修の記録</tspan></text><text x="165" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="165" dy="0">制作年代をめぐる二つの説（</tspan><tspan x="165" dy="25">室町期説と江戸期説）</tspan></text></svg>