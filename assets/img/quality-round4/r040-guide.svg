<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">竜洋を襲った地震 ── 宝永・安政・東南海と『一代咄』の記憶のevidence図</title><desc id="desc">竜洋の地盤と地震 ── なぜ被害が集中するのか、被害の数字をどう読むか、宝永地震 ── 湊を隆起させた巨大地震を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H227" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">竜洋を襲った地震 ── 宝永・安政・東南海と『一代咄』の記憶</text><path d="M405 155 L678 370 H132 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="643" cy="342" r="44" fill="#dcebe5"/><circle cx="167" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">竜洋の地盤と地震 ── な</tspan><tspan x="405" dy="25">ぜ被害が集中するのか</tspan></text><text x="643" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="643" dy="0">被害の数字をどう読むか</tspan></text><text x="167" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="167" dy="0">宝永地震 ── 湊を隆起さ</tspan><tspan x="167" dy="25">せた巨大地震</tspan></text></svg>