<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">学徒動員と対空戦｜見付中学生と少年たちの戦争のevidence図</title><desc id="desc">見付中学校の学徒動員、見付という土地から送り出された学徒、学徒動員という政策を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H344" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">学徒動員と対空戦｜見付中学生と少年たちの戦争</text><path d="M405 155 L666 370 H144 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="631" cy="342" r="44" fill="#dcebe5"/><circle cx="179" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">見付中学校の学徒動員</tspan></text><text x="631" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="631" dy="0">見付という土地から送り出さ</tspan><tspan x="631" dy="25">れた学徒</tspan></text><text x="179" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="179" dy="0">学徒動員という政策</tspan></text></svg>