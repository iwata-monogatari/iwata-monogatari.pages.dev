<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">富岡村の開拓と磐田原台地西縁の農業 ── 水なき台地を緑の茶園に変えたフロンティアの歴史のtimeline図</title><desc id="desc">台地の厳しい自然に挑む「富岡村」の誕生、適地適作と養蚕・複合農業の成功、士族授産と開拓者の鍬 ── 一大茶園の誕生を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H282" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">富岡村の開拓と磐田原台地西縁の農業 ── 水なき台地を緑の茶…</text><path d="M92 252 H720" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#477c72"/><circle cx="405" cy="252" r="28" fill="#477c72"/><circle cx="660" cy="252" r="28" fill="#477c72"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">台地の厳しい自然に挑む「富</tspan><tspan x="150" dy="25">岡村」の誕生</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">適地適作と養蚕・複合農業の</tspan><tspan x="405" dy="25">成功</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">士族授産と開拓者の鍬 ──</tspan><tspan x="660" dy="25"> 一大茶園の誕生</tspan></text></svg>