<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">竜洋町の沿革｜川と海に向き合ってきた町の成り立ちのtimeline図</title><desc id="desc">地形的特徴と集落の立地、合併前史としての3町村の個性、昭和30年の大合併と新しい町の誕生を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H341" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・TIMELINE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">竜洋町の沿革｜川と海に向き合ってきた町の成り立ち</text><path d="M92 252 H737" stroke="#244c57" stroke-width="5"/><circle cx="150" cy="252" r="28" fill="#aa7930"/><circle cx="405" cy="252" r="28" fill="#aa7930"/><circle cx="660" cy="252" r="28" fill="#aa7930"/><text x="150" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="150" dy="0">地形的特徴と集落の立地</tspan></text><text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">合併前史としての3町村の個</tspan><tspan x="405" dy="25">性</tspan></text><text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="660" dy="0">昭和30年の大合併と新しい</tspan><tspan x="660" dy="25">町の誕生</tspan></text></svg>