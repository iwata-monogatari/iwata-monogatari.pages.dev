<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">太田川河口のウナギ養殖と淡水水産 ── 豊かな水系が育んだ養殖フロンティアのroute図</title><desc id="desc">浜名湖に匹敵する「磐田・福田の養鰻」の地学的優位性、浜名湖の養鰻業と静岡県産ウナギの現在地、横須賀藩の治水事業から生まれた福田の養魚池を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H346" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">太田川河口のウナギ養殖と淡水水産 ── 豊かな水系が育んだ養…</text><path d="M92 310 C230 266,330 350,405 245 S610 155,718 260" fill="none" stroke="#b45f3d" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">浜名湖に匹敵する「磐田・福</tspan><tspan x="120" dy="25">田の養鰻」の地学的優位性</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">浜名湖の養鰻業と静岡県産ウ</tspan><tspan x="405" dy="25">ナギの現在地</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">横須賀藩の治水事業から生ま</tspan><tspan x="690" dy="25">れた福田の養魚池</tspan></text></svg>