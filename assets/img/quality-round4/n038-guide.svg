<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">堀越氏延の鰐口 ── 大永2年、見付端城主の寄進のbiography図</title><desc id="desc">大永2年4月27日、薬師堂に響いた鰐口、本尊・薬師如来坐像との符合、鰐口銘文が語ることを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H277" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・BIOGRAPHY</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">堀越氏延の鰐口 ── 大永2年、見付端城主の寄進</text><path d="M90 365 Q230 217,360 300 T720 185" fill="none" stroke="#aa7930" stroke-width="9"/><rect x="88" y="305" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><rect x="320" y="230" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><rect x="552" y="145" width="170" height="62" rx="18" fill="#fff" stroke="#244c57" stroke-width="2"/><text x="173" y="343" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="173" dy="0">大永2年4月27日、薬師堂</tspan><tspan x="173" dy="25">に響いた鰐口</tspan></text><text x="405" y="268" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">本尊・薬師如来坐像との符合</tspan></text><text x="637" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="637" dy="0">鰐口銘文が語ること</tspan></text></svg>