<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">二十一世紀へ｜記憶を継ぐ、磐田市非核平和都市宣言と慰霊のevidence図</title><desc id="desc">今之浦・長瀬みよ子氏の願い、慰霊碑と平和祈念行事という継承の形、新貝・中村和哉氏の歩みを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H259" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">二十一世紀へ｜記憶を継ぐ、磐田市非核平和都市宣言と慰霊</text><path d="M405 155 L681 370 H129 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="646" cy="342" r="44" fill="#dcebe5"/><circle cx="164" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">今之浦・長瀬みよ子氏の願い</tspan></text><text x="646" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="646" dy="0">慰霊碑と平和祈念行事という</tspan><tspan x="646" dy="25">継承の形</tspan></text><text x="164" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="164" dy="0">新貝・中村和哉氏の歩み</tspan></text></svg>