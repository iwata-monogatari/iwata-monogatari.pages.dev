<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">小銚子塚古墳と周辺の古墳群 ── 銚子塚に連なる巨大古墳の系譜と古代の首長系譜のevidence図</title><desc id="desc">銚子塚の影に立つ「小銚子塚古墳」の考古学的意義、出土遺物が証明する列島規模のネットワーク、天竜川を眼下にする「聖なる台地の崖線」を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H318" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">小銚子塚古墳と周辺の古墳群 ── 銚子塚に連なる巨大古墳の系…</text><path d="M405 155 L657 370 H153 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="622" cy="342" r="44" fill="#dcebe5"/><circle cx="188" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">銚子塚の影に立つ「小銚子塚</tspan><tspan x="405" dy="25">古墳」の考古学的意義</tspan></text><text x="622" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="622" dy="0">出土遺物が証明する列島規模</tspan><tspan x="622" dy="25">のネットワーク</tspan></text><text x="188" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="188" dy="0">天竜川を眼下にする「聖なる</tspan><tspan x="188" dy="25">台地の崖線」</tspan></text></svg>