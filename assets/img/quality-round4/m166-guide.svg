<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">大通行の人馬数を比べる ── 動員規模と助郷の広がりのevidence図</title><desc id="desc">比べる前に、揃えるものがある、華やかさの裏で、誰が支えたか、本稿の要点を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H256" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">大通行の人馬数を比べる ── 動員規模と助郷の広がり</text><path d="M405 155 L684 370 H126 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="649" cy="342" r="44" fill="#dcebe5"/><circle cx="161" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">比べる前に、揃えるものがあ</tspan><tspan x="405" dy="25">る</tspan></text><text x="649" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="649" dy="0">華やかさの裏で、誰が支えた</tspan><tspan x="649" dy="25">か</tspan></text><text x="161" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="161" dy="0">本稿の要点</tspan></text></svg>