<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">桶ヶ谷沼と鶴ヶ池 ──台地の縁に残った、日本一のトンボの楽園のevidence図</title><desc id="desc">台地の縁に並ぶ、二つの沼、桶ヶ谷沼を考える会、市民が沼を見守り続ける、「日本一のトンボの生息地」と呼ばれる理由を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H320" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">桶ヶ谷沼と鶴ヶ池 ──台地の縁に残った、日本一のトンボの楽園</text><path d="M405 155 L655 370 H155 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="620" cy="342" r="44" fill="#dcebe5"/><circle cx="190" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">台地の縁に並ぶ、二つの沼</tspan></text><text x="620" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="620" dy="0">桶ヶ谷沼を考える会、市民が</tspan><tspan x="620" dy="25">沼を見守り続ける</tspan></text><text x="190" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="190" dy="0">「日本一のトンボの生息地」</tspan><tspan x="190" dy="25">と呼ばれる理由</tspan></text></svg>