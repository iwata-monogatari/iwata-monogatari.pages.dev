<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">磐田物語の地域分類 ── 9つの地域と、その成り立ちの論点整理図</title><desc id="desc">なぜ「9分類」なのか、旧町村名にみる、二つの歴史の層、見付・中泉・御厨・南部・向陽の関係を示す図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b36a43"/></marker></defs><rect width="810" height="455" rx="24" fill="#eef5f3"/><text x="40" y="54" font-size="15" font-weight="700" fill="#b36a43" letter-spacing="2">磐田物語・論点整理</text><text x="40" y="92" font-size="25" font-weight="700" fill="#23465a">磐田物語の地域分類 ── 9つの地域と、その成り立ち</text><text x="40" y="122" font-size="16" fill="#315d5a">本文の根拠と読み順を確認する</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#315d5a" stroke-width="2"/><text x="152" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="152" dy="0">なぜ「9分類」なのか</tspan></text><path d="M268 228 H300" stroke="#b36a43" stroke-width="5" marker-end="url(#a)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#315d5a" stroke-width="2"/><text x="422" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="422" dy="0">旧町村名にみる、二つ</tspan><tspan x="422" dy="26">の歴史の層</tspan></text><path d="M538 228 H570" stroke="#b36a43" stroke-width="5" marker-end="url(#a)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#315d5a" stroke-width="2"/><text x="692" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="692" dy="0">見付・中泉・御厨・南</tspan><tspan x="692" dy="26">部・向陽</tspan></text></svg>