<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">宿助成のしくみ ── 貸付利子・補金・返済猶予で支えた見付宿のevidence図</title><desc id="desc">なぜ助成が必要だったか ── 公定価格と実費のずれ、文化13年以降 ── 利子が入らず、助成も止まる、このページで分かることを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H246" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">宿助成のしくみ ── 貸付利子・補金・返済猶予で支えた見付宿</text><path d="M405 155 L659 370 H151 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="624" cy="342" r="44" fill="#dcebe5"/><circle cx="186" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">なぜ助成が必要だったか ─</tspan><tspan x="405" dy="25">─ 公定価格と実費のずれ</tspan></text><text x="624" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="624" dy="0">文化13年以降 ── 利子</tspan><tspan x="624" dy="25">が入らず、助成も止まる</tspan></text><text x="186" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="186" dy="0">このページで分かること</tspan></text></svg>