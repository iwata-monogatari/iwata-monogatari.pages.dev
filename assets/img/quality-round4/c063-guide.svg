<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">磐田の水争いと村の共同体 ──水利慣行が守った、少ない水の分けかたのlayers図</title><desc id="desc">沼と潟に囲まれながら、水は足りなかった、村の自治を支えた、名主・庄屋の役割、闇夜の竹槍、明治の警官動員を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H346" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">磐田の水争いと村の共同体 ──水利慣行が守った、少ない水の分…</text><path d="M90 190 H720 L664 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L656 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">沼と潟に囲まれながら、水は</tspan><tspan x="405" dy="25">足りなかった</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">村の自治を支えた、名主・庄</tspan><tspan x="405" dy="25">屋の役割</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">闇夜の竹槍、明治の警官動員</tspan></text></svg>