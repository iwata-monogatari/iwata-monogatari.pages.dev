<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">助郷人馬の賃銭と代勤 ── 労役はどこまで金で置き換えられたかのevidence図</title><desc id="desc">助成と刎銭、本稿の要点、出役できなければ人馬を買うを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H250" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">助郷人馬の賃銭と代勤 ── 労役はどこまで金で置き換えられたか</text><path d="M405 155 L655 370 H155 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="620" cy="342" r="44" fill="#dcebe5"/><circle cx="190" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">助成と刎銭</tspan></text><text x="620" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="620" dy="0">本稿の要点</tspan></text><text x="190" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="190" dy="0">出役できなければ人馬を買う</tspan></text></svg>