<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">銃後を守る｜疎開・勤労動員・女性たちの戦時生活のevidence図</title><desc id="desc">幸町・大場裕子氏の記憶、配給制度と物資不足の暮らし、勤労動員と女性たちの戦時生活を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H237" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">銃後を守る｜疎開・勤労動員・女性たちの戦時生活</text><path d="M405 155 L668 370 H142 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="633" cy="342" r="44" fill="#dcebe5"/><circle cx="177" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">幸町・大場裕子氏の記憶</tspan></text><text x="633" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="633" dy="0">配給制度と物資不足の暮らし</tspan></text><text x="177" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="177" dy="0">勤労動員と女性たちの戦時生</tspan><tspan x="177" dy="25">活</tspan></text></svg>