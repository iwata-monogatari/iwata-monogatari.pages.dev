<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">卵塔墓が語る260年 ── 国分寺住職たちの墓碑を読むの論点整理図</title><desc id="desc">文字が残らなくても、石は残る、薬師堂の片隅の寺子屋 ── 住職・真浄と「筆子中」、墓地の場所も移り変わったの関係を示す図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b36a43"/></marker></defs><rect width="810" height="455" rx="24" fill="#eef5f3"/><text x="40" y="54" font-size="15" font-weight="700" fill="#b36a43" letter-spacing="2">磐田物語・論点整理</text><text x="40" y="92" font-size="25" font-weight="700" fill="#23465a">卵塔墓が語る260年 ── 国分寺住職たちの墓碑を読む</text><text x="40" y="122" font-size="16" fill="#315d5a">本文の根拠と読み順を確認する</text><rect x="42" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#315d5a" stroke-width="2"/><text x="152" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="152" dy="0">文字が残らなくても、</tspan><tspan x="152" dy="26">石は残る</tspan></text><path d="M268 228 H300" stroke="#b36a43" stroke-width="5" marker-end="url(#a)"/><rect x="312" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#315d5a" stroke-width="2"/><text x="422" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="422" dy="0">薬師堂の片隅の寺子屋</tspan><tspan x="422" dy="26"> ── 住職・真浄…</tspan></text><path d="M538 228 H570" stroke="#b36a43" stroke-width="5" marker-end="url(#a)"/><rect x="582" y="176" width="220" height="105" rx="18" fill="#fff" stroke="#315d5a" stroke-width="2"/><text x="692" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#23465a"><tspan x="692" dy="0">墓地の場所も移り変わ</tspan><tspan x="692" dy="26">った</tspan></text></svg>