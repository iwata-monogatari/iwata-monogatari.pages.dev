<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title"><title id="title">教科書の版と所蔵情報の読み方</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#417b9d"/></marker></defs><rect width="400" height="400" rx="16" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="200" y="35" text-anchor="middle" font-size="20" fill="#243c4b" font-weight="700">一冊に重なる、別々の情報</text><rect x="30" y="70" width="340" height="57" rx="3" fill="#edf5fa" stroke="#a9c8da"/><text x="55" y="94" text-anchor="start" font-size="17" fill="#25628a" font-weight="700">原版</text><text x="55" y="115" text-anchor="start" font-size="13" fill="#243c4b" font-weight="400">どの機関が刊行したか</text><rect x="38" y="142" width="324" height="57" rx="3" fill="#edf5fa" stroke="#a9c8da"/><text x="63" y="166" text-anchor="start" font-size="17" fill="#25628a" font-weight="700">改正</text><text x="63" y="187" text-anchor="start" font-size="13" fill="#243c4b" font-weight="400">内容はいつ改められたか</text><rect x="46" y="214" width="308" height="57" rx="3" fill="#edf5fa" stroke="#a9c8da"/><text x="71" y="238" text-anchor="start" font-size="17" fill="#25628a" font-weight="700">翻刻</text><text x="71" y="259" text-anchor="start" font-size="13" fill="#243c4b" font-weight="400">誰が別の版を出したか</text><rect x="54" y="286" width="292" height="57" rx="3" fill="#edf5fa" stroke="#a9c8da"/><text x="79" y="310" text-anchor="start" font-size="17" fill="#25628a" font-weight="700">所蔵</text><text x="79" y="331" text-anchor="start" font-size="13" fill="#243c4b" font-weight="400">どの図書館に残っているか</text><text x="200" y="381" text-anchor="middle" font-size="14" fill="#243c4b" font-weight="400">書名だけで同じ版と判断しない</text></g></svg>
