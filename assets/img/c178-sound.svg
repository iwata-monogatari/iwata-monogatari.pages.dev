<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-labelledby="title"><title id="title">録音教材が結ぶ教室と家庭</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#417b9d"/></marker></defs><rect width="400" height="390" rx="16" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="200" y="32" text-anchor="middle" font-size="20" fill="#243c4b" font-weight="700">声を、持ち帰れる教材に</text><rect x="25" y="63" width="350" height="78" rx="10" fill="#edf5fa" stroke="#a9c8da"/><text x="200" y="94" text-anchor="middle" font-size="18" fill="#243c4b" font-weight="400">読み手が数字を声にする</text><text x="200" y="120" text-anchor="middle" font-size="16" fill="#243c4b" font-weight="400">指導の準備</text><path d="M200 144 L200 172" fill="none" stroke="#417b9d" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="183" width="240" height="75" rx="10" fill="#dcecf5" stroke="#a9c8da"/><text x="200" y="215" text-anchor="middle" font-size="20" fill="#243c4b" font-weight="400">録音して残す</text><text x="200" y="241" text-anchor="middle" font-size="14" fill="#243c4b" font-weight="400">繰り返し再生できる音声</text><path d="M200 262 L200 288" fill="none" stroke="#417b9d" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="299" width="350" height="65" rx="10" fill="#edf5fa" stroke="#a9c8da"/><text x="200" y="325" text-anchor="middle" font-size="18" fill="#243c4b" font-weight="400">家庭でも聞いて計算する</text><text x="200" y="350" text-anchor="middle" font-size="13" fill="#243c4b" font-weight="400">機器と練習時間を用意する必要もある</text></g></svg>
