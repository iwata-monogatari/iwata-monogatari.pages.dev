<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="title"><title id="title">中島静比の音楽活動の広がり</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#417b9d"/></marker></defs><rect width="400" height="420" rx="16" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="200" y="35" text-anchor="middle" font-size="20" fill="#243c4b" font-weight="700">音楽を学ぶ、四つの場</text><path d="M38 105 Q200 70 362 105" fill="none" stroke="#aecbdc" stroke-width="2"/><path d="M38 172 Q200 137 362 172" fill="none" stroke="#aecbdc" stroke-width="2"/><path d="M38 239 Q200 204 362 239" fill="none" stroke="#aecbdc" stroke-width="2"/><path d="M38 306 Q200 271 362 306" fill="none" stroke="#aecbdc" stroke-width="2"/><rect x="25" y="73" width="170" height="45" rx="22" fill="#edf5fa" stroke="#a9c8da"/><text x="110" y="102" text-anchor="middle" font-size="17" fill="#243c4b" font-weight="400">音楽の授業</text><rect x="195" y="140" width="170" height="45" rx="22" fill="#edf5fa" stroke="#a9c8da"/><text x="280" y="169" text-anchor="middle" font-size="17" fill="#243c4b" font-weight="400">合唱・音楽会</text><rect x="25" y="207" width="170" height="45" rx="22" fill="#edf5fa" stroke="#a9c8da"/><text x="110" y="236" text-anchor="middle" font-size="17" fill="#243c4b" font-weight="400">専門への学び</text><rect x="190" y="274" width="170" height="45" rx="22" fill="#edf5fa" stroke="#a9c8da"/><text x="275" y="303" text-anchor="middle" font-size="17" fill="#243c4b" font-weight="400">市民の活動</text><text x="200" y="363" text-anchor="middle" font-size="15" fill="#243c4b" font-weight="400">教師・生徒・地域の参加者が結ぶ</text><text x="200" y="394" text-anchor="middle" font-size="12" fill="#5b6e7b" font-weight="400">個々の生徒の進路を示す図ではない</text></g></svg>
