<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="title"><title id="title">中島静比をめぐる主な時期</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#417b9d"/></marker></defs><rect width="400" height="450" rx="16" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="200" y="35" text-anchor="middle" font-size="20" fill="#243c4b" font-weight="700">中島静比の活動と時代</text><path d="M62 76 L62 385" fill="none" stroke="#417b9d" stroke-width="2"/><circle cx="62" cy="86" r="7" fill="#25628a"/><text x="88" y="80" text-anchor="start" font-size="15" fill="#25628a" font-weight="700">1928</text><text x="88" y="105" text-anchor="start" font-size="17" fill="#243c4b" font-weight="400">見付高女へ赴任</text><circle cx="62" cy="162" r="7" fill="#25628a"/><text x="88" y="156" text-anchor="start" font-size="15" fill="#25628a" font-weight="700">1931</text><text x="88" y="181" text-anchor="start" font-size="17" fill="#243c4b" font-weight="400">合唱が放送へ</text><circle cx="62" cy="238" r="7" fill="#25628a"/><text x="88" y="232" text-anchor="start" font-size="15" fill="#25628a" font-weight="700">戦時期</text><text x="88" y="257" text-anchor="start" font-size="17" fill="#243c4b" font-weight="400">学校・授業環境の変化</text><circle cx="62" cy="314" r="7" fill="#25628a"/><text x="88" y="308" text-anchor="start" font-size="15" fill="#25628a" font-weight="700">1952</text><text x="88" y="333" text-anchor="start" font-size="17" fill="#243c4b" font-weight="400">市民合唱の組織づくり</text><circle cx="62" cy="390" r="7" fill="#25628a"/><text x="88" y="384" text-anchor="start" font-size="15" fill="#25628a" font-weight="700">その後</text><text x="88" y="409" text-anchor="start" font-size="17" fill="#243c4b" font-weight="400">後続の指導者へ</text><text x="200" y="437" text-anchor="middle" font-size="12" fill="#5b6e7b" font-weight="400">寺田論考の記載から整理</text></g></svg>
