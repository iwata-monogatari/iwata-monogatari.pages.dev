<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">向笠の太田川治水――「悪魔の川」伝説と三右衛門堤のroute図</title><desc id="desc">太田川は農業用水の恵みと砂礫河床の難しさを併せ持つ、「悪魔の川」伝説は流路をめぐる対立の記憶を伝える、三右衛門堤は人物伝承と堤防構造を分けて検証するを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H288" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">向笠の太田川治水――「悪魔の川」伝説と三右衛門堤</text><path d="M92 310 C230 208,330 350,405 245 S610 155,718 260" fill="none" stroke="#477c72" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">太田川は農業用水の恵みと砂</tspan><tspan x="120" dy="25">礫河床の難しさを併せ持つ</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">「悪魔の川」伝説は流路をめ</tspan><tspan x="405" dy="25">ぐる対立の記憶を伝える</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">三右衛門堤は人物伝承と堤防</tspan><tspan x="690" dy="25">構造を分けて検証する</tspan></text></svg>