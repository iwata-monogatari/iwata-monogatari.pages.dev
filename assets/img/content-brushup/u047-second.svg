<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 414" width="1120" height="414" role="img" aria-labelledby="A0287-title A0287-desc" data-emaki-repair="A0287"><title id="A0287-title">鎌田遺跡 ── 弥生前期の土器と低地の稲作：本文の論点案内</title><desc id="A0287-desc">西川改修が開いた地面の記録。弥生前期の土器が示す低地利用。鎌田廃寺説と、遺跡を語る限界</desc><rect width="1120" height="414" rx="24" fill="#f8f2e8"/><defs><marker id="A0287-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#926440"/></marker></defs><g font-family="Meiryo,sans-serif" fill="#513420"><text x="72" y="43" font-size="17">本文の論点案内</text><text x="72" y="88" font-size="28" font-weight="700">鎌田遺跡 ── 弥生前期の土器と低地の稲作</text><rect x="72" y="162" width="296" height="167" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="105" cy="196" r="18" fill="#926440"/><text x="105" y="202" font-size="18" fill="white" text-anchor="middle">1</text><text x="96" y="248" font-size="20">西川改修が開いた地面の記</text><text x="96" y="279" font-size="20">録</text><path d="M378 245.5H402" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0287-arrow)"/><rect x="412" y="162" width="296" height="167" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="445" cy="196" r="18" fill="#926440"/><text x="445" y="202" font-size="18" fill="white" text-anchor="middle">2</text><text x="436" y="248" font-size="20">弥生前期の土器が示す低地</text><text x="436" y="279" font-size="20">利用</text><path d="M718 245.5H742" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0287-arrow)"/><rect x="752" y="162" width="296" height="167" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="785" cy="196" r="18" fill="#926440"/><text x="785" y="202" font-size="18" fill="white" text-anchor="middle">3</text><text x="776" y="248" font-size="20">鎌田廃寺説と、遺跡を語る</text><text x="776" y="279" font-size="20">限界</text><text x="560" y="384" text-anchor="middle" font-size="16">本文の論点を並べた案内図。位置・距離を示す地図ではありません。</text></g></svg