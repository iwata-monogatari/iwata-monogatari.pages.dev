<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">和口── 太田川下流の「曲の口」を町内資料から読むのroute図</title><desc id="desc">「和の口」ではなく「曲の口」――資料が示す地形語、旧和口村から南御厨村へ――行政の時間を重ねる、阿弥陀堂の鐘――伝承を史実と分けて残すを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H222" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">和口── 太田川下流の「曲の口」を町内資料から読む</text><path d="M92 310 C230 207,330 350,405 245 S610 155,718 260" fill="none" stroke="#6b638c" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">「和の口」ではなく「曲の口</tspan><tspan x="120" dy="25">」――資料が示す地形語</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">旧和口村から南御厨村へ――</tspan><tspan x="405" dy="25">行政の時間を重ねる</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">阿弥陀堂の鐘――伝承を史実</tspan><tspan x="690" dy="25">と分けて残す</tspan></text></svg>