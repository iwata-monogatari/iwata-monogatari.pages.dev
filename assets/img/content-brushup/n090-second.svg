<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">国府台に生まれた四つの町名 ── 桜ヶ丘・泉町・旭ヶ丘・本町のevidence図</title><desc id="desc">久保町の外側に広がった新しい住宅地、本稿の要点、桜ヶ丘の「ヶ」は、話し合って決められたを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H274" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">国府台に生まれた四つの町名 ── 桜ヶ丘・泉町・旭ヶ丘・本町</text><path d="M405 155 L666 370 H144 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="631" cy="342" r="44" fill="#dcebe5"/><circle cx="179" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">久保町の外側に広がった新し</tspan><tspan x="405" dy="25">い住宅地</tspan></text><text x="631" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="631" dy="0">本稿の要点</tspan></text><text x="179" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="179" dy="0">桜ヶ丘の「ヶ」は、話し合っ</tspan><tspan x="179" dy="25">て決められた</tspan></text></svg>