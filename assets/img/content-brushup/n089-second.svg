<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 414" width="1120" height="414" role="img" aria-labelledby="A0242-title A0242-desc" data-emaki-repair="A0242"><title id="A0242-title">大池事件 ── 水をめぐる二之宮と下手六村の争い｜磐田物語：本文の論点案内</title><desc id="A0242-desc">池を残すか、耕地にするか。養魚場と板堰が対立を深める。和解を形にした量水標と基準標</desc><rect width="1120" height="414" rx="24" fill="#f8f2e8"/><defs><marker id="A0242-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#926440"/></marker></defs><g font-family="Meiryo,sans-serif" fill="#513420"><text x="72" y="43" font-size="17">本文の論点案内</text><text x="72" y="88" font-size="28" font-weight="700">大池事件 ── 水をめぐる二之宮と下手六村の争い｜磐田物語</text><rect x="72" y="162" width="296" height="167" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="105" cy="196" r="18" fill="#926440"/><text x="105" y="202" font-size="18" fill="white" text-anchor="middle">1</text><text x="96" y="248" font-size="20">池を残すか、耕地にするか</text><path d="M378 245.5H402" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0242-arrow)"/><rect x="412" y="162" width="296" height="167" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="445" cy="196" r="18" fill="#926440"/><text x="445" y="202" font-size="18" fill="white" text-anchor="middle">2</text><text x="436" y="248" font-size="20">養魚場と板堰が対立を深め</text><text x="436" y="279" font-size="20">る</text><path d="M718 245.5H742" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0242-arrow)"/><rect x="752" y="162" width="296" height="167" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="785" cy="196" r="18" fill="#926440"/><text x="785" y="202" font-size="18" fill="white" text-anchor="middle">3</text><text x="776" y="248" font-size="20">和解を形にした量水標と基</text><text x="776" y="279" font-size="20">準標</text><text x="560" y="384" text-anchor="middle" font-size="16">本文の論点を並べた案内図。位置・距離を示す地図ではありません。</text></g></svg>