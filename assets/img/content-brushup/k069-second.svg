<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">五ヶ村出作場から向笠新屋へ――開墾地の集落化と水辺の暮らしのlayers図</title><desc id="desc">「五ヶ村出作場」は一村の固有名ではなく土地利用を示す、現在の町名から過去を読むには行政名と生活圏を分ける、参考資料・史料上の限界を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H289" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">五ヶ村出作場から向笠新屋へ――開墾地の集落化と水辺の暮らし</text><path d="M90 190 H720 L649 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L671 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">「五ヶ村出作場」は一村の固</tspan><tspan x="405" dy="25">有名ではなく土地利用を示す</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">現在の町名から過去を読むに</tspan><tspan x="405" dy="25">は行政名と生活圏を分ける</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">参考資料・史料上の限界</tspan></text></svg>