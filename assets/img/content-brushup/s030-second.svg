<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">草崎・前野――低地の二村を地域資料から読むのlayers図</title><desc id="desc">草崎と前野――隣村でも来歴は同じではない、寺社と廃寺記録は、村の空間を復元する索引、草崎と前野に重なる行政・信仰・土地利用を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H282" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">草崎・前野――低地の二村を地域資料から読む</text><path d="M90 190 H720 L656 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L664 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">草崎と前野――隣村でも来歴</tspan><tspan x="405" dy="25">は同じではない</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">寺社と廃寺記録は、村の空間</tspan><tspan x="405" dy="25">を復元する索引</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">草崎と前野に重なる行政・信</tspan><tspan x="405" dy="25">仰・土地利用</tspan></text></svg>