<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">下岡田の義民碑――大池事件を地域はどう記憶したかのlayers図</title><desc id="desc">大池事件そのものと碑の記憶を分ける、事件史と顕彰史をつなぐ四種類の記録、下岡田の義民碑の史料の読み分けを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H376" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">下岡田の義民碑――大池事件を地域はどう記憶したか</text><path d="M90 190 H720 L658 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L662 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">大池事件そのものと碑の記憶</tspan><tspan x="405" dy="25">を分ける</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">事件史と顕彰史をつなぐ四種</tspan><tspan x="405" dy="25">類の記録</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">下岡田の義民碑の史料の読み</tspan><tspan x="405" dy="25">分け</tspan></text></svg>