<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">光明電気鉄道の会社史――田中寿三郎の夢と、7年で終わった経営の論点図</title><desc id="d">会社設立と構想、路線建設・営業、短期間での終焉を順に整理した図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#7a4528"/></marker><linearGradient id="bg"><stop stop-color="#f3e3d6"/><stop offset="1" stop-color="#fffaf5"/></linearGradient></defs><style>.title{font:700 29px 'Yu Mincho','Noto Serif JP',serif;fill:#39271e}.kicker{font:600 17px system-ui,sans-serif;fill:#7a4528}.label{font:700 20px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#39271e}.num{font:700 18px system-ui,sans-serif;fill:#fff}.foot{font:500 16px system-ui,sans-serif;fill:#56646a}</style><rect width="1120" height="560" rx="30" fill="url(#bg)"/><text x="68" y="62" class="kicker">磐田物語｜記事の全体像</text><text x="68" y="112" class="title">光明電気鉄道の会社史</text><text x="68" y="150" class="title">田中寿三郎の夢と、7年で終わった経営</text><rect x="70" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#7a4528" stroke-width="2"/><circle cx="110" cy="300" r="21" fill="#7a4528"/><text x="110" y="307" class="num" text-anchor="middle">1</text><text x="98" y="355" class="label" text-anchor="start"><tspan x="98" dy="0">会社設立と構想</tspan></text><rect x="420" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#7a4528" stroke-width="2"/><circle cx="460" cy="300" r="21" fill="#7a4528"/><text x="460" y="307" class="num" text-anchor="middle">2</text><text x="448" y="355" class="label" text-anchor="start"><tspan x="448" dy="0">路線建設・営業</tspan></text><rect x="770" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#7a4528" stroke-width="2"/><circle cx="810" cy="300" r="21" fill="#7a4528"/><text x="810" y="307" class="num" text-anchor="middle">3</text><text x="798" y="355" class="label" text-anchor="start"><tspan x="798" dy="0">短期間での終焉</tspan></text><path d="M360 350h52" stroke="#7a4528" stroke-width="4" marker-end="url