<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">磐田市はどうして生まれたのか ── 一市三町一村の合併史・歴代首長・ふるさとの唄の論点図</title><desc id="d">昭和の町村合併、旧一市三町一村、2005年の新設合併を順に整理した図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#6a4e7d"/></marker><linearGradient id="bg"><stop stop-color="#e9e0ef"/><stop offset="1" stop-color="#fcf9fd"/></linearGradient></defs><style>.title{font:700 29px 'Yu Mincho','Noto Serif JP',serif;fill:#342740}.kicker{font:600 17px system-ui,sans-serif;fill:#6a4e7d}.label{font:700 20px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#342740}.num{font:700 18px system-ui,sans-serif;fill:#fff}.foot{font:500 16px system-ui,sans-serif;fill:#56646a}</style><rect width="1120" height="560" rx="30" fill="url(#bg)"/><text x="68" y="62" class="kicker">磐田物語｜記事の全体像</text><text x="68" y="112" class="title">磐田市はどうして生まれたのか</text><text x="68" y="150" class="title">一市三町一村の合併史・歴代首長・ふるさとの唄…</text><rect x="70" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#6a4e7d" stroke-width="2"/><circle cx="110" cy="300" r="21" fill="#6a4e7d"/><text x="110" y="307" class="num" text-anchor="middle">1</text><text x="98" y="355" class="label" text-anchor="start"><tspan x="98" dy="0">昭和の町村合併</tspan></text><rect x="420" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#6a4e7d" stroke-width="2"/><circle cx="460" cy="300" r="21" fill="#6a4e7d"/><text x="460" y="307" class="num" text-anchor="middle">2</text><text x="448" y="355" class="label" text-anchor="start"><tspan x="448" dy="0">旧一市三町一村</tspan></text><rect x="770" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#6a4e7d" stroke-width="2"/><circle cx="810" cy="300" r="21" fill="#6a4e7d"/><text x="810" y="307" class="num" text-anchor="middle">3</text><text x="798" y="355" class="label" text-anchor="start"><tspan x="798" dy="0">2005年の新設合併</tspan></text><path d="M360 350h52" stroke="#6a4e7d" stroke-