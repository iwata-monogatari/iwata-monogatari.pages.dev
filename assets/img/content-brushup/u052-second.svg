<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">稗原のもぐり橋・陣屋跡――太田川と地域伝承のroute図</title><desc id="desc">太田川の「もぐり橋」――増水を受け流す低い橋、稗原陣屋跡――地名・人物伝承・遺構を分ける、頂乗の文珠さま――洪水と移動を語る口承を残すを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H301" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">稗原のもぐり橋・陣屋跡――太田川と地域伝承</text><path d="M92 310 C230 221,330 350,405 245 S610 155,718 260" fill="none" stroke="#aa7930" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">太田川の「もぐり橋」――増</tspan><tspan x="120" dy="25">水を受け流す低い橋</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">稗原陣屋跡――地名・人物伝</tspan><tspan x="405" dy="25">承・遺構を分ける</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">頂乗の文珠さま――洪水と移</tspan><tspan x="690" dy="25">動を語る口承を残す</tspan></text></svg>