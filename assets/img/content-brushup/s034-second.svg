<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">長須賀と池田庄立券文書――中世文書に現れる村名を読むのlayers図</title><desc id="desc">近世村・寺社記録は中世文書と別に置く、中世文書の一行と近世村の記録を分ける、長須賀と池田庄立券文書の史料の読み分けを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H276" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">長須賀と池田庄立券文書――中世文書に現れる村名を読む</text><path d="M90 190 H720 L662 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L658 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">近世村・寺社記録は中世文書</tspan><tspan x="405" dy="25">と別に置く</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">中世文書の一行と近世村の記</tspan><tspan x="405" dy="25">録を分ける</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">長須賀と池田庄立券文書の史</tspan><tspan x="405" dy="25">料の読み分け</tspan></text></svg>