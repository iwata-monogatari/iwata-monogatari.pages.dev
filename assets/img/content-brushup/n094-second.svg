<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">中町・東町・七軒町――旧中泉の商店街と町名再編のevidence図</title><desc id="desc">中町の成立は「新町」という呼び方の整理から見える、東町は駅前商業と古い信仰空間が重なった、七軒町は家数の伝承より防火と共同店舗から読むを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H284" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">中町・東町・七軒町――旧中泉の商店街と町名再編</text><path d="M405 155 L656 370 H154 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="621" cy="342" r="44" fill="#dcebe5"/><circle cx="189" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">中町の成立は「新町」という</tspan><tspan x="405" dy="25">呼び方の整理から見える</tspan></text><text x="621" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="621" dy="0">東町は駅前商業と古い信仰空</tspan><tspan x="621" dy="25">間が重なった</tspan></text><text x="189" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="189" dy="0">七軒町は家数の伝承より防火</tspan><tspan x="189" dy="25">と共同店舗から読む</tspan></text></svg>