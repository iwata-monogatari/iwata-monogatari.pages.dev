<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">諏訪町・坂上町・西新町――国府台西縁の町名と戦後市街地のevidence図</title><desc id="desc">坂上町は地形の名から公共施設と市場の町へ広がった、西新町は道路・中泉軌道・学校・工場の交差点として読む、史料の読み分け：を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H289" stroke="#477c72" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#477c72" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">諏訪町・坂上町・西新町――国府台西縁の町名と戦後市街地</text><path d="M405 155 L651 370 H159 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="616" cy="342" r="44" fill="#dcebe5"/><circle cx="194" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">坂上町は地形の名から公共施</tspan><tspan x="405" dy="25">設と市場の町へ広がった</tspan></text><text x="616" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="616" dy="0">西新町は道路・中泉軌道・学</tspan><tspan x="616" dy="25">校・工場の交差点として読む</tspan></text><text x="194" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="194" dy="0">史料の読み分け：</tspan></text></svg>