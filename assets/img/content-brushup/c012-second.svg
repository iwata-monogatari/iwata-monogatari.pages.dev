<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">古墳から見る磐田── 台地と川がつくった、王たちの土地の論点図</title><desc id="d">公式情報で確認できる古墳関係の要点、四つの古墳群が語ること、確認できる記録を順に整理した図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#236b78"/></marker><linearGradient id="bg"><stop stop-color="#dceff1"/><stop offset="1" stop-color="#f8fcfc"/></linearGradient></defs><style>.title{font:700 29px 'Yu Mincho','Noto Serif JP',serif;fill:#173d46}.kicker{font:600 17px system-ui,sans-serif;fill:#236b78}.label{font:700 20px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#173d46}.num{font:700 18px system-ui,sans-serif;fill:#fff}.foot{font:500 16px system-ui,sans-serif;fill:#56646a}</style><rect width="1120" height="560" rx="30" fill="url(#bg)"/><text x="68" y="62" class="kicker">磐田物語｜第二図解｜本文の論点を横断</text><text x="68" y="112" class="title">古墳から見る磐田</text><text x="68" y="150" class="title">台地と川がつくった、王たちの土地…</text><rect x="70" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#236b78" stroke-width="2"/><circle cx="110" cy="300" r="21" fill="#236b78"/><text x="110" y="307" class="num" text-anchor="middle">1</text><text x="98" y="355" class="label" text-anchor="start"><tspan x="98" dy="0">公式情報で確認できる古墳関係の</tspan><tspan x="98" dy="28">要点</tspan></text><rect x="420" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#236b78" stroke-width="2"/><circle cx="460" cy="300" r="21" fill="#236b78"/><text x="460" y="307" class="num" text-anchor="middle">2</text><text x="448" y="355" class="label" text-anchor="start"><tspan x="448" dy="0">四つの古墳群が語ること</tspan></text><rect x="770" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#236b78" stroke-width="2"/><circle cx="810" cy="300" r="21" fill="#236b78"/><text x="810" y="307" class="num" text-anchor="middle">3</text><text x="798" y="355" class="label" text-anchor="start"><tspan x="798" dy="0">確認できる記録</tspan></text><path d="M36