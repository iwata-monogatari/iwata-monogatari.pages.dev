<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">明治の豊田橋――匂坂から天竜川を渡った民間有料橋のroute図</title><desc id="desc">明治16年の架橋を伝える三点の史料、民間有料橋とは何か――渡し賃から橋銭へ、匂坂の橋詰めから新道へ――点ではなく交通網を読むを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H290" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・ROUTE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">明治の豊田橋――匂坂から天竜川を渡った民間有料橋</text><path d="M92 310 C230 210,330 350,405 245 S610 155,718 260" fill="none" stroke="#6b638c" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="300" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="245" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="690" cy="250" r="25" fill="#fff" stroke="#244c57" stroke-width="4"/><text x="120" y="375" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="120" dy="0">明治16年の架橋を伝える三</tspan><tspan x="120" dy="25">点の史料</tspan></text><text x="405" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">民間有料橋とは何か――渡し</tspan><tspan x="405" dy="25">賃から橋銭へ</tspan></text><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="690" dy="0">匂坂の橋詰めから新道へ――</tspan><tspan x="690" dy="25">点ではなく交通網を読む</tspan></text></svg>