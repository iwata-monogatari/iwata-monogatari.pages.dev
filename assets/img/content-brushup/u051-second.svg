<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">東新町一〜三丁目――県営住宅団地から自治会へのevidence図</title><desc id="desc">昭和四十九年の団地造成――土地と町内組織は同時ではない、一〜三丁目と自治会――同じ東新町の中をどう分けたか、会館・浄化施設・公園――住宅地を生活圏にした場所を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H381" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">東新町一〜三丁目――県営住宅団地から自治会へ</text><path d="M405 155 L664 370 H146 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="629" cy="342" r="44" fill="#dcebe5"/><circle cx="181" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">昭和四十九年の団地造成――</tspan><tspan x="405" dy="25">土地と町内組織は同時では…</tspan></text><text x="629" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="629" dy="0">一〜三丁目と自治会――同じ</tspan><tspan x="629" dy="25">東新町の中をどう分けたか</tspan></text><text x="181" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="181" dy="0">会館・浄化施設・公園――住</tspan><tspan x="181" dy="25">宅地を生活圏にした場所</tspan></text></svg>