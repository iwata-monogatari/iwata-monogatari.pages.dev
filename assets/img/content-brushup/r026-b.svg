<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">金原明善── 私財を投じて天竜川と向き合った男を読む手順の時間軸</title><desc id="d">現地を調査、資金・人員を集める、治水工事を進める、記録と顕彰を残すの順に示す年表図</desc><style>.title{font:700 29px 'Yu Mincho','Noto Serif JP',serif;fill:#39271e}.sub{font:600 17px system-ui,sans-serif;fill:#7a4528}.label{font:700 18px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#39271e}.num{font:700 17px system-ui,sans-serif;fill:#fff}</style><rect width="1120" height="560" rx="30" fill="#fffaf5"/><rect x="0" y="0" width="1120" height="190" rx="30" fill="#f3e3d6"/><text x="68" y="62" class="sub">磐田物語｜時間の流れをつかむ</text><text x="68" y="110" class="title">金原明善</text><text x="68" y="148" class="title">私財を投じて天竜川と向き合った男を読む手順…</text><path d="M130 330h860" stroke="#7a4528" stroke-width="8" stroke-linecap="round"/><circle cx="170" cy="330" r="29" fill="#7a4528"/><text x="170" y="337" class="num" text-anchor="middle">1</text><text x="170" y="390" class="label" text-anchor="middle"><tspan x="170" dy="0">現地を調査</tspan></text><circle cx="430" cy="330" r="29" fill="#7a4528"/><text x="430" y="337" class="num" text-anchor="middle">2</text><text x="430" y="390" class="label" text-anchor="middle"><tspan x="430" dy="0">資金・人員を集める</tspan></text><circle cx="690" cy="330" r="29" fill="#7a4528"/><text x="690" y="337" class="num" text-anchor="middle">3</text><text x="690" y="390" class="label" text-anchor="middle"><tspan x="690" dy="0">治水工事を進める</tspan></text><circle cx="950" cy="330" r="29" fill="#7a4528"/><text x="950" y="337" class="num" text-anchor="middle">4</text><text x="950" y="390" class="label" text-anchor="middle"><tspan x="950" dy="0">記録と顕彰を残す</tspan></text></svg>