<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">於保村――旧村合併と大原・下大之郷・浜部の地域像のlayers図</title><desc id="desc">明治二十二年の於保村成立を資料から読む、大原・下大之郷・浜部という三つの町内記録、於保村成立と町内ごとの差から見えることを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H308" stroke="#b45f3d" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45f3d" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">於保村――旧村合併と大原・下大之郷・浜部の地域像</text><path d="M90 190 H720 L654 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L666 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">明治二十二年の於保村成立を</tspan><tspan x="405" dy="25">資料から読む</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">大原・下大之郷・浜部という</tspan><tspan x="405" dy="25">三つの町内記録</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">於保村成立と町内ごとの差か</tspan><tspan x="405" dy="25">ら見えること</tspan></text></svg>