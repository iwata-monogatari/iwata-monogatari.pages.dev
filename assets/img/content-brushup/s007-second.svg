<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">野箱・白拍子――地名伝承と石塔・墓の記憶を読み分けるの論点図</title><desc id="d">野箱の千手供養塔は伝承を記録する物証、白拍子という地名と傾城塚の複数説、石塔・塚・町名が伝える記憶の違いを順に整理した図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#3f6b43"/></marker><linearGradient id="bg"><stop stop-color="#e2eee0"/><stop offset="1" stop-color="#fbfdf9"/></linearGradient></defs><style>.title{font:700 29px 'Yu Mincho','Noto Serif JP',serif;fill:#273d29}.kicker{font:600 17px system-ui,sans-serif;fill:#3f6b43}.label{font:700 20px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#273d29}.num{font:700 18px system-ui,sans-serif;fill:#fff}.foot{font:500 16px system-ui,sans-serif;fill:#56646a}</style><rect width="1120" height="560" rx="30" fill="url(#bg)"/><text x="68" y="62" class="kicker">磐田物語｜第二図解｜本文の論点を横断</text><text x="68" y="112" class="title">野箱・白拍子</text><text x="68" y="150" class="title">地名伝承と石塔・墓の記憶を読み分ける</text><rect x="70" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#3f6b43" stroke-width="2"/><circle cx="110" cy="300" r="21" fill="#3f6b43"/><text x="110" y="307" class="num" text-anchor="middle">1</text><text x="98" y="355" class="label" text-anchor="start"><tspan x="98" dy="0">野箱の千手供養塔は伝承を記録</tspan><tspan x="98" dy="28">する物証</tspan></text><rect x="420" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#3f6b43" stroke-width="2"/><circle cx="460" cy="300" r="21" fill="#3f6b43"/><text x="460" y="307" class="num" text-anchor="middle">2</text><text x="448" y="355" class="label" text-anchor="start"><tspan x="448" dy="0">白拍子という地名と</tspan><tspan x="448" dy="28">傾城塚の複数説</tspan></text><rect x="770" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#3f6b43" stroke-width="2"/><circle cx="810" cy="300" r="21" fill="#3f6b43"/><text x="810" y="307" class="num" text-anchor="middle">3</text><text x="798" y="355" class="label" text-anchor="start"><tspan x="798" dy="0">石塔・塚・町名が伝える記憶の</tspan><tspan x="798" dy="28">違い</tspan></text><path d="M360 350h52" stroke="#3f6b43" stroke-width="4" marker-end="url(#a)"/><path d="M710 350h52" stroke="#3f6b43" stroke-width="4" marker-end="url(#a)"/><text x="560" y="510" class="foot" text-anchor="middle">事実・解釈・未確認事項を分け、関係が見える順序で読む</text></svg>