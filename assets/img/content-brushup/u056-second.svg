<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">長野地区の小字・地名資料――鮫島・野箱・草崎・前野・新島・長須賀のlayers図</title><desc id="desc">長野地区の一覧を、掲載単位から読む、水・道・屋敷・信仰の四群に分ける、長野地区の小字に残る境界・水利・生活語彙を記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#f6f1e8"/><path d="M42 112 H289" stroke="#6b638c" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b638c" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">長野地区の小字・地名資料――鮫島・野箱・草崎・前野・新島・長…</text><path d="M90 190 H720 L649 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L671 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">長野地区の一覧を、掲載単位</tspan><tspan x="405" dy="25">から読む</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">水・道・屋敷・信仰の四群に</tspan><tspan x="405" dy="25">分ける</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">長野地区の小字に残る境界・</tspan><tspan x="405" dy="25">水利・生活語彙</tspan></text></svg>