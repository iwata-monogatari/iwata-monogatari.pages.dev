<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">今之浦地区の成立前史――今之浦新田・田久保村請所・西瀬新田のlayers図</title><desc id="desc">今之浦は一つの旧村から生まれたのではない、明治9年の編入――川尻・西川尻・鳥之瀬へ、今之浦一～五丁目へ――旧区域を直線で結ばないを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef6f3"/><path d="M42 112 H340" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・LAYERS</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">今之浦地区の成立前史――今之浦新田・田久保村請所・西瀬新田</text><path d="M90 190 H720 L670 270 H140 Z" fill="#dcebe5" stroke="#244c57" stroke-width="2"/><path d="M120 255 H690 L650 335 H160 Z" fill="#f2dfc8" stroke="#244c57" stroke-width="2"/><path d="M165 320 H645 L610 398 H200 Z" fill="#dfe7ef" stroke="#244c57" stroke-width="2"/><text x="405" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">今之浦は一つの旧村から生ま</tspan><tspan x="405" dy="25">れたのではない</tspan></text><text x="405" y="300" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">明治9年の編入――川尻・西</tspan><tspan x="405" dy="25">川尻・鳥之瀬へ</tspan></text><text x="405" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244c57"><tspan x="405" dy="0">今之浦一～五丁目へ――旧区</tspan><tspan x="405" dy="25">域を直線で結ばない</tspan></text></svg>