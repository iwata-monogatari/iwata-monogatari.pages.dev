<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 445" width="1120" height="445" role="img" aria-labelledby="A0221-title A0221-desc" data-emaki-repair="A0221"><title id="A0221-title">岩井原の謎の碑 ――三郷の入会草刈場と明治20年の和議：本文の論点案内</title><desc id="A0221-desc">「謎の碑」から確認できるのは和議の記憶と移転の経過である。入会草刈場は所有境界だけでなく利用権の重なりから読む。明治20年の和議を年表の中心に置き碑文と行政文書で検証する</desc><rect width="1120" height="445" rx="24" fill="#f8f2e8"/><defs><marker id="A0221-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#926440"/></marker></defs><g font-family="Meiryo,sans-serif" fill="#513420"><text x="72" y="43" font-size="17">本文の論点案内</text><text x="72" y="88" font-size="28" font-weight="700">岩井原の謎の碑 ――三郷の入会草刈場と明治20年の和議</text><rect x="72" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="105" cy="196" r="18" fill="#926440"/><text x="105" y="202" font-size="18" fill="white" text-anchor="middle">1</text><text x="96" y="248" font-size="20">「謎の碑」から確認できる</text><text x="96" y="279" font-size="20">のは和議の記憶と移転の経</text><text x="96" y="310" font-size="20">過である</text><path d="M378 261.0H402" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0221-arrow)"/><rect x="412" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="445" cy="196" r="18" fill="#926440"/><text x="445" y="202" font-size="18" fill="white" text-anchor="middle">2</text><text x="436" y="248" font-size="20">入会草刈場は所有境界だけ</text><text x="436" y="279" font-size="20">でなく利用権の重なりから</text><text x="436" y="310" font-size="20">読む</text><path d="M718 261.0H742" fill="none" stroke="#926440" stroke-width="2" marker-end="url(#A0221-arrow)"/><rect x="752" y="162" width="296" height="198" rx="14" fill="#fffdf7" stroke="#a57852" stroke-width="2"/><circle cx="785" cy="196" r="18" fill="#926440"/><text x="785" y="202" font-size="18" fill="white" text-anchor="middle">3</text><text x="776" y="248" font-size="20">明治20年の和議を年表の中</text><text x="776" y="279" font-size="20">心に置き碑文と行政文書で</text><text x="776" y="310" font-size="20">検証する</text><text x="560" y="415" text-anchor="middle" font-size="16">本文の論点を並べた案内図。位置・距離を示す地図ではありません。</text></g></svg>