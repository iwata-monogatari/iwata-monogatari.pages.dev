<svg xmlns="http://www.w3.org/2000/svg" width="810" height="455" viewBox="0 0 810 455" role="img" aria-labelledby="title desc"><title id="title">今之浦用排水組合から悪水組合へ――低湿地を管理した明治の制度のevidence図</title><desc id="desc">排水は一軒の田だけでは解決できない、明治24年・30年・45年――組織と道路が重なる、「十年一作」の記憶から、昭和の区画整理へを記事固有の構成で示す。</desc><rect width="810" height="455" rx="24" fill="#eef3f7"/><path d="M42 112 H283" stroke="#aa7930" stroke-width="5"/><text x="42" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#aa7930" letter-spacing="2">磐田物語・EVIDENCE</text><text x="42" y="88" font-family="sans-serif" font-size="25" font-weight="700" fill="#244c57">今之浦用排水組合から悪水組合へ――低湿地を管理した明治の制度</text><path d="M405 155 L657 370 H153 Z" fill="#fff" stroke="#244c57" stroke-width="4"/><circle cx="405" cy="178" r="44" fill="#f3dfcf"/><circle cx="622" cy="342" r="44" fill="#dcebe5"/><circle cx="188" cy="342" r="44" fill="#dfe7ef"/><text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="405" dy="0">排水は一軒の田だけでは解決</tspan><tspan x="405" dy="25">できない</tspan></text><text x="622" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="622" dy="0">明治24年・30年・45年</tspan><tspan x="622" dy="25">――組織と道路が重なる</tspan></text><text x="188" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#244c57"><tspan x="188" dy="0">「十年一作」の記憶から、昭</tspan><tspan x="188" dy="25">和の区画整理へ</tspan></text></svg>