<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">寺谷廃寺遺跡――白鳳期の瓦が語る岩田の古代寺院の論点図</title><desc id="d">白鳳期の瓦が示すもの――寺名より先に年代を読む、台地の裾に置かれた寺――長者屋敷・瓦窯と地域を読む、「磐田寺」比定をどう扱うか――確認・伝承・未確認の境界を順に整理した図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#8b642e"/></marker><linearGradient id="bg"><stop stop-color="#f1e6cf"/><stop offset="1" stop-color="#fffbf3"/></linearGradient></defs><style>.title{font:700 29px 'Yu Mincho','Noto Serif JP',serif;fill:#45341f}.kicker{font:600 17px system-ui,sans-serif;fill:#8b642e}.label{font:700 20px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#45341f}.num{font:700 18px system-ui,sans-serif;fill:#fff}.foot{font:500 16px system-ui,sans-serif;fill:#56646a}</style><rect width="1120" height="560" rx="30" fill="url(#bg)"/><text x="68" y="62" class="kicker">磐田物語｜第二図解｜本文の論点を横断</text><text x="68" y="112" class="title">寺谷廃寺遺跡</text><text x="68" y="150" class="title">白鳳期の瓦が語る岩田の古代寺院</text><rect x="70" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#8b642e" stroke-width="2"/><circle cx="110" cy="300" r="21" fill="#8b642e"/><text x="110" y="307" class="num" text-anchor="middle">1</text><text x="98" y="355" class="label" text-anchor="start"><tspan x="98" dy="0">白鳳期の瓦が示すもの</tspan><tspan x="98" dy="28">寺名より先に年代を読む</tspan></text><rect x="420" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#8b642e" stroke-width="2"/><circle cx="460" cy="300" r="21" fill="#8b642e"/><text x="460" y="307" class="num" text-anchor="middle">2</text><text x="448" y="355" class="label" text-anchor="start"><tspan x="448" dy="0">台地の裾に置かれた寺</tspan><tspan x="448" dy="28">長者屋敷・瓦窯と地域を読む</tspan></text><rect x="770" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#8b642e" stroke-width="2"/><circle cx="810" cy="300" r="21" fill="#8b642e"/><text x="810" y="307" class="num" text-anchor="middle">3</text><text x="798" y="355" class="label" text-anchor="start"><tspan x="798" dy="0">「磐田寺」比定をどう扱うか</tspan><tspan x="798" dy="28">確認・伝承・未確認の境界</tspan></text><path d="M360 350h52" stroke="#8b642e" stroke-width="4" marker-end="url(#a)"/><path d="M710 350h52" stroke="#8b642e" stroke-width="4" marker-end="url(#a)"/><text x="560" y="510" class="foot" text-anchor="middle">事実・解釈・未確認事項を分け、関係が見える順序で読む</text></svg>