<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">観音山古墳――天竜の墓地に残る円墳を読むの論点図</title><desc id="d">墓地の高まりが古墳と確認されるまで、古墳・寺院・墓地という三つの時間を分ける、地域資料を発掘記録へつなぐ調査手順を順に整理した図</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#52657b"/></marker><linearGradient id="bg"><stop stop-color="#e1e8f0"/><stop offset="1" stop-color="#fafcff"/></linearGradient></defs><style>.title{font:700 29px 'Yu Mincho','Noto Serif JP',serif;fill:#293744}.kicker{font:600 17px system-ui,sans-serif;fill:#52657b}.label{font:700 20px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#293744}.num{font:700 18px system-ui,sans-serif;fill:#fff}.foot{font:500 16px system-ui,sans-serif;fill:#56646a}</style><rect width="1120" height="560" rx="30" fill="url(#bg)"/><text x="68" y="62" class="kicker">磐田物語｜第二図解｜本文の論点を横断</text><text x="68" y="112" class="title">観音山古墳</text><text x="68" y="150" class="title">天竜の墓地に残る円墳を読む</text><rect x="70" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#52657b" stroke-width="2"/><circle cx="110" cy="300" r="21" fill="#52657b"/><text x="110" y="307" class="num" text-anchor="middle">1</text><text x="98" y="355" class="label" text-anchor="start"><tspan x="98" dy="0">墓地の高まりが古墳と</tspan><tspan x="98" dy="28">確認されるまで</tspan></text><rect x="420" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#52657b" stroke-width="2"/><circle cx="460" cy="300" r="21" fill="#52657b"/><text x="460" y="307" class="num" text-anchor="middle">2</text><text x="448" y="355" class="label" text-anchor="start"><tspan x="448" dy="0">古墳・寺院・墓地と</tspan><tspan x="448" dy="28">いう三つの時間を分ける</tspan></text><rect x="770" y="258" width="290" height="190" rx="22" fill="#fff" stroke="#52657b" stroke-width="2"/><circle cx="810" cy="300" r="21" fill="#52657b"/><text x="810" y="307" class="num" text-anchor="middle">3</text><text x="798" y="355" class="label" text-anchor="start"><tspan x="798" dy="0">地域資料を発掘記録へ</tspan><tspan x="798" dy="28">つなぐ調査手順</tspan></text><path d="M360 350h52" stroke="#52657b" stroke-width="4" marker-end="url(#a)"/><path d="M710 350h52" stroke="#52657b" stroke-width="4" marker-end="url(#a)"/><text x="560" y="510" class="foot" text-anchor="middle">事実・解釈・未確認事項を分け、関係が見える順序で読む</text></svg>