<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 368" role="img" aria-labelledby="title desc">
<title id="title">磐南の教育実践を読む三つの接点</title><desc id="desc">農場で知識と実習をつなぎ、台所や運動場で生活と学びをつなぎ、合唱や学習支援で学校と地域をつなぐ。本文を整理した概念図。</desc>
<rect width="400" height="368" rx="16" fill="#eef5fa"/>
<g font-family="sans-serif" fill="#24485e">
<text x="24" y="36" font-size="18" font-weight="700">教室の外にも、学ぶ場所がある</text>
<g transform="translate(20 58)"><rect width="360" height="84" rx="10" fill="#fff" stroke="#c8dce9"/><rect width="6" height="84" rx="3" fill="#28678f"/><text x="20" y="31" font-size="20" font-weight="700">知識 と 実習</text><text x="20" y="60" font-size="16">農場・演習林で、手を動かして確かめる</text></g>
<g transform="translate(20 154)"><rect width="360" height="84" rx="10" fill="#fff" stroke="#c8dce9"/><rect width="6" height="84" rx="3" fill="#3b7899"/><text x="20" y="31" font-size="20" font-weight="700">学習 と 暮らし</text><text x="20" y="60" font-size="16">台所・運動場で、生活と身体から学ぶ</text></g>
<g transform="translate(20 250)"><rect width="360" height="84" rx="10" fill="#fff" stroke="#c8dce9"/><rect width="6" height="84" rx="3" fill="#5292b1"/><text x="20" y="31" font-size="20" font-weight="700">学校 と 地域</text><text x="20" y="60" font-size="16">合唱・観察・学習支援を通じて出会う</text></g>
<text x="24" y="354" font-size="12" fill="#5c7483">本文の比較から作成した概念図／磐田物語</text></g></svg>
