<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="title desc">
<title id="title">磐南の教育実践をたどる年表</title><desc id="desc">1903年細田多次郎が校長就任、1909年演習林実習、1914年農村女子家政講習、1926年中島静比が見付高女赴任、1949年黒沢正房が校章に関わる、1960年寺子町研修寮開設。各学校の異なる出来事を並べた年表。</desc>
<rect width="400" height="480" rx="16" fill="#f2f7fb"/>
<g font-family="sans-serif" fill="#24485e"><text x="24" y="36" font-size="20" font-weight="700">人物と実践の時間軸</text>
<path d="M40 77V413" stroke="#9cbfd4" stroke-width="3"/>
<g transform="translate(0 78)"><circle cx="40" r="7" fill="#25628a"/><text x="64" y="5" font-size="20" font-weight="700">1903</text><text x="64" y="30" font-size="17">細田多次郎、農学校の校長に</text></g>
<g transform="translate(0 145)"><circle cx="40" r="7" fill="#25628a"/><text x="64" y="5" font-size="20" font-weight="700">1909</text><text x="64" y="30" font-size="17">森町の演習林で実習</text></g>
<g transform="translate(0 212)"><circle cx="40" r="7" fill="#25628a"/><text x="64" y="5" font-size="20" font-weight="700">1914</text><text x="64" y="30" font-size="17">農村女子家政講習が始まる</text></g>
<g transform="translate(0 279)"><circle cx="40" r="7" fill="#25628a"/><text x="64" y="5" font-size="20" font-weight="700">1926</text><text x="64" y="30" font-size="17">中島静比、見付高女に赴任</text></g>
<g transform="translate(0 346)"><circle cx="40" r="7" fill="#25628a"/><text x="64" y="5" font-size="20" font-weight="700">1949</text><text x="64" y="30" font-size="17">黒沢正房、校章制定に関わる</text></g>
<g transform="translate(0 413)"><circle cx="40" r="7" fill="#25628a"/><text x="64" y="5" font-size="20" font-weight="700">1960</text><text x="64" y="30" font-size="17">寺子町研修寮が開かれる</text></g>
<text x="24" y="467" font-size="12" fill="#5c7483">寺田伊勢男「磐南地域の教育の先駆者たち」より作成</text></g></svg>
