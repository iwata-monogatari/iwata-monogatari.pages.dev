<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-labelledby="title"><title id="title">土地利用の交渉と研修所の開設</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#417b9d"/></marker></defs><rect width="400" height="430" rx="16" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="200" y="35" text-anchor="middle" font-size="20" fill="#243c4b" font-weight="700">土地から、学びの場へ</text><rect x="20" y="65" width="170" height="80" rx="10" fill="#edf5fa" stroke="#a9c8da"/><rect x="210" y="65" width="170" height="80" rx="10" fill="#edf5fa" stroke="#a9c8da"/><text x="105" y="95" text-anchor="middle" font-size="19" fill="#243c4b" font-weight="700">住民</text><text x="105" y="123" text-anchor="middle" font-size="14" fill="#243c4b" font-weight="400">暮らしを支える畑</text><text x="295" y="95" text-anchor="middle" font-size="19" fill="#243c4b" font-weight="700">大学</text><text x="295" y="123" text-anchor="middle" font-size="14" fill="#243c4b" font-weight="400">教育・研究の校地</text><path d="M105 150 L175 205" fill="none" stroke="#417b9d" stroke-width="2" marker-end="url(#arrow)"/><path d="M295 150 L225 205" fill="none" stroke="#417b9d" stroke-width="2" marker-end="url(#arrow)"/><ellipse cx="200" cy="235" rx="110" ry="42" fill="#dcecf5"/><text x="200" y="230" text-anchor="middle" font-size="19" fill="#243c4b" font-weight="700">交渉と提案</text><text x="200" y="253" text-anchor="middle" font-size="14" fill="#243c4b" font-weight="400">時田徳義と住民</text><path d="M200 281 L200 305" fill="none" stroke="#417b9d" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="316" width="330" height="80" rx="10" fill="#edf5fa" stroke="#a9c8da"/><text x="200" y="345" text-anchor="middle" font-size="19" fill="#243c4b" font-weight="400">地域の教室を支える関係</text><text x="200" y="373" text-anchor="middle" font-size="15" fill="#243c4b" font-weight="400">場所・運営・大学生の指導</text></g></svg>
