<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">問いに合わせて資料を分ける</title><desc id="d">今日の通行には最新の道路案内、工事の予定には配布資料、昔の来歴には出典付きの歴史資料を使います。</desc><rect width="720" height="520" rx="18" fill="#f5f1e8"/><g font-family="sans-serif" fill="#263c4a"><text x="40" y="60" font-size="31" font-weight="700">問いに合わせて資料を分ける</text><g font-size="28"><rect x="36" y="91" width="648" height="110" rx="10" fill="#e0ebef"/><text x="60" y="131" font-weight="700">今日、通れるか</text><text x="60" y="174">→ 最新の道路案内と現地の表示</text><rect x="36" y="218" width="648" height="110" rx="10" fill="#ede1ca"/><text x="60" y="259" font-weight="700">工事はいつの予定か</text><text x="60" y="301">→ 工事資料の期間・規制の説明</text><rect x="36" y="345" width="648" height="110" rx="10" fill="#e1e8da"/><text x="60" y="386" font-weight="700">橋はどう変わったか</text><text x="60" y="428">→ 出典を確かめて歴史資料へ</text></g><text x="40" y="492" font-size="19">橋の名前が同じでも、答えてほしい問いは別。</text></g></svg>