<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="t d"><title id="t">名前と指定区分を分ける読み方</title><desc id="d">同じ場所について、名前、指定区分、調査で分かった内容を別々に記録します。図の面積は実際の割合を示しません。</desc><rect width="900" height="640" rx="24" fill="#f4f1e8"/><g font-family="sans-serif" fill="#233e40"><text x="50" y="70" font-size="32" font-weight="bold">同じ場所を、違う問いで読む</text><rect x="50" y="108" width="800" height="125" rx="14" fill="#e0ece7"/><text x="78" y="151" font-size="28" font-weight="bold">名前の欄</text><text x="78" y="197" font-size="26">遺跡名・寺院跡の名前を、そのまま控える</text><rect x="50" y="257" width="800" height="125" rx="14" fill="#e3eaf2"/><text x="78" y="300" font-size="28" font-weight="bold">指定区分の欄</text><text x="78" y="346" font-size="26">公式一覧で史跡などの区分を確認する</text><rect x="50" y="406" width="800" height="125" rx="14" fill="#f1e4ce"/><text x="78" y="449" font-size="28" font-weight="bold">調査内容の欄</text><text x="78" y="495" font-size="26">本編・報告書で確認事項と推定を分ける</text><text x="50" y="587" font-size="25">名前だけで、指定や当時の姿を決めない。</text></g></svg>