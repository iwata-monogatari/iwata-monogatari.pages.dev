<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">木材流通を読む三つの問い</title><desc id="desc">川は輸送方法、問屋は受け渡しと取引、鉄路は駅までの接続を読む。経路図ではなく読書用の整理。</desc><rect width="720" height="700" rx="24" fill="#f4f2eb"/><g font-family="sans-serif" fill="#263e3e"><text x="40" y="62" font-size="32" font-weight="bold">木材流通を読む、三つの問い</text><rect x="30" y="95" width="660" height="155" rx="16" fill="#fff"/><text x="55" y="137" font-size="28" fill="#387a7a">01　川の本編</text><text x="55" y="183" font-size="32" font-weight="bold">木を、どう動かす？</text><text x="55" y="223" font-size="26">管流しと筏流しの説明を読む</text><rect x="30" y="270" width="660" height="155" rx="16" fill="#fff"/><text x="55" y="312" font-size="28" fill="#387a7a">02　問屋の本編</text><text x="55" y="358" font-size="32" font-weight="bold">誰が受け取り、取引する？</text><text x="55" y="398" font-size="26">運ぶ話と、売買の話を分ける</text><rect x="30" y="445" width="660" height="155" rx="16" fill="#fff"/><text x="55" y="487" font-size="28" fill="#387a7a">03　鉄路の本編</text><text x="55" y="533" font-size="32" font-weight="bold">駅まで、どうつなぐ？</text><text x="55" y="573" font-size="26">線路と周囲の道を分けて読む</text><text x="40" y="650" font-size="25">読む順番の整理です。経路図・年表ではありません。</text></g></svg>