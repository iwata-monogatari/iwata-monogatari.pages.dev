<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" role="img" aria-labelledby="title desc">
<title id="title">寺谷の散策前に読む本編3本</title><desc id="desc">形、説明の確かさ、周辺と時代という三つの読み方。地図や史跡の復元図ではありません。</desc>
<rect width="600" height="740" rx="24" fill="#f4f0e6"/>
<g font-family="sans-serif" fill="#263d36">
<text x="30" y="55" font-size="32" font-weight="700">寺谷の散策前に読む、本編3本</text>
<text x="30" y="99" font-size="27">見るものと、資料の解釈を分ける</text>
<rect x="25" y="130" width="550" height="160" rx="14" fill="#fff"/>
<circle cx="72" cy="176" r="28" fill="#47715a"/><text x="63" y="187" font-size="31" fill="#fff">1</text>
<text x="118" y="187" font-size="32" font-weight="700">形を知る</text>
<text x="50" y="234" font-size="29">銚子塚・小銚子塚の本編</text><text x="50" y="274" font-size="28">→ 円と方の違い</text>
<rect x="25" y="310" width="550" height="160" rx="14" fill="#fff"/>
<circle cx="72" cy="356" r="28" fill="#47715a"/><text x="63" y="367" font-size="31" fill="#fff">2</text>
<text x="118" y="367" font-size="32" font-weight="700">説明の確かさを読む</text>
<text x="50" y="414" font-size="29">論考第11号</text><text x="50" y="454" font-size="28">→ 記録と被葬者像の推定</text>
<rect x="25" y="490" width="550" height="160" rx="14" fill="#fff"/>
<circle cx="72" cy="536" r="28" fill="#47715a"/><text x="63" y="547" font-size="31" fill="#fff">3</text>
<text x="118" y="547" font-size="32" font-weight="700">周辺へ目を向ける</text>
<text x="50" y="594" font-size="29">長者屋敷遺跡の本編</text><text x="50" y="634" font-size="28">→ 場所と時代を区別</text>
<text x="30" y="694" font-size="26">読書の順序を示した図です。</text>
<text x="30" y="728" font-size="26">現地の地図・道順ではありません。</text>
</g></svg>
