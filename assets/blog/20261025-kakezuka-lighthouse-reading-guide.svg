<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
<title id="title">掛塚灯台の記録を本編3本で読む</title><desc id="desc">資料案内で手がかりを拾う、年表で前後を読む、論考で根拠と留保を確かめる。読書の順番であり歴史の年表ではない。</desc>
<rect width="720" height="540" rx="22" fill="#f3f6f3"/>
<g font-family="sans-serif" fill="#213e49"><text x="40" y="52" font-size="25" font-weight="bold">本編3本を読む順番</text><text x="40" y="84" font-size="18">記録の手がかりから、読み解きの限界へ</text></g>
<g fill="white" stroke="#b6c9c8" stroke-width="2"><rect x="38" y="108" width="644" height="108" rx="14"/><rect x="38" y="246" width="644" height="108" rx="14"/><rect x="38" y="384" width="644" height="108" rx="14"/></g>
<g fill="#326d75"><circle cx="80" cy="161" r="25"/><circle cx="80" cy="299" r="25"/><circle cx="80" cy="437" r="25"/><path d="M350 224h20l-10 14zM350 362h20l-10 14z"/></g>
<g font-family="sans-serif" font-size="23" text-anchor="middle" fill="white"><text x="80" y="169">1</text><text x="80" y="307">2</text><text x="80" y="445">3</text></g>
<g font-family="sans-serif" fill="#213e49"><g font-size="24" font-weight="bold"><text x="124" y="151">資料案内：手がかりを拾う</text><text x="124" y="289">港の近代年表：前後を読む</text><text x="124" y="427">第73号：根拠と留保を読む</text></g><g font-size="19"><text x="124" y="185">場所・名称・参照先を押さえる</text><text x="124" y="323">灯台・天気予報・救難所の項目へ</text><text x="124" y="461">OCRの限界、未確認のつながりを残す</text></g><text x="40" y="522" font-size="16">※歴史上の出来事の順番を示す図ではありません。</text></g>
</svg>
