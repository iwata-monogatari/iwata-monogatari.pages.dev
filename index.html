<style>
:root{
  --paper:#fffdf7; --paper-deep:#e9f3fa; --ink:#1f3a48; --ink-soft:#5b6b74;
  --brown:#2f7fa3; --brown-deep:#1f4f6f; --accent-blue:#356f88; --line:#d8e8ef;
  --card:#fffdf7; --shadow:0 1px 2px rgba(80,60,40,.06),0 8px 24px rgba(80,60,40,.07);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.85;font-size:20px;letter-spacing:.02em;}
a{color:var(--brown-deep);text-decoration:none;}
img{max-width:100%;display:block;}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;}
:target,section[id],h2[id],h3[id]{scroll-margin-top:88px;}
.searchhero{background:linear-gradient(180deg,var(--paper-deep),var(--paper));border-bottom:1px solid var(--line);position:relative;overflow:hidden;}
.searchhero .hero-bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden;}
.searchhero .hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center 38%;opacity:.22;filter:saturate(1.05);}
.searchhero .hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,253,247,.35) 0%,rgba(255,253,247,.75) 55%,var(--paper) 92%);}
.searchhero .inner{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:40px 22px 34px;text-align:center;}
.searchhero h1{font-family:"Shippori Mincho",serif;font-weight:800;font-size:clamp(34px,6vw,56px);line-height:1.2;margin:0 0 8px;color:var(--ink);letter-spacing:.08em;}
.searchhero .hero-subtitle{max-width:780px;margin:0 auto 14px;font-family:"Shippori Mincho",serif;font-size:clamp(14px,2.2vw,18px);font-weight:500;color:var(--brown-deep);line-height:1.8;letter-spacing:.03em;}
.searchhero .hero-lead{max-width:760px;margin:0 auto 18px;font-size:15px;color:var(--ink-soft);line-height:1.9;}
.searchhero .search-title{font-weight:700;font-size:13px;color:var(--brown-deep);letter-spacing:.08em;margin:0 0 10px;}
.search-box{position:relative;max-width:680px;margin:0 auto;}
.search-box input{width:100%;font-family:inherit;font-size:17px;color:var(--ink);background:#fff;border:2px solid var(--brown);border-radius:6px;padding:16px 52px 16px 20px;box-shadow:var(--shadow);outline:none;}
.search-box .si{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;fill:var(--brown);}
.search-lead-soft{text-align:center;margin:18px 0 2px;font-size:14px;color:var(--brown);letter-spacing:.02em;}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;}
.chips--soft{margin-top:10px;}
.chips--soft .chip{border-radius:999px;border-color:#e7ded0;background:#fffdf9;}
.chip{font-size:13px;color:var(--brown-deep);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;transition:.2s;}
.chip:hover{background:var(--brown);color:#fff;border-color:var(--brown);}
.chip--area{color:var(--accent-ink,var(--brown-deep));border-color:var(--accent,var(--line));background:var(--accent-soft,#fff);}
.chip--area:hover{background:var(--accent,var(--brown));border-color:var(--accent,var(--brown));color:#fff;}
.chip--area.area-fukude:hover{background:var(--c-fukude-accent);color:var(--c-fukude-ink);}
.results{min-width:0;padding:0;}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 2px;}
.res-clear{cursor:pointer;font-size:13px;color:var(--brown-deep);background:#f4f9fc;border:1px solid var(--line);border-radius:999px;padding:5px 14px;transition:.15s;}
.res-clear:hover{background:#e9f3fa;border-color:#6fb7d8;}
.results.is-hidden{display:none;}
.results h2{font-family:"Shippori Mincho",serif;font-size:21px;margin:30px 0 6px;}
.results .meta{font-size:13px;color:var(--ink-soft);margin:0 0 18px;}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding-bottom:20px;}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:16px 18px;box-shadow:var(--shadow);}
.rcard .rc{font-size:11px;letter-spacing:.12em;color:var(--accent-blue);font-weight:700;}
.rcard h3{font-family:"Shippori Mincho",serif;font-size:16px;margin:6px 0 0;line-height:1.5;}
.rcard:hover{border-color:var(--brown);}
.noresult{padding:30px 0 50px;color:var(--ink-soft);font-size:15px;}
.portal{max-width:1180px;margin:0 auto;padding:30px 22px 10px;}
.cols{display:grid;grid-template-columns:230px 1fr 280px;gap:28px;align-items:start;}
@media(min-width:981px){.cols>aside#area{grid-column:1;}.cols>.results{grid-column:2 / -1;}.cols>main{grid-column:2;}.cols>aside:last-child{grid-column:3;}}
.section{margin-bottom:40px;}
.eyebrow{font-size:11.5px;letter-spacing:.2em;color:var(--accent-blue);font-weight:700;margin:0 0 4px;}
.sectitle{font-family:"Shippori Mincho",serif;font-weight:700;font-size:23px;margin:0 0 14px;color:var(--ink);border-bottom:2px solid var(--brown);padding-bottom:8px;}
.lead-sm{font-size:14px;color:var(--ink-soft);margin:0 0 16px;}
.side-block{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 18px 20px;margin-bottom:20px;box-shadow:var(--shadow);}
.side-block h3{font-family:"Shippori Mincho",serif;font-size:16px;margin:0 0 12px;color:var(--ink);border-left:4px solid var(--accent-blue);padding-left:10px;}
.side-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:7px;}
.ooaza-search-lead{font-size:13px;color:var(--ink-soft);margin:0 0 12px;line-height:1.7;}
.side-list a{font-size:13px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:5px 11px;transition:.2s;}
.side-list a:hover{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue);}
.feature{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.feat-main{grid-column:1 / -1;position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--ink);min-height:230px;display:flex;align-items:flex-end;}
.feat-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62;}
.feat-main .ov{position:relative;padding:26px 28px;color:#fff;}
.feat-main .tagk{font-size:12px;letter-spacing:.16em;font-weight:700;color:#cfe2ec;}
.feat-main h3{font-family:"Shippori Mincho",serif;font-size:clamp(22px,3vw,30px);margin:6px 0 8px;text-shadow:0 1px 8px rgba(0,0,0,.5);}
.feat-main p{font-size:14px;margin:0;max-width:640px;color:#eef6fb;text-shadow:0 1px 6px rgba(0,0,0,.6);}
.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.subcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;box-shadow:var(--shadow);transition:.2s;}
.subcard:hover{transform:translateY(-2px);border-color:var(--brown);}
.subcard .tagk{font-size:11px;letter-spacing:.1em;color:var(--brown);font-weight:700;}
.subcard h4{font-family:"Shippori Mincho",serif;font-size:16px;margin:6px 0 6px;line-height:1.45;}
.subcard p{font-size:13px;color:var(--ink-soft);margin:0;}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.c{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;box-shadow:var(--shadow);transition:.2s;}
.c:hover{transform:translateY(-2px);border-color:var(--brown);}
.c .k{font-size:10.5px;letter-spacing:.08em;color:var(--brown);font-weight:700;}
.c h4{font-family:"Shippori Mincho",serif;font-size:15px;margin:4px 0 5px;line-height:1.38;}
.c p{font-size:12px;line-height:1.58;color:var(--ink-soft);margin:0;}
.c .more{color:var(--brown-deep);font-weight:700;}
.newbadge{display:inline-block;background:var(--brown);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:3px;margin-right:6px;vertical-align:middle;}
.gallery-band{background:var(--paper-deep);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:10px 0 40px;}
.gallery-band .inner{max-width:1180px;margin:0 auto;padding:34px 22px;}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;}
.hscroll::-webkit-scrollbar{height:8px;}
.hscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
.gcard{flex:0 0 220px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:var(--shadow);}
.gcard img{width:100%;height:160px;object-fit:cover;background:#eee;}
.gcard .gc{padding:11px 13px;}
.gcard .gt{font-family:"Shippori Mincho",serif;font-size:14px;margin:0 0 3px;line-height:1.4;}
.gcard .gm{font-size:11.5px;color:var(--ink-soft);margin:0;}
.band-soft{background:var(--paper-deep);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.band-soft .inner{max-width:1180px;margin:0 auto;padding:44px 22px;}
.tags-row{display:flex;flex-wrap:wrap;gap:8px;}
.tags-row span{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink-soft);}
.memory{max-width:1180px;margin:0 auto;padding:48px 22px;text-align:center;}
.memory h2{font-family:"Shippori Mincho",serif;font-size:24px;margin:0 0 14px;}
.memory p{max-width:680px;margin:0 auto 22px;color:var(--ink-soft);font-size:15px;}
.memory .mlinks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.memory .mlinks a{font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:10px 18px;color:var(--ink);transition:.2s;}
.memory .mlinks a:hover{border-color:var(--brown);color:var(--brown-deep);}
@media(max-width:980px){ .cols{grid-template-columns:1fr;} .side-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;} }
@media(max-width:760px){ :target,section[id],h2[id],h3[id]{scroll-margin-top:96px;} }
@media(max-width:680px){ .rgrid,.cards,.subgrid{grid-template-columns:1fr;} .feature{grid-template-columns:1fr;} .side-row{grid-template-columns:1fr;} }
.is-hidden{display:none!important;}
/* ── 公的資料・運営者案内カード（右サイドバー） ── */
.sidebar-card{background:#fff;border:1px solid #d8e8f5;border-radius:14px;padding:16px;box-shadow:0 4px 14px rgba(20,74,112,.07);margin-bottom:20px;}
.sidebar-card h2{margin:0 0 10px;font-size:16px;color:#145c8f;border-bottom:2px solid #8fc9ee;padding-bottom:6px;font-family:"Shippori Mincho",serif;font-weight:700;}
.sidebar-card-lead{margin:0 0 12px;font-size:12.5px;line-height:1.7;color:#4f6473;}
.public-link-group + .public-link-group{margin-top:14px;}
.public-link-group h3{margin:0 0 8px;font-size:13px;color:#285b7d;border-left:4px solid #8fc9ee;padding-left:8px;font-family:"Shippori Mincho",serif;}
.compact-link-list,.operator-link-list{list-style:none;margin:0;padding:0;display:grid;gap:7px;}
.compact-link-list a,.operator-link-list a{display:block;padding:7px 9px;border-radius:8px;background:#f4f9fd;color:#1f5f8b;text-decoration:none;font-size:12.5px;line-height:1.45;border:1px solid #e2eff8;transition:.2s;}
.compact-link-list a:hover,.operator-link-list a:hover{background:#e7f4fc;color:#0d4f7d;}
.operator-banner{display:block;margin:4px 0 12px;padding:16px;border-radius:16px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#1c78b5 0%,#62b7e8 100%);box-shadow:0 8px 18px rgba(28,120,181,.22);transition:.2s;}
.operator-banner:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(28,120,181,.28);}
.operator-banner-label{display:inline-block;margin-bottom:8px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.22);font-size:11px;letter-spacing:.04em;}
.operator-banner strong{display:block;margin-bottom:8px;font-size:15.5px;line-height:1.45;font-family:"Shippori Mincho",serif;}
.operator-banner span:last-child{display:block;font-size:12px;line-height:1.65;}

/* --- renovation additions --- */
.cat-head{margin-bottom:22px;}
.cat-head h2{font-family:"Shippori Mincho",serif;font-weight:700;font-size:23px;margin:0 0 6px;color:var(--ink);border-bottom:2px solid var(--brown);padding-bottom:8px;}
.section-lead{font-size:14px;color:var(--ink-soft);margin:0;line-height:1.8;}
.memory-cta-lead{max-width:680px;margin:0 auto 8px;color:var(--ink);font-size:15px;font-weight:500;}
.primary-button,.secondary-button{display:inline-block;padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;border:1px solid transparent;}

  /* --- Renovation A & B District Card styles --- */
  .c[class*="area-"] {
    background: var(--accent-soft);
    border-top: 3px solid var(--accent);
    min-height: 96px; /* 160px * 0.6 = 96px */
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .c[class*="area-"] .k {
    color: var(--accent);
  }
  .c.area-fukude {
    border-top-color: var(--c-fukude);
  }
  .c.area-fukude .k {
    color: var(--c-fukude-ink);
  }

  /* --- DISTRICTS × MAIN CONTENTS 統合カード (2026-07-10) --- */
  .district-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .district-card__name {
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 17px;
    margin: 0;
    padding-bottom: 6px;
    color: var(--ink);
    border-bottom: 2px solid var(--accent, var(--brown));
    display: inline-block;
  }
  .district-card__actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: auto;
    padding-top: 4px;
    min-width: 0;
  }
  .district-card__cta-primary {
    display: block;
    width: 100%;
    box-sizing: border-box;
    min-width: 0;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    line-height: 1.4;
    font-weight: 700;
    text-decoration: none;
    text-align: center;
    white-space: normal;
    word-break: keep-all;
    overflow-wrap: break-word;
    transition: .2s;
  }
  .district-card__cta-primary {
    background: var(--brown-deep);
    color: #fff;
    border: 1px solid var(--brown-deep);
  }
  .district-card__cta-primary:hover {
    opacity: .88;
  }

  /* =========================================
     TOP / NEW CONTENTS
     新着記事：左カラム高さ維持版
  ========================================= */
  .news-section {
    overflow: hidden;
  }
  /* 新着記事リスト */
  .news-list,
  .new-article-list {
    list-style: none;
    margin: 1rem 0 0;
    padding: 0;
    display: grid;
    gap: 0.42rem;
  }
  /* 24件表示時のみ有効化する */
  .news-list.is-scroll,
  .new-article-list.is-scroll {
    max-height: 34rem;
    overflow-y: auto;
    padding-right: 0.25rem;
    scrollbar-width: thin;
  }
  /* 各記事 */
  .news-item,
  .new-article-item {
    position: relative;
    margin: 0;
    padding: 0 0 0 14px;
  }
  .news-item::before,
  .new-article-item::before {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    width: 8px;
    height: 8px;
    margin-top: -4px;
    border-radius: 50%;
    background: var(--district-color, #c9c2b4);
  }
  .news-link,
  .new-article-link {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.5rem;
    min-height: 34px;
    padding: 0.48rem 0.65rem;
    border: 1px solid rgba(120, 90, 50, 0.16);
    border-radius: 10px;
    background: rgba(255, 252, 246, 0.82);
    color: inherit;
    text-decoration: none;
    overflow: hidden;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .news-link:hover,
  .news-link:focus-visible,
  .new-article-link:hover {
    background: rgba(255, 248, 235, 0.98);
    border-color: rgba(120, 90, 50, 0.35);
  }
  .new-article-link:hover .new-article-title {
    text-decoration: underline;
  }
  .news-meta {
    display: flex;
    align-items: center;
    gap: 0.32rem;
    min-width: 0;
  }
  .news-date,
  .new-article-date {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.78rem;

      if (category.indexOf(categoryAreas[i][0]) === 0) {
        return categoryAreas[i][1];
      }
    }
    if (url === '/inotani/' || /^\/inotani\//.test(url)) return 'area-mitsuke';
    if (url === '/c028.html') return 'area-mitsuke';
    if (url === '/u004.html') return 'area-mikuriya';
    if (/^\/m/.test(url)) return 'area-mitsuke';
    if (/^\/n/.test(url)) return 'area-nakaizumi';
    if (/^\/u/.test(url)) return 'area-mikuriya';
    if (/^\/t/.test(url)) return 'area-toyoda';
    if (/^\/s/.test(url)) return 'area-nanbu';
    if (/^\/k/.test(url)) return 'area-koyo';
    if (/^\/r/.test(url) || /^\/area\/ryuyo/.test(url)) return 'area-ryuyo';
    if (/^\/f/.test(url)) return 'area-fukude';
    if (/^\/y/.test(url)) return 'area-toyooka';
    return '';
  }
  function newArticleDistrict(item){
    var cls = newArticleAreaClass(item);
    if (!cls) return '';
    return cls.replace(/^area-/, '');
  }

  function collapseSeries(items){
    // 「（特集・全Nページ公開）」の代表ページに続く同日公開の後続ページは、
    // トップの新着表示では代表ページ1件にまとめる（下層のupdates.htmlでは個別表示のまま）。
    var out = [];
    for (var i = 0; i < items.length; i++){
      var it = items[i];
      if (it.__consumed) continue;
      out.push(it);
      var m = it.title.match(/特集.*?全(\d+)ページ/);
      if (m){
        var need = parseInt(m[1], 10) - 1;
        var j = i + 1;
        while (need > 0 && j < items.length && items[j].date === it.date){
          items[j].__consumed = true;
          need--; j++;
        }
      }
    }
    return out;
  }

  fetch('/data/new-articles.json?t=' + new Date().getTime())
    .then(function(res){ return res.json(); })
    .then(function(data){
      data.sort(function(a, b){
        if (a.date < b.date) return 1;
        if (a.date > b.date) return -1;
        var ap = a.published_at || '';
        var bp = b.published_at || '';
        if (ap < bp) return 1;
        if (ap > bp) return -1;
        return 0;
      });
      data = collapseSeries(data);
      var list = document.getElementById('new-article-list');
      if (!list) return;
      list.innerHTML = '';
      data.slice(0, 14).forEach(function(item){
        var li = document.createElement('li');
        li.className = 'new-article-item news-item';
        var district = newArticleDistrict(item);
        if (district) li.setAttribute('data-district', district);

        var a = document.createElement('a');
        a.href = item.url;
        a.className = 'new-article-link news-link';
        var areaClass = newArticleAreaClass(item);
        if (areaClass) a.classList.add(areaClass);

        var metaSpan = document.createElement('span');
        metaSpan.className = 'news-meta';

        var dateSpan = document.createElement('time');
        dateSpan.className = 'new-article-date news-date';
        dateSpan.dateTime = item.date;
        dateSpan.textContent = item.date;

        var catSpan = document.createElement('span');
        catSpan.className = 'new-article-category news-tag';
        catSpan.textContent = item.category;

        var titleSpan = document.createElement('span');
        titleSpan.className = 'new-article-title news-title';
        titleSpan.textContent = item.title;

        metaSpan.appendChild(dateSpan);
        metaSpan.appendChild(catSpan);
        a.appendChild(metaSpan);
        a.appendChild(titleSpan);

        var arrow = document.createElement('span');
        arrow.className = 'new-article-arrow news-arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = '→';
        a.appendChild(arrow);

        li.appendChild(a);
        list.appendChild(li);
      });
    })
    .catch(function(err){
      console.error('Failed to load new articles:', err);
    });
})();
</script>
